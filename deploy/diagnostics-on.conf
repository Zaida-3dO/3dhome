# ---------------------------------------------------------------------------
# 3dHome - the diagnostics save endpoint, ON.
#
# Installed by deploy/entrypoint.sh as /etc/nginx/home3d-diagnostics.conf when
# HOME3D_DIAGNOSTICS_DIR names a usable directory, with the placeholder below
# replaced by that (sanitised, absolute) path. Included at SERVER level by
# deploy/nginx.conf. Needs the njs module, which the entrypoint loads in
# /etc/nginx/nginx.conf in the same step. See docs/diagnostics.md.
#
# The hostname is internet-reachable, so every bound is here on purpose:
#   - write-only: this location is the ONLY route, it only ever writes, and
#     the directory is outside the web root, so nothing saved is readable
#     over HTTP;
#   - body capped at 256k (nginx answers 413 itself before njs runs), and
#     buffered in memory so njs sees the whole body;
#   - a shared rate limit (zone defined at http level in nginx.conf):
#     6 saves a minute with a burst of 3, answered 429 beyond that;
#   - a TOTAL cap on files and bytes in the directory (507 past it): the
#     rate limit bounds the rate, not the total;
#   - njs validates JSON, the schema version and the document structure, and
#     names the file itself
#     (deploy/njs/diagnostics.js) - no client-supplied path ever reaches fs.
# ---------------------------------------------------------------------------
js_path "/etc/nginx/njs/";
js_import home3d_diag from diagnostics.js;

location = /api/diagnostics {
    set $home3d_diag_dir "__DIAG_DIR__";
    # Storage cap (HOME3D_DIAGNOSTICS_MAX_FILES / _MAX_BYTES; defaults 500 runs,
    # 100 MB): past either, every save is 507 until the directory is cleared.
    set $home3d_diag_max_files "__DIAG_MAX_FILES__";
    set $home3d_diag_max_bytes "__DIAG_MAX_BYTES__";

    limit_req zone=home3d_diag burst=3 nodelay;
    limit_req_status 429;

    client_max_body_size 256k;
    client_body_buffer_size 256k;
    client_body_in_single_buffer on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    js_content home3d_diag.save;
}
