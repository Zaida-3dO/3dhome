# ---------------------------------------------------------------------------
# 3dHome - the diagnostics save endpoint, OFF (the default).
#
# Included at server level by deploy/nginx.conf, from
# /etc/nginx/home3d-diagnostics.conf. The Dockerfile installs THIS file there;
# deploy/entrypoint.sh swaps in diagnostics-on.conf only when
# HOME3D_DIAGNOSTICS_DIR names a usable directory. See docs/diagnostics.md.
#
# Off means a clear JSON 404 rather than falling through to the static-file
# location, so the /diagnostics page can tell the user why Save did nothing.
# (The page also hides Save up front: config.js carries diagnosticsSave:false.)
# ---------------------------------------------------------------------------
location = /api/diagnostics {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    return 404 '{"ok":false,"error":"saving diagnostic runs is not enabled on this server"}';
}
