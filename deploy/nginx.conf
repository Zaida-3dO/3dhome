# ---------------------------------------------------------------------------
# 3dHome - nginx server config.
#
# Installed by the Dockerfile as /etc/nginx/conf.d/default.conf. Two
# placeholders are substituted at CONTAINER START by deploy/entrypoint.sh:
# one for the frame-ancestors source list (from HOME3D_FRAME_ANCESTORS - who
# may EMBED us) and one for the CORS allow-list map body (from
# HOME3D_CORS_ORIGINS - who may FETCH from us).
#
# Both are deployment configuration, and the owner's real hostnames must never
# be baked into a public image. They are deliberately separate variables: the
# two lists overlap today but answer different questions, and a page can
# legitimately need one permission without the other.
#
# ⚠️ BOTH SUBSTITUTIONS ARE GLOBAL over this whole file. Do not write either
# placeholder token in a comment - prose mentioning it is rewritten too, and
# the multi-line CORS body turns the surrounding comment into garbage that
# nginx then reads as directives. That is why this paragraph describes the
# tokens instead of spelling them.
#
# This serves static files and does nothing else. There is no application
# server, no bundler output, no generated assets: the files copied into the
# image are the files that are served.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# CORS allow-list.
#
# Access-Control-Allow-Origin takes exactly ONE origin or the wildcard `*`. It
# cannot take a list. So the standard nginx pattern is this map: match the
# request's Origin against the allow-list and echo it straight back, or emit
# the empty string for anything unrecognised. nginx omits a header entirely
# when its value is empty, so a non-allow-listed origin receives no
# Access-Control-Allow-Origin at all - which is precisely the "denied" answer
# the browser expects.
#
# WHY NOT `*`. The app serves a private house profile - a floor plan of a real
# home, plus renovation overlays and surveyed room specs. The URLs are already
# public and unauthenticated, so this is about discoverability rather than
# secrecy, but `*` would invite any page on the internet to read and re-render
# it. An explicit list costs nothing and keeps that closed.
#
# WHY NOT `null` EITHER. It is tempting when embedding from a sandboxed iframe,
# whose origin is the opaque value `null`. Do not: EVERY sandboxed iframe and
# every file:// page on earth sends `Origin: null`, so allow-listing it is
# strictly WORSE than `*` - it grants the same universal access while looking
# targeted. The correct fix for a sandboxed embedder is for the embedder to
# keep a real origin (allow-same-origin), not for the server to trust `null`.
#
# The default is the empty string: no origin matches, no CORS header is ever
# sent, and the app behaves exactly as it did before this block existed.
# Same-origin fetches are unaffected either way - CORS simply does not apply
# to them, so the direct https://<host>/ deployment needs no entry here.
# ---------------------------------------------------------------------------
#
# A NOTE ON CASE. nginx matches literal map keys case-INSENSITIVELY, so
# `HTTPS://HAVEN.EXAMPLE.COM` also matches an allow-listed
# `https://haven.example.com`. The value emitted is the one written in the
# map entry - our own lower-cased string - NOT the attacker's casing, so
# nothing unexpected is ever reflected into the response header and the
# behaviour is safe. It is called out only so the next reader does not have
# to re-derive it: browsers always send the scheme and host lower-cased, so
# a mixed-case Origin arrives solely from a hand-crafted request, and such a
# request gains exactly nothing from the match.
map $http_origin $home3d_cors_origin {
    default        "";
    __CORS_ORIGINS__
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version to every visitor.
    server_tokens off;

    # -----------------------------------------------------------------------
    # Compression
    #
    # vendor/three.js is already MINIFIED (r160 UMD build) at ~670 KB -- that
    # is simply what a minified-but-not-tree-shaken r160 UMD build weighs,
    # not an unminified file with an easy saving available. It gzips to
    # ~169 KB on the wire, alongside a large scene module; there is no build
    # step to pre-compress either, so gzip on the fly is the whole story.
    # Images are excluded (already compressed); gzip_min_length skips the
    # tiny files where the framing overhead would exceed the saving.
    # -----------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types
        text/html
        text/css
        text/plain
        application/javascript
        text/javascript
        application/json
        image/svg+xml;

    # -----------------------------------------------------------------------
    # Security headers, applied site-wide.
    #
    # add_header is inherited by a location block ONLY if that block sets no
    # add_header of its own. Two locations below do set their own, so they
    # repeat what they need. That is an nginx footgun worth stating out loud:
    # adding a single header to a location silently drops every inherited one.
    # -----------------------------------------------------------------------

    # frame-ancestors: the allow-list of origins permitted to embed this app in
    # an iframe. Substituted at container start; defaults to 'self'.
    #
    # X-Frame-Options IS DELIBERATELY NOT SET, anywhere in this file. It has
    # only DENY and SAMEORIGIN - no allow-list form - so any value would break
    # every cross-origin embed this app is designed for. frame-ancestors
    # supersedes it in all current browsers and is the only header that can
    # express "these specific origins". If an audit tool asks for
    # X-Frame-Options, the correct answer is that frame-ancestors is present.
    add_header Content-Security-Policy "frame-ancestors __FRAME_ANCESTORS__" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -----------------------------------------------------------------------
    # config.js - never cached.
    #
    # It is regenerated from the environment on every container start and it
    # carries the Home Assistant token. A cached copy would survive a token
    # rotation or a redeploy and keep the app pointed at, or authenticating
    # with, stale values - and would leave the old token sitting in a browser
    # cache on disk. no-store is the strongest of the cache directives: do not
    # write this to any cache at all.
    # -----------------------------------------------------------------------
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        # Repeated because this block sets add_header and therefore inherits
        # none of the server-level headers above.
        add_header Content-Security-Policy "frame-ancestors __FRAME_ANCESTORS__" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        default_type application/javascript;
        try_files $uri =404;
    }

    # config.json is the operator's own file, bind-mounted rather than
    # generated. Same reasoning: it may hold the token, and it is edited in
    # place between restarts.
    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Content-Security-Policy "frame-ancestors __FRAME_ANCESTORS__" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        default_type application/json;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # index.html - revalidate every time.
    #
    # It is small, and it is what carries the stamped ?v= values that
    # invalidate everything else. Caching it would pin a client to an old set
    # of asset URLs and defeat the entire cache-busting scheme.
    # -----------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors __FRAME_ANCESTORS__" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # Static assets - cached hard.
    #
    # Safe precisely because every reference to these files carries a ?v=
    # stamped from APP_VERSION at container start: a new version means new
    # URLs, so a year-long cache never serves a stale file for a URL that
    # changed. immutable tells the browser not to even revalidate on reload.
    #
    # No add_header here, so the server-level security headers are inherited.
    # -----------------------------------------------------------------------
    location ~* \.(js|css|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|otf|glb|gltf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "frame-ancestors __FRAME_ANCESTORS__" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # House profiles and other JSON. Short cache: a bind-mounted house profile
    # is edited in place while iterating on a floor plan, and a one-year cache
    # would make every edit look like it had no effect.
    #
    # THIS is the block that needs CORS. The scene fetches its geometry and
    # rooms as JSON with fetch(), and a cross-origin fetch - unlike an <img>
    # or a <script> - is blocked outright without an Access-Control-Allow-Origin
    # response header. An embedded tile on another origin therefore renders
    # blank no matter how correct frame-ancestors is: being allowed to EMBED
    # the app and being allowed to FETCH its data are two separate permissions,
    # and this app needs both.
    #
    # Note the ordering hazard: /config.js and /config.json are matched by
    # their own `location =` blocks ABOVE this one. An exact-match location
    # beats a regex location in nginx, so those two keep winning and get NO
    # CORS header - which is deliberate and load-bearing, because both may
    # carry the Home Assistant token. Do not add CORS to them.
    location ~* \.json$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300" always;

        # Echoed only for an allow-listed origin; empty (and therefore omitted
        # entirely by nginx) for everyone else. See the map at the top.
        add_header Access-Control-Allow-Origin $home3d_cors_origin always;

        # NOT OPTIONAL, because the line above says `public, max-age=300`. The
        # response varies by request Origin, so without this a shared cache is
        # free to serve the copy it stored for one origin to a different one -
        # handing out either a header naming the wrong origin (the fetch fails
        # for a caller that should have been allowed) or a valid header to a
        # caller that should have been refused. Vary: Origin is what makes the
        # cache key include the origin and keeps the two apart.
        #
        # Only "Origin" is listed: `gzip_vary on` at the server level already
        # emits its own `Vary: Accept-Encoding`, and naming it here too
        # produced a duplicate token across two header lines (harmless, but
        # noise). The two headers combine to `Origin, Accept-Encoding`.
        add_header Vary "Origin" always;

        # Repeated because this block sets add_header and therefore inherits
        # none of the server-level headers above.
        add_header Content-Security-Policy "frame-ancestors __FRAME_ANCESTORS__" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # A liveness endpoint that does not depend on any file being present.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything else: serve the file, or 404. No SPA catch-all rewrite - this
    # is a multi-page static site (index.html plus the spec pages), and
    # rewriting a missing asset to index.html would turn a 404 into a
    # confusing 200 that serves HTML where JavaScript was expected.
    location / {
        try_files $uri $uri/ =404;
    }

    # Never serve dotfiles. Belt and braces: .env and friends are excluded from
    # the image by .dockerignore, but a bind mount could reintroduce one.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
