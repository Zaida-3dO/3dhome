<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3dHome</title>
  <script>
    // Favicon: only registered in standalone mode.
    // ?preview=true / ?embed=1 run as iframes inside a host dashboard, where a
    // favicon request is pointless - the host owns the tab. Inserting the
    // <link> conditionally avoids the request entirely.
    //
    // The icon is an inline SVG data URI rather than a file. There is no
    // assets/icons/ in this repo, so a path here would 404 on every standalone
    // load; a data URI also costs no extra request and cannot fall out of sync
    // with a file someone forgets to ship.
    (() => {
      const p = new URLSearchParams(window.location.search);
      const isPreview = p.get('preview') === 'true';
      const isEmbed = p.get('embed') === '1' || p.get('embed') === 'true';
      if (!isPreview && !isEmbed) {
        const svg =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' +
          '<rect width="32" height="32" rx="7" fill="#0f0f1a"/>' +
          '<path d="M6 15.5 16 7l10 8.5" fill="none" stroke="#8ab4ff" ' +
          'stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
          '<path d="M8.5 14.5V25h15V14.5" fill="none" stroke="#8ab4ff" ' +
          'stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
          '<rect x="13.5" y="18" width="5" height="7" rx="0.8" fill="#ffd479"/>' +
          '</svg>';
        const link = document.createElement('link');
        link.rel = 'icon';
        link.type = 'image/svg+xml';
        link.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
        document.head.appendChild(link);
      }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f1a; color: #fff; overflow: hidden; }

    /* Back button */
    .back-btn {
      position: fixed; top: 16px; left: 16px; z-index: 40;
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.5); backdrop-filter: blur(12px);
      color: #fff; font-size: 13px; font-weight: 500; cursor: pointer;
      text-decoration: none; transition: background 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); }
    .back-btn svg { width: 16px; height: 16px; }

    /* Title overlay */
    .title-overlay {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 30;
      text-align: center; pointer-events: none;
    }
    .title-overlay h1 { font-size: 18px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
    .title-overlay p { font-size: 11px; opacity: 0.5; margin-top: 2px; }

    /* Compass overlay — pinned bottom-right of the view. OFF by default
       (display:none). The whole rose (#compass-rose) rotates each frame to keep
       North pointing at model-north as the camera orbits. See the compass IIFE
       near the bottom of this file. */
    .compass {
      position: fixed; right: 16px; bottom: 16px; z-index: 35;
      width: 84px; height: 84px; display: none; pointer-events: none;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
    }
    .compass.visible { display: block; }

    /* Hover tooltip */
    .room-tooltip {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      padding: 5px 12px; border-radius: 6px; background: rgba(0,0,0,0.7);
      color: #fff; font-size: 12px; z-index: 20; pointer-events: none;
      display: none;
    }
    .room-tooltip.visible { display: block; }

    /* Lights button */
    /* Top-right button group */
    .top-right-btns {
      position: fixed; top: 16px; right: 16px; z-index: 40;
      display: flex; gap: 8px;
    }
    .top-btn {
      padding: 8px 16px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.5); backdrop-filter: blur(12px);
      color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .top-btn:hover { background: rgba(255,255,255,0.1); }

    /* 3D container */
    #scene-container { width: 100vw; height: 100vh; touch-action: none; }

    /* ---- Light Control Panel ---- */
    .panel {
      position: fixed; top: 0; right: 0; width: 300px; height: 100%;
      background: rgba(10,10,20,0.92); backdrop-filter: blur(20px);
      border-left: 1px solid rgba(255,255,255,0.08);
      color: #fff; display: flex; flex-direction: column; z-index: 50;
      transform: translateX(100%); transition: transform 0.25s ease;
    }
    .panel.open { transform: translateX(0); }

    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: space-between;
    }
    .panel-header-left { display: flex; align-items: center; gap: 8px; }
    .panel-back { background: none; border: none; color: #888; cursor: pointer; font-size: 16px; padding: 0; }
    .panel-title { font-size: 14px; font-weight: 600; }
    .panel-area { font-size: 11px; opacity: 0.4; }
    .panel-close { background: none; border: none; color: #666; cursor: pointer; font-size: 18px; padding: 0; }

    .panel-body { flex: 1; overflow-y: auto; padding: 4px 0; }

    /* Room list items */
    .room-list-item {
      width: 100%; padding: 10px 16px; border: none;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      background: transparent; color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      text-align: left; transition: background 0.15s;
    }
    .room-list-item:hover { background: rgba(255,255,255,0.04); }
    .room-list-name { font-size: 13px; font-weight: 500; }
    .room-list-area { font-size: 10px; opacity: 0.4; }
    .room-list-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #333; flex-shrink: 0;
    }
    .room-list-dot.on { background: #ffd43b; box-shadow: 0 0 8px #ffd43b; }

    /* Control section */
    .control-section { padding: 8px 16px; }
    .control-group { margin-bottom: 20px; }
    .control-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .control-label { font-size: 12px; font-weight: 600; opacity: 0.7; }

    /* Toggle switch */
    .toggle {
      width: 40px; height: 22px; border-radius: 11px; border: none;
      cursor: pointer; position: relative; transition: background 0.2s;
      background: rgba(255,255,255,0.15); padding: 0;
    }
    .toggle.on { background: #6366f1; }
    .toggle.galaxy.on { background: #7c3aed; }
    .toggle-knob {
      width: 16px; height: 16px; border-radius: 50%; background: #fff;
      position: absolute; top: 3px; left: 3px; transition: left 0.2s;
    }
    .toggle.on .toggle-knob { left: 21px; }

    /* Slider */
    .slider-row { margin-bottom: 10px; }
    .slider-label { font-size: 11px; opacity: 0.5; margin-bottom: 4px; }
    .slider {
      width: 100%; height: 6px; border-radius: 3px;
      -webkit-appearance: none; appearance: none;
      background: rgba(255,255,255,0.15); outline: none; cursor: pointer;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: #fff; cursor: pointer;
    }
    .slider.temp {
      background: linear-gradient(to right, #ffaa55, #fff, #aaccff);
    }
    /* A slider whose door is following its Home Assistant sensor. Dimmed and
       not-allowed so it reads as "disconnected, not broken" — the checkbox
       above it is the control that hands it back. */
    .slider:disabled { opacity: 0.35; cursor: not-allowed; }
    .slider:disabled::-webkit-slider-thumb { cursor: not-allowed; }

    /* "Use real value" — shown only for a door with a sensor bound. */
    .sensor-toggle-row {
      display: flex; align-items: center; gap: 7px;
      font-size: 11px; opacity: 0.75; margin-bottom: 7px; cursor: pointer;
    }
    .sensor-toggle-row input { cursor: pointer; margin: 0; accent-color: #4a9eff; }

    /* Color swatches */
    .color-swatches { display: flex; gap: 5px; flex-wrap: wrap; }
    .color-swatch {
      width: 26px; height: 26px; border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.2);
      cursor: pointer; padding: 0;
    }
    .color-swatch.selected { border: 2px solid #fff; }
    .color-input {
      width: 100%; height: 28px; border: none; border-radius: 4px;
      cursor: pointer; background: transparent; margin-top: 8px;
    }

    /* Strip positions info */
    .strip-info {
      padding: 8px 10px; border-radius: 6px;
      background: rgba(255,255,255,0.04);
      font-size: 10px; opacity: 0.4; line-height: 1.5; margin-top: 6px;
    }
    .strip-info-title { font-weight: 600; margin-bottom: 2px; }

    /* Sun mode button group */
    .sun-mode-group {
      display: flex; gap: 3px;
    }
    .sun-mode-btn {
      width: 28px; height: 28px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.5); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      padding: 0;
    }
    .sun-mode-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .sun-mode-btn.active { background: rgba(255,200,50,0.18); border-color: rgba(255,200,50,0.5); color: #ffd43b; }
    .sun-mode-btn.active.night { background: rgba(100,120,200,0.18); border-color: rgba(100,120,200,0.5); color: #aab4ff; }
    .sun-mode-btn svg { width: 14px; height: 14px; }

    /* Panel footer */
    .panel-footer {
      padding: 10px 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; flex-direction: column; gap: 6px;
    }
    .panel-footer-row { display: flex; gap: 6px; }
    .panel-footer-btn {
      flex: 1; padding: 6px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.06);
      color: #fff; font-size: 11px; cursor: pointer;
      transition: background 0.15s;
    }
    .panel-footer-btn:hover { background: rgba(255,255,255,0.12); }
    .panel-footer-btn.export { color: rgba(255,255,255,0.6); font-size: 11px; }

    /* HA status indicator */
    .ha-status {
      position: fixed; bottom: 16px; left: 16px; z-index: 40;
      display: flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 6px;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(12px);
      font-size: 10px; opacity: 0.6; transition: opacity 0.3s;
    }
    .ha-status:hover { opacity: 1; }
    .ha-status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #666;
    }
    .ha-status-dot.connected { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .ha-status-dot.polling { background: #eab308; box-shadow: 0 0 6px #eab308; }
    .ha-status-dot.syncing { background: #eab308; box-shadow: 0 0 6px #eab308; }
    .ha-status-dot.disconnected { background: #666; }
    .ha-status-dot.auth_failed { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
    .ha-status-dot.sync_failed { background: #ef4444; box-shadow: 0 0 6px #ef4444; }

    /* Shadow toggle row in panel */
    .panel-toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .panel-toggle-label { font-size: 12px; font-weight: 500; opacity: 0.7; }

    /* Settings-page section heading + Specs button list */
    .panel-section-title {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; opacity: 0.4;
      padding: 16px 16px 8px;
    }
    .spec-list { display: flex; flex-direction: column; gap: 6px; padding: 0 16px 12px; }
    .spec-btn {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 9px 12px; border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #fff; font-size: 12px; font-weight: 500; cursor: pointer;
      text-align: left; text-decoration: none; transition: background 0.15s, border-color 0.15s;
    }
    .spec-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
    .spec-btn .spec-ext { opacity: 0.35; }

    /* Wide screen: panel always open, no close/lights button */
    @media (min-width: 1500px) {
      .panel { transform: translateX(0) !important; }
      .panel-close { display: none !important; }
      .top-right-btns { display: none !important; }
      #scene-container { width: calc(100vw - 300px); }
      /* Keep the compass inside the visible canvas, not under the always-open
         300px control panel. */
      .compass { right: calc(300px + 16px); }
      /* Grid legend sits bottom-LEFT so the panel (right) never covers it. */
    }

    @media (max-width: 600px) {
      .panel { width: 100%; }
    }
  </style>
</head>
<body>
  <!-- ═══════════════ Cold-start loading overlay ═══════════════════════════
       DELIBERATELY INLINE, AND DELIBERATELY FIRST IN <body>.

       Everything this overlay needs — markup, style, and its dismiss hook —
       is inline and above the import map and module scripts below. That
       placement is the whole feature, not a stylistic choice: it means the
       overlay paints during the initial HTML parse, before three.js has even
       been requested. Move any part of this into an external stylesheet, a
       module, or a script tag and it can no longer paint until that resource
       has loaded — which is exactly the window it exists to cover.

       The move to ES modules made this STRONGER, not weaker: module scripts
       never block the parser (the old tags were deferred, which is nearly as
       good, but the import map above them is inert JSON that fetches nothing).
       The ordering requirement is unchanged and unconditional — this markup
       stays FIRST in <body>, above the import map.

       DO NOT: add an external CSS file, a web font, or a JS module for this.
       DO NOT: move it below the script tags.

       WHY IT IS INDETERMINATE (this is a correctness point, not a taste one):
       a real progress bar here would be WORSE than none. Every milestone we
       can actually measure — config, rooms.json, HA initial state, house
       profile, scene construction — completes in ~150-200ms combined (see
       docs/perf-cold-start.md). The part that genuinely takes 9-45s is GPU
       shader compilation inside compileAsync(), which exposes no progress
       signal at all: isReady() is a per-program boolean and three.js does not
       surface the count. A bar wired to the knowable milestones would race to
       ~95% in a fifth of a second and then sit frozen for ten seconds or more,
       which reads as *more* broken than no bar at all. So the long tail is an
       honest indeterminate shimmer, and the only text change is at the one
       real milestone we have: when shader compilation starts.

       NO backdrop-filter, by design. A blur was requested, but there is
       nothing to blur — the canvas is empty until the scene first draws — and
       backdrop-filter is continuous compositor work on the very GPU we are
       waiting on. The panel is opaque #0f0f1a, matching scene.background in
       src/home3d-scene.js so the handoff to the rendered scene is seamless. -->
  <style>
    #home3d-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      /* Matches scene.background (0x0f0f1a) in src/home3d-scene.js, so the
         overlay fading out reveals an identically-coloured canvas rather than
         flashing a different shade. */
      background: #0f0f1a;
      /* System stack only — a web font would need a network round-trip before
         first paint, defeating the point of being inline. */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      color: #e8e8f0;
      opacity: 1;
      transition: opacity 420ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* Dismissal is a class flip, then the element is removed on transitionend
       (with a timeout fallback). pointer-events goes none immediately so the
       fading overlay never swallows a click meant for the live scene. */
    #home3d-loading.home3d-loading-done {
      opacity: 0;
      pointer-events: none;
    }

    #home3d-loading .home3d-loading-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.01em;
      margin: 0;
    }

    /* The indeterminate element. A track with a shimmer that sweeps across it
       forever — it conveys "working", never a false completion fraction. */
    #home3d-loading .home3d-loading-track {
      position: relative;
      width: min(210px, 54vw);
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.13);
      overflow: hidden;
    }

    #home3d-loading .home3d-loading-track::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 42%;
      border-radius: 3px;
      background: linear-gradient(90deg,
                  rgba(122, 162, 255, 0) 0%,
                  rgba(122, 162, 255, 0.95) 50%,
                  rgba(122, 162, 255, 0) 100%);
      /* transform-only animation: runs on the compositor without relayout or
         repaint, so the overlay costs effectively nothing while the main
         thread is busy building the scene. */
      animation: home3d-loading-sweep 1250ms ease-in-out infinite;
    }

    @keyframes home3d-loading-sweep {
      0%   { transform: translateX(-105%); }
      100% { transform: translateX(340%); }
    }

    #home3d-loading .home3d-loading-status {
      font-size: 12.5px;
      line-height: 1.4;
      margin: 0;
      min-height: 1.4em; /* reserve the line so the text swap never shifts layout */
      text-align: center;
      padding: 0 20px;
      color: rgba(232, 232, 240, 0.62);
    }

    /* Respect a reduced-motion preference: keep the affordance, drop the
       sweep, and pulse the whole track gently instead. */
    @media (prefers-reduced-motion: reduce) {
      #home3d-loading .home3d-loading-track::after {
        animation: none;
        width: 100%;
        background: rgba(122, 162, 255, 0.6);
        animation: home3d-loading-pulse 1900ms ease-in-out infinite;
      }
      #home3d-loading { transition: none; }
    }

    @keyframes home3d-loading-pulse {
      0%, 100% { opacity: 0.28; }
      50%      { opacity: 0.85; }
    }
  </style>

  <div id="home3d-loading" role="status" aria-live="polite">
    <p class="home3d-loading-title">Loading your home</p>
    <div class="home3d-loading-track"></div>
    <p class="home3d-loading-status" id="home3d-loading-status">Starting up&hellip;</p>
  </div>

  <script>
    /* The overlay's controller. Inline and synchronous on purpose — see the
       comment above the <style> block. Exposed as window.__home3dLoading so
       the boot sequence further down this file can drive it.

       Two invariants this object is responsible for:

       1. DISMISS ONCE, NEVER RE-ARM. `done` latches true on the first
          dismiss() and every later call is a no-op. This is what makes a warm
          popup reopen correct: when a Bubble Card popup merely hides and
          re-shows a live iframe, the scene is never rebuilt, setActive(true)
          just resumes it, and nothing here runs again. The overlay must not
          flash back up in that case — and because dismissal is a latch rather
          than something wired to setActive, we get that for free.

       2. UNDER ?preview=true IT NEVER EXISTS. The preview tile is a small
          non-interactive thumbnail in a host dashboard that strips all chrome
          (see the isPreview block further down). A loading card in a 379x163
          tile would be chrome, and worse, would be most of the tile. We remove
          the node outright here rather than hiding it, so it can never paint
          even for one frame. */
    window.__home3dLoading = (function () {
      var el = document.getElementById('home3d-loading');
      var statusEl = document.getElementById('home3d-loading-status');
      var done = false;

      // Suppress entirely on the preview tile. Read the param directly rather
      // than waiting for the boot code's isPreview — this runs during parse,
      // long before that exists, and waiting would let it paint first.
      var suppressed = false;
      try {
        suppressed = new URLSearchParams(window.location.search)
          .get('preview') === 'true';
      } catch (e) { /* URLSearchParams is universally available; be safe anyway */ }

      if (suppressed && el && el.parentNode) {
        el.parentNode.removeChild(el);
        el = null;
        statusEl = null;
        done = true; // latch, so a later dismiss() is a no-op rather than an error
      }

      return {
        /* Update the status line. Called at the one milestone that is both
           real and worth naming: the start of shader compilation, which is
           where the multi-second wait actually happens. */
        status: function (text) {
          if (done || !statusEl) return;
          statusEl.textContent = text;
        },
        /* Idempotent. Safe to call from several completion paths — and it is
           called from more than one, because compileAsync() is not guaranteed
           to exist (see src/home3d-scene.js). */
        dismiss: function () {
          if (done) return;
          done = true;
          if (!el) return;
          var node = el;
          el = null;
          statusEl = null;
          node.classList.add('home3d-loading-done');
          // Remove after the fade so the node is not left in the tree eating
          // hit-testing or compositor layers. transitionend is the normal
          // path; the timeout covers a browser that never fires it (e.g. the
          // element was display:none'd, or reduced-motion killed the
          // transition), so the node is always cleaned up exactly once.
          var removed = false;
          var remove = function () {
            if (removed) return;
            removed = true;
            if (node.parentNode) node.parentNode.removeChild(node);
          };
          node.addEventListener('transitionend', remove);
          setTimeout(remove, 700);
        },
        /* Exposed for the boot code's failure paths: if the app throws before
           the scene ever compiles, leaving a "Loading your home" card up
           forever is the very failure mode this overlay exists to prevent. */
        isDone: function () { return done; }
      };
    })();
  </script>
  <!-- ═════════════════ end cold-start loading overlay ═══════════════════ -->

  <!-- Title -->
  <div class="title-overlay">
    <h1 id="house-title">My Home</h1>
    <p>Click room to control lights &middot; Drag to orbit &middot; Scroll to zoom</p>
  </div>

  <!-- Hover tooltip -->
  <div class="room-tooltip" id="room-tooltip"></div>

  <!-- Top-right controls -->
  <div class="top-right-btns" id="top-right-btns">
    <button class="top-btn" id="lights-btn">Controls</button>
  </div>

  <!-- HA connection status -->
  <!-- The version badge below is stamped from APP_VERSION at deploy time, as are
       the ?v= cache-busts on every script tag. Nothing here is kept in sync by
       hand: leave the __VERSION__ placeholders alone. -->
  <div class="ha-status" id="ha-status" style="display:none">
    <div class="ha-status-dot" id="ha-status-dot"></div>
    <span id="ha-status-text">HA Disconnected</span>
    <span style="opacity:0.4; margin-left:6px;">__VERSION__</span>
  </div>

  <!-- 3D canvas mount -->
  <div id="scene-container"></div>

  <!-- Compass overlay (OFF by default; toggle in Controls sidebar). The outer
       ring + backdrop are static; #compass-rose rotates each rendered frame so
       North always points at model-north (see the compass IIFE below). N is
       red. viewBox is 100×100, centred at (50,50). -->
  <div class="compass" id="compass" aria-hidden="true">

  <!-- Mobile debug: visit with ?debug=1 to load Eruda (mobile DevTools).
       Tap the floating icon (bottom-right) for console / network / elements.
       Also installs a global error listener that paints visible errors so
       failures show up without opening Eruda first. -->
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      if (params.get('debug') !== '1') return;
      // Visible error banner (shows BEFORE Eruda loads + catches its load failures)
      const box = document.createElement('div');
      box.id = 'debug-errors';
      Object.assign(box.style, {
        position: 'fixed', top: '60px', left: '8px', right: '8px',
        zIndex: '9999', background: 'rgba(180,0,0,0.92)', color: '#fff',
        font: '12px/1.4 monospace', padding: '8px 10px', borderRadius: '6px',
        maxHeight: '40vh', overflow: 'auto', whiteSpace: 'pre-wrap',
        display: 'none', boxShadow: '0 4px 18px rgba(0,0,0,0.4)'
      });
      document.addEventListener('DOMContentLoaded', () => document.body.appendChild(box));
      const push = (msg) => {
        box.style.display = 'block';
        box.textContent += msg + '\n────────\n';
      };
      window.addEventListener('error', e => push('ERROR: ' + (e.error?.stack || e.message) + ' @ ' + e.filename + ':' + e.lineno));
      window.addEventListener('unhandledrejection', e => push('PROMISE: ' + (e.reason?.stack || e.reason)));
      // Load Eruda from jsDelivr CDN
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/eruda';
      s.onload = () => { try { eruda.init(); } catch (e) { push('Eruda init failed: ' + e); } };
      s.onerror = () => push('Eruda CDN load failed — likely no internet from device, or CSP blocked. The native error overlay above will still work.');
      document.head.appendChild(s);
    })();
