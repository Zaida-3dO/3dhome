name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.2.0). Leave blank to auto-increment the minor from the latest tag."
        required: false
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Determine version tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute and push tag
        id: tag
        env:
          # Passed via env, never interpolated into the script body: this is a
          # public repo and workflow_dispatch inputs are attacker-influenced text.
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$INPUT_VERSION" ]; then
            next="$INPUT_VERSION"
          else
            git fetch --tags
            # -version:refname is a numeric (not lexical) sort, so v0.10.0 > v0.9.0.
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1)
            if [ -z "$latest" ]; then
              next="v0.1.0"
            else
              major=$(echo "$latest" | cut -d. -f1 | tr -d 'v')
              minor=$(echo "$latest" | cut -d. -f2)
              next="v${major}.$((minor + 1)).0"
            fi
          fi

          echo "Tagging $next"
          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish Docker image & GitHub Release
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lowercase the image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          # GHCR rejects uppercase in a repository path; the GitHub owner
          # (Zaida-3dO) has some, so fold it before use.
          echo "name=ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/3dhome" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ needs.tag.outputs.tag }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ needs.tag.outputs.tag }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
