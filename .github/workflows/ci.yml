name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'deploy/**'
              - 'docker-compose.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'
              - 'scripts/test-import-stamping.mjs'

  # --- Workflow linting (path-gated) ---------------------------------------

  actionlint:
    name: Lint GitHub Actions workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: raven-actions/actionlint@v2

  actionlint-gate:
    name: Actionlint (required)
    needs: [changes, actionlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pass — workflows not changed
        if: needs.changes.outputs.workflows == 'false'
        run: echo "No workflow files changed, skipping actionlint"
      - name: Fail — actionlint failed
        if: needs.changes.outputs.workflows == 'true' && needs.actionlint.result != 'success'
        run: exit 1

  # --- Always-on checks (public repo: these run on every PR) ---------------

  pii-guard:
    name: PII / secrets guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check the guard script exists
        run: |
          # A missing guard must FAIL, never silently pass — a guard that can be
          # deleted to make it green is not a guard.
          if [ ! -f scripts/check-no-pii.sh ]; then
            echo "::error file=scripts/check-no-pii.sh::PII guard script scripts/check-no-pii.sh is missing."
            echo "This repo is public. The PII guard is mandatory and must not be removed or renamed."
            exit 1
          fi
      - name: Run the PII guard
        run: bash scripts/check-no-pii.sh

  version-stamping:
    name: Version stamping guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check the guard script exists
        run: |
          # Same reasoning as the PII guard: a check that can be deleted to
          # make the build green is not a check.
          if [ ! -f deploy/check-version-stamping.sh ]; then
            echo "::error file=deploy/check-version-stamping.sh::Version guard is missing."
            echo "It must not be removed or renamed - see its header for the drift it prevents."
            exit 1
          fi
      - name: Fail on any hardcoded version where __VERSION__ belongs
        # The predecessor kept one version in three hand-synchronised places
        # and they drifted three times, serving two different cached builds of
        # the same script from one origin. The rule then was "grep before
        # saving"; that is what failed. This is the same grep, run by CI on
        # every PR, where forgetting is not an option.
        run: sh deploy/check-version-stamping.sh

  js-syntax:
    name: JS / JSON syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: node --check every JS file in src/ and scripts/
        run: |
          # No bundler, no test framework: `node --check` is the parse gate.
          # vendor/ is skipped deliberately — third-party, and three.js is huge.
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            found=$((found + 1))
            echo "checking $f"
            node --check "$f"
          done < <(find src scripts -type f -name '*.js' -not -path '*/vendor/*' -print0 2>/dev/null)
          echo "Checked $found JS file(s)."
      - name: Every relative ES-module import is stamped with ?v= at deploy
        run: node scripts/test-import-stamping.mjs
      - name: Config-loader behaviour tests
        run: |
          # Asserts the ?house= path-traversal guard and the ?haUrl= semantics
          # the Home Assistant embed depends on. No framework, no install.
          set -euo pipefail
          node scripts/test-config-loader.mjs
      - name: Extra-overlay compatibility contract
        run: |
          # Asserts `window.THREE = THREE` still precedes loadExtraOverlays(),
          # plus the import map's shape. index.html is an ES module, so that
          # global is no longer created as a side effect -- and the profiles
          # that depend on it are PRIVATE, so nothing else in this repo can
          # catch its removal. See the script's header.
          set -euo pipefail
          node scripts/test-extra-overlay-global.mjs
      - name: House-loader strictness tests
        run: |
          # Asserts that a house which cannot be loaded REJECTS rather than
          # silently rendering a different house. That substitution is a
          # regression nobody would see: the app boots, a house draws, and the
          # container stays healthy while showing the wrong home.
          set -euo pipefail
          node scripts/test-house-loader-strict.mjs
      - name: Footstep turn-at-the-corner regression
        run: |
          # Asserts the step-back-and-turn-once rule in the footstep walk: in an
          # L-shaped room the trail must round the corner rather than walk out
          # through the wall. That branch CANNOT run on either house that ships
          # today -- the trail length is pre-capped by room area, so every room
          # stops on the count cap long before a print could land outside -- so
          # it is correct code that nothing exercises, and a change to the caps,
          # to STEP_CM, or a profile with one long thin room would be the first
          # thing ever to run it, in front of a user. The test walks a synthetic
          # L with the caps lifted and checks zero prints escape AND the
          # direction actually changes. See the script's header.
          set -euo pipefail
          node scripts/test-footstep-turn.mjs
      - name: Footstep zone confinement (manual override)
        run: |
          # Asserts rooms[].footstepZone: house-loader resolves from/to (authored
          # relative to the room's own bbox min corner) to absolute plan
          # coordinates with corners sorted, falls back to null on a malformed
          # zone rather than throwing, and a zone genuinely confines the walk to
          # its rectangle rather than the room's full polygon. See the script's
          # header.
          set -euo pipefail
          node scripts/test-footstep-zone.mjs
      - name: Radiator furniture module geometry contract
        run: |
          # Asserts src/furniture/radiator.js follows the shared furniture
          # module contract: TYPE + frozen DEFAULTS + build()/buildRadiator
          # alias, the PLACER frame (y=0 at its own bottom, elevation applied
          # by the placer -- not baked in; z=0 at the back/wall face), the
          # smart TRV valve landing in the requested corner for all 4
          # VALVE_CORNERS with the lockshield diagonally opposite, an invalid
          # corner falling back to the documented default, the
          # thickness/wallGap split staying independent (bracket bridges
          # exactly the gap), opts.detail 'low' dropping the valve assemblies
          # with strictly fewer triangles than 'full', and merge fidelity
          # (every mesh tagged with userData.finish from the shared flat-
          # colour set, no texture maps, the smart valve's status LED
          # genuinely emissive and flagged userData.keep). Builds real
          # three.js geometry from the vendored module, same as the
          # wall-fittings test above.
          set -euo pipefail
          node scripts/test-furniture-radiator.mjs
      - name: Footprints point toe-first along the walk
        run: |
          # Builds each print exactly as home3d-scene.js does (rotateX(-PI/2),
          # rotateY(printYaw)) with the vendored three and asserts the toe (v=1)
          # edge leads the walking direction in eight directions. The previous
          # rotation was off by PI and drew every trail walking backwards.
          set -euo pipefail
          node scripts/test-footprint-orientation.mjs
      - name: Windows and curtains compile and place correctly
        run: |
          # Asserts the loader pass-through for windows[]/curtains[], the
          # DERIVED inside/outside side of each fitting (backwards, every frame
          # sits on the room face and every curtain hangs outside the building),
          # the cavity-wall cill depth, the balcony door's compass end, and that
          # a blackout curtain never folds back through a sheer behind it.
          # Builds real three.js geometry from the vendored module.
          set -euo pipefail
          node scripts/test-wall-fittings.mjs
      - name: Curtains follow Home Assistant and gate the daylight
        run: |
          # Asserts the cover -> curtain and cornice-light -> cornice bindings
          # fire only on a real change (an attribute republish must not become
          # a render tick) and never leak into the room-light path; that
          # re-posing a curtain lands on the same vertices as a fresh build at
          # that openness, each half anchored at its own wall end; and that a
          # closed blackout shuts the daylight out while a sheer dims and warms it.
          set -euo pipefail
          node scripts/test-curtain-binding.mjs
      - name: Curtain slider command mapping and availability
        run: |
          # Asserts the sidebar curtain slider's write path: slider value ->
          # cover.set_cover_position payload (clamp/round, single vs
          # multi-motor fan-out, null when nothing is bound), and the
          # unavailable/unknown -> disabled-slider signal (any down motor on a
          # multi-motor curtain disables the whole slider, flips back on a
          # real reading, fires only on an actual change, and reports null --
          # not false -- before any reading has ever arrived).
          set -euo pipefail
          node scripts/test-curtain-slider-command.mjs
      - name: Room sidebar rows (climate, curtain buttons, motion, door) and slider write path
        run: |
          # Asserts climate.set_temperature mapping (clamp to min/max, round
          # to target_temp_step, nothing sent when off / null target /
          # unavailable / NaN), curtain Open/Close service calls, the motion
          # OR-reduction and door status text, row disabled states, and the
          # shared drag sender (one send per release, per-drag dedupe, button
          # cancels a pending slider send, drag lock released on pointerup)
          # against the real callServiceDebounced.
          set -euo pipefail
          node scripts/test-room-panel.mjs
      - name: Gaming chair builder
        run: |
          # Asserts src/furniture/gaming-chair.js: the furniture frame (floor at
          # y=0, back at z=0 at every recline), the published size-L dimensions,
          # recline measured on the built geometry, and colour placement -- the
          # colourway on the seat and backrest FRONT only, black everywhere
          # else. A colour leaking onto the back is invisible from the front
          # 3/4 view a screenshot shows. Also: flat finishes only, and 'low'
          # detail genuinely cheaper. See the script's header.
          set -euo pipefail
          node scripts/test-gaming-chair.mjs
      - name: Standing desk builder geometry and height clamp
        run: |
          # Asserts src/furniture/standing-desk.js against the generic
          # furniture contract (bbox vs DEFAULTS within 0.5cm, x centred,
          # bottom y=0, back z=0, finish/keep tags, low <= full triangles --
          # already covered for every registered type by
          # test-furniture-core.mjs below) plus the desk-specific behaviour a
          # screenshot cannot pin: a requested topHeight outside
          # [minHeight, maxHeight] is CLAMPED rather than honoured (the sit-
          # stand slider's acceptance criterion), an absent topHeight
          # defaults to the range midpoint, and the two T-foot legs visibly
          # telescope (the upper stage's extension grows with topHeight while
          # the lower sleeve and its overlap stay fixed).
          set -euo pipefail
          node scripts/test-standing-desk.mjs
      - name: Wall decor (framed sign + wall sconce, both kinds) builder contract
        run: |
          # Asserts the builder contract for src/furniture/wall-sign.js and
          # wall-sconce.js (kinds 'swing-arm-globe' and 'up-down'): frozen
          # DEFAULTS with numeric width/height/depth, bbox matching DEFAULTS
          # within 0.5 cm, y=0 at the bottom, back face at z=0, and the
          # finish/merge contract -- every mesh tagged from the closed finish
          # palette, with the glass globe, its bulb, the up-down sconce's two
          # lenses and beam-cone hints, and the sign's CanvasTexture text
          # panel all marked userData.keep so the live renderer's per-finish
          # mesh merge leaves them as their own draw call. Also builds
          # wall-sign with NO global `document` at all -- the shape the
          # furniture-core drift test (branch feat/furniture-data-layer) runs
          # every builder in. Builds real three.js geometry from the vendored
          # module, same as test-wall-fittings.mjs.
          set -euo pipefail
          node scripts/test-wall-decor.mjs
      - name: Cabinet builder bbox, back-face, low-detail and fronts-grid rules
        run: |
          # Asserts src/furniture/cabinet.js: the built group's bounding box
          # matches params (width/height/depth, cm -> m) with y=0 the floor,
          # z=0 is the back (nothing behind it), detail:'low' produces fewer
          # triangles than 'full', normaliseFronts() fills/normalises/errors
          # per the fronts-grid contract, every mesh is tagged with a finish
          # from the closed set with glass/mirror/emissive marked keep=true,
          # and the bedside-table LED wrap sits in a drawer gap and wraps the
          # front + both sides (never the back). Builds real three.js
          # geometry from the vendored module.
          set -euo pipefail
          node scripts/test-cabinet.mjs
      - name: Plant builder geometry, seed determinism and finish tagging
        run: |
          # Asserts build()'s total height matches potHeight + plantHeight
          # (corn-plant) within tolerance, the base sits at y=0, a leaf's
          # widest spread stays within the requested footprint, 'low' detail
          # stays at or under the 300-triangle mobile budget for BOTH kinds
          # and is a real reduction from 'full', the SAME seed reproduces the
          # IDENTICAL leaf layout while a DIFFERENT seed changes it, the
          # corn-plant preset matches item 889bf6ce's measurements, every
          # mesh in every preset carries a valid userData.finish (the live
          # renderer merges meshes by finish) with glass/emissive meshes also
          # carrying userData.keep=true, and the wall-planter kind mounts
          # back-to-wall (z=0) with a distinct anatomy from the corn plant.
          set -euo pipefail
          node scripts/test-plant-builder.mjs
      - name: Bed builder (channel-tufted headboard)
        run: |
          # Asserts src/furniture/bed.js against the generic furniture
          # contract (bbox vs DEFAULTS within 0.5cm, x centred, bottom y=0,
          # back z=0, finish/keep tags, low <= full triangles -- already
          # covered for every registered type by test-furniture-core.mjs
          # below) plus the bed-specific behaviour a screenshot cannot pin:
          # the headboard's vertical padded channels are evenly spaced,
          # flush with the panel edges and butted together with only a small
          # crease between neighbours (not thin poles with wide gaps), each
          # standing proud of the flat backing; `height` is honoured directly
          # as the headboard height, never shrinking the envelope below the
          # base+mattress stack; duvet:false removes the duvet mesh; low
          # detail drops the pillows; the pillows sit at the HEADBOARD end,
          # not poking out of the duvet at the foot; a non-default size still
          # builds coherently with the back at z=0; and headboard/base/
          # mattress colours land on distinct parts.
          set -euo pipefail
          node scripts/test-bed.mjs
      - name: Digital piano builder (piano, bench, ottoman -- every preset)
        run: |
          # Asserts src/furniture/digital-piano.js (multi-type: digital-piano,
          # piano-bench, ottoman) against the generic furniture contract for
          # all three (already covered for every registered type by
          # test-furniture-core.mjs below) plus the type-specific behaviour a
          # screenshot cannot pin: the piano's white/black key strips (black
          # dropped at low detail) sit in the front half of the item, the
          # overall height stays pinned to DEFAULTS.height across a range of
          # music-rest heights, the stand is not the metal finish (which reads
          # dark grey with no environment map) and the music rest leans AWAY
          # from the player rather than into their space; BOTH piano-bench
          # baseStyle presets ('x' and 'column') build to the same bbox using
          # genuinely different geometry and a non-metal base; and the
          # ottoman's channel-tufted lid is evenly spaced, flush with the lid
          # edges, and STANDS PROUD of the flat lid top (round face up) on
          # exactly 4 legs, with the low-detail build under 200 triangles.
          # Builds every preset this module exports, real three.js geometry
          # from the vendored module.
          set -euo pipefail
          node scripts/test-digital-piano.mjs
      - name: Dining set (nesting round table + quadrant chairs) builder contract
        run: |
          # Asserts the builder contract for src/furniture/dining.js
          # (TYPES['dining-table'] and TYPES['dining-chair']): frozen
          # DEFAULTS with numeric width/height/depth, bbox matching DEFAULTS
          # within 0.5 cm, y=0 at the bottom, back face at z=0, and the
          # finish/merge contract. Also: no pedestal and exactly 4 SPLAYED
          # legs plus a crossbar frame for the table; the chair's 90-degree
          # wedge (quadrant) shape at several radius/backSweep combinations,
          # with its legs and stretcher verified to stay strictly inside the
          # wedge's true boundary (arc + two straight sides -- a narrowing
          # triangle, not a rectangle); the curved back shell's OUTER surface
          # faces away from the wedge's own apex (sampled from the built
          # geometry's own winding, with a mutation-probe proving a raw
          # mirrored-scale build would fail this check); and NESTING
          # geometry-sampling checks (round 1 review found the original
          # arithmetic-only nesting checks hollow while the real tucked set
          # interpenetrated): points sampled along the table's own leg and
          # crossbar SURFACES (not just vertices -- a leg's surface can cross
          # a thin band, like the chair seat's slab, entirely between its two
          # vertex rings) are checked against every tucked chair's actual
          # seat and back-shell geometry, with a mutation-probe proving a
          # too-shallow leg inset would be caught; plus the chair back's
          # highest point clearing the table's underside by about 1cm.
          # dining.js had no per-module test file before this (noted on item
          # b27ddcdd); this is that file, added alongside the wall-clock
          # split and the nesting-set redesign (item 89769f2b).
          set -euo pipefail
          node scripts/test-dining.mjs
      - name: Wall clock (framed + diy-numerals) builder contract
        run: |
          # Asserts the builder contract for src/furniture/wall-clock.js,
          # split out of dining.js (item 89769f2b, 2026-09-26): frozen
          # DEFAULTS with numeric width/height/depth, bbox matching DEFAULTS
          # within 0.5 cm for both `kind`s, y=0 at the bottom, back face at
          # z=0, and the finish/merge contract -- the three hand meshes and
          # the hub (the parts that move or must stay flush at the declared
          # depth) carry userData.keep. Also: angleForTime(date) matches the
          # documented radians-clockwise-from-12 convention and is pure,
          # setClockTime(group, date) rotates exactly the three named hand
          # meshes and nothing else, and a garbage `time` string falls back
          # to 10:10 rather than throwing.
          set -euo pipefail
          node scripts/test-wall-clock.mjs
      - name: WebGL failure is classified correctly
        run: |
          # Asserts which of the two WebGL failures we tell the user about. Out
          # of graphics memory (usually a lot of open tabs) is fixed by closing
          # some; no usable GPU is not, and closing tabs does nothing. The
          # dangerous direction is the FALSE POSITIVE: telling someone with a
          # broken GPU to close tabs is confident, actionable and wrong. The
          # string three.js actually throws once it has dropped the reason --
          # "Error creating WebGL context." -- reaches the matcher as a fallback
          # on every failure of either kind, so if it ever starts matching, every
          # broken-GPU user gets the tabs advice. That case is pinned here.
          set -euo pipefail
          node scripts/test-webgl-reason.mjs
      - name: Furniture placement, finishes, box builder and registry
        run: node scripts/test-furniture-core.mjs
      - name: Wall side is probed at the item, not from the room's bbox
        run: node scripts/test-wall-side.mjs
      - name: Furniture drift (registry, schema params blocks, builder DEFAULTS)
        run: node scripts/test-furniture-defaults.mjs
      - name: Kitchen builders (corner, sink, LEDs, draw budget)
        # What the generic contract cannot see: runs beyond DEFAULTS, the L's
        # worktops meeting without overlap or gap, LED strips continuous round
        # the corner, the four-draw budget, and Copy JSON's diff.
        run: node scripts/test-furniture-kitchen.mjs
      - name: Small items -- envelope, facing and finish tags per type x preset x detail
        run: node scripts/test-small-items.mjs
      - name: Furniture renderer (placement, merge buckets, shadow proxies, fade, attach)
        run: node scripts/test-furniture-render.mjs
      - name: Quality tier - mobile-GPU axis, ?tier= override, pixel-ratio cap
        run: node scripts/test-quality-tier.mjs
      - name: Room lights - per-channel collapse to one or two lights
        run: node scripts/test-light-collapse.mjs
      - name: Validate every JSON file in houses/ and the repo root
        run: |
          set -euo pipefail
          found=0
          check() {
            echo "checking $1"
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$1"
          }
          while IFS= read -r -d '' f; do
            found=$((found + 1)); check "$f"
          done < <(find houses -type f -name '*.json' -not -path '*/vendor/*' -print0 2>/dev/null)
          while IFS= read -r -d '' f; do
            found=$((found + 1)); check "$f"
          done < <(find . -maxdepth 1 -type f -name '*.json' -print0)
          echo "Checked $found JSON file(s)."

  house-profiles:
    name: House profile validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install jsonschema
        # The validator degrades to structural-only checks without this and says
        # so on stdout - but a degraded pass in CI is a pass that missed things,
        # so install it rather than relying on the fallback.
        run: python -m pip install --disable-pip-version-check --quiet jsonschema
      - name: Validate every house profile with scripts/validate-house.py
        run: |
          set -euo pipefail
          # The validator is the single source of truth for what a valid house
          # is (schema + cross-file checks). CI runs THAT script rather than
          # reimplementing validation, so the two can never drift apart.
          if [ ! -f scripts/validate-house.py ]; then
            echo "::error file=scripts/validate-house.py::House validator scripts/validate-house.py is missing."
            exit 1
          fi
          if [ ! -f houses/schema.json ]; then
            echo "::error file=houses/schema.json::houses/schema.json is missing - the validator cannot run."
            exit 1
          fi
          # Null-delimited into an array: safe for paths with spaces, and avoids
          # word-splitting an unquoted expansion (shellcheck SC2086).
          profiles=()
          while IFS= read -r -d '' p; do
            profiles+=("$p")
          done < <(find houses -mindepth 2 -maxdepth 2 -name geometry.json -print0 | sort -z)
          if [ ${#profiles[@]} -eq 0 ]; then
            echo "No houses/*/geometry.json found - nothing to validate."
            exit 0
          fi
          printf 'will validate %s\n' "${profiles[@]}"
          # Pass the house DIRECTORY, not the bare geometry.json: only the
          # directory form also validates rooms.json and the cross-file
          # geometry<->rooms reference checks.
          dirs=()
          for p in "${profiles[@]}"; do
            dirs+=("$(dirname "$p")")
          done
          python scripts/validate-house.py "${dirs[@]}"
      - name: Furniture schema and validator checks
        run: python scripts/test-validate-furniture.py
      - name: sh3d-furniture / furniture-apply tests
        run: python scripts/test-sh3d-furniture.py

  # --- Docker dry run (path-gated) -----------------------------------------

  docker-dry-run:
    name: Docker build (dry run)
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Is there a Dockerfile to build?
        id: dockerfile
        run: |
          # The `docker` path filter also matches .dockerignore and deploy/**,
          # either of which can legitimately change while the Dockerfile itself
          # has not landed yet. Without this probe buildx dies with an opaque
          # "failed to read dockerfile: no such file or directory" and the gate
          # reports a red build for a file nobody touched.
          if [ -f Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Dockerfile at the repo root yet - skipping the dry-run build."
          fi
      - name: Build Docker image (no push)
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: home3d:ci
          build-args: |
            APP_VERSION=ci-dry-run
      - uses: actions/setup-node@v6
        if: steps.dockerfile.outputs.present == 'true'
        with:
          node-version: 24
      - name: Run the image, check cache headers and import stamping
        if: steps.dockerfile.outputs.present == 'true'
        run: |
          set -euo pipefail
          docker run -d --name home3d-ci -p 8080:80 home3d:ci
          trap 'docker logs home3d-ci || true; docker rm -f home3d-ci >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          # Every relative import in the SERVED tree carries ?v=<version>.
          docker cp home3d-ci:/usr/share/nginx/html ./built
          node scripts/test-import-stamping.mjs --scan ./built ci-dry-run
          # Cache policy: only ?v= URLs are immutable.
          cc() { curl -fsSI "http://127.0.0.1:8080$1" | tr -d '\r' | grep -i '^cache-control:' | cut -d' ' -f2-; }
          expect() {
            got=$(cc "$1")
            echo "$1 -> Cache-Control: $got"
            [ "$got" = "$2" ] || { echo "::error::$1 expected Cache-Control '$2', got '$got'"; exit 1; }
          }
          expect '/src/wall-fittings.js'               'no-cache'
          expect '/src/wall-fittings.js?v=ci-dry-run'  'public, max-age=31536000, immutable'
          expect '/specs/spec-three.jsx'               'no-cache'
          expect '/specs/BedSpec.html'                 'no-cache'
          expect '/'                                   'no-cache'
          expect '/houses/demo/geometry.json'          'no-cache'
          expect '/houses/demo/geometry.json?v=x'      'no-cache'
          expect '/vendor/three-r160/three.module.min.js?v=ci-dry-run' 'public, max-age=31536000, immutable'
          # Exactly one Cache-Control header (no stray one from `expires`).
          n=$(curl -fsSI 'http://127.0.0.1:8080/src/wall-fittings.js' | grep -ci '^cache-control:')
          [ "$n" = 1 ] || { echo "::error::expected one Cache-Control header, got $n"; exit 1; }

  docker-dry-run-gate:
    name: Docker dry run (required)
    needs: [changes, docker-dry-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pass — docker files not changed
        if: needs.changes.outputs.docker == 'false'
        run: echo "No Docker-relevant files changed, skipping docker-dry-run"
      - name: Fail — docker-dry-run failed
        if: needs.changes.outputs.docker == 'true' && needs.docker-dry-run.result != 'success'
        run: exit 1
