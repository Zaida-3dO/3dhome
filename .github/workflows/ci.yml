name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'deploy/**'
              - 'docker-compose.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'
              - 'scripts/test-import-stamping.mjs'

  # --- Workflow linting (path-gated) ---------------------------------------

  actionlint:
    name: Lint GitHub Actions workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: raven-actions/actionlint@v2

  actionlint-gate:
    name: Actionlint (required)
    needs: [changes, actionlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pass — workflows not changed
        if: needs.changes.outputs.workflows == 'false'
        run: echo "No workflow files changed, skipping actionlint"
      - name: Fail — actionlint failed
        if: needs.changes.outputs.workflows == 'true' && needs.actionlint.result != 'success'
        run: exit 1

  # --- Always-on checks (public repo: these run on every PR) ---------------

  pii-guard:
    name: PII / secrets guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check the guard script exists
        run: |
          # A missing guard must FAIL, never silently pass — a guard that can be
          # deleted to make it green is not a guard.
          if [ ! -f scripts/check-no-pii.sh ]; then
            echo "::error file=scripts/check-no-pii.sh::PII guard script scripts/check-no-pii.sh is missing."
            echo "This repo is public. The PII guard is mandatory and must not be removed or renamed."
            exit 1
          fi
      - name: Run the PII guard
        run: bash scripts/check-no-pii.sh

  version-stamping:
    name: Version stamping guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check the guard script exists
        run: |
          # Same reasoning as the PII guard: a check that can be deleted to
          # make the build green is not a check.
          if [ ! -f deploy/check-version-stamping.sh ]; then
            echo "::error file=deploy/check-version-stamping.sh::Version guard is missing."
            echo "It must not be removed or renamed - see its header for the drift it prevents."
            exit 1
          fi
      - name: Fail on any hardcoded version where __VERSION__ belongs
        # The predecessor kept one version in three hand-synchronised places
        # and they drifted three times, serving two different cached builds of
        # the same script from one origin. The rule then was "grep before
        # saving"; that is what failed. This is the same grep, run by CI on
        # every PR, where forgetting is not an option.
        run: sh deploy/check-version-stamping.sh

  js-syntax:
    name: JS / JSON syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: node --check every JS file in src/ and scripts/
        run: |
          # No bundler, no test framework: `node --check` is the parse gate.
          # vendor/ is skipped deliberately — third-party, and three.js is huge.
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            found=$((found + 1))
            echo "checking $f"
            node --check "$f"
          done < <(find src scripts -type f -name '*.js' -not -path '*/vendor/*' -print0 2>/dev/null)
          echo "Checked $found JS file(s)."
      - name: Every relative ES-module import is stamped with ?v= at deploy
        run: node scripts/test-import-stamping.mjs
      - name: Config-loader behaviour tests
        run: |
          # Asserts the ?house= path-traversal guard and the ?haUrl= semantics
          # the Home Assistant embed depends on. No framework, no install.
          set -euo pipefail
          node scripts/test-config-loader.mjs
      - name: Extra-overlay compatibility contract
        run: |
          # Asserts `window.THREE = THREE` still precedes loadExtraOverlays(),
          # plus the import map's shape. index.html is an ES module, so that
          # global is no longer created as a side effect -- and the profiles
          # that depend on it are PRIVATE, so nothing else in this repo can
          # catch its removal. See the script's header.
          set -euo pipefail
          node scripts/test-extra-overlay-global.mjs
      - name: House-loader strictness tests
        run: |
          # Asserts that a house which cannot be loaded REJECTS rather than
          # silently rendering a different house. That substitution is a
          # regression nobody would see: the app boots, a house draws, and the
          # container stays healthy while showing the wrong home.
          set -euo pipefail
          node scripts/test-house-loader-strict.mjs
      - name: Footstep turn-at-the-corner regression
        run: |
          # Asserts the step-back-and-turn-once rule in the footstep walk: in an
          # L-shaped room the trail must round the corner rather than walk out
          # through the wall. That branch CANNOT run on either house that ships
          # today -- the trail length is pre-capped by room area, so every room
          # stops on the count cap long before a print could land outside -- so
          # it is correct code that nothing exercises, and a change to the caps,
          # to STEP_CM, or a profile with one long thin room would be the first
          # thing ever to run it, in front of a user. The test walks a synthetic
          # L with the caps lifted and checks zero prints escape AND the
          # direction actually changes. See the script's header.
          set -euo pipefail
          node scripts/test-footstep-turn.mjs
      - name: Footstep zone confinement (manual override)
        run: |
          # Asserts rooms[].footstepZone: house-loader resolves from/to (authored
          # relative to the room's own bbox min corner) to absolute plan
          # coordinates with corners sorted, falls back to null on a malformed
          # zone rather than throwing, and a zone genuinely confines the walk to
          # its rectangle rather than the room's full polygon. See the script's
          # header.
          set -euo pipefail
          node scripts/test-footstep-zone.mjs
      - name: Footstep paths (authored waypoints) and the door gap
        run: |
          # Asserts rooms[].footstepPath: prints follow the waypoints in order,
          # alternate left/right and face along travel; reversing the waypoints
          # reverses the walk; a path round an L stays on the floor and turns;
          # the loader resolves waypoints relative to the room bbox and drops a
          # path with a waypoint outside the room (falling back to the zone);
          # a path beats a zone; and no print -- authored OR automatic -- lands
          # within DOOR_GAP_CM of any door opening. See the script's header.
          set -euo pipefail
          node scripts/test-footstep-path.mjs
      - name: Radiator furniture module geometry contract
        run: |
          # Asserts src/furniture/radiator.js follows the shared furniture
          # module contract: TYPE + frozen DEFAULTS + build()/buildRadiator
          # alias, the PLACER frame (y=0 at its own bottom, elevation applied
          # by the placer -- not baked in; z=0 at the back/wall face), the
          # smart TRV valve on the END of the radiator at the requested
          # corner for all 4 VALVE_CORNERS with the lockshield at the bottom
          # of the other end, an invalid corner falling back to the
          # documented default, the thickness/wallGap split staying
          # independent (bracket bridges exactly the gap), the pipes reaching
          # the floor (the placer derives pipeDrop from the item elevation),
          # the shelf's valve-end clip visible, opts.detail 'low' dropping
          # the valve assemblies with strictly fewer triangles than 'full',
          # and merge fidelity (every mesh tagged with userData.finish from
          # the shared flat-colour set, no texture maps, nothing emissive).
          # Builds real
          # three.js geometry from the vendored module, same as the
          # wall-fittings test above.
          set -euo pipefail
          node scripts/test-furniture-radiator.mjs
      - name: Footprints point toe-first along the walk
        run: |
          # Builds each print exactly as home3d-scene.js does (rotateX(-PI/2),
          # rotateY(printYaw)) with the vendored three and asserts the toe (v=1)
          # edge leads the walking direction in eight directions. The previous
          # rotation was off by PI and drew every trail walking backwards.
          set -euo pipefail
          node scripts/test-footprint-orientation.mjs
      - name: Windows and curtains compile and place correctly
        run: |
          # Asserts the loader pass-through for windows[]/curtains[], the
          # DERIVED inside/outside side of each fitting (backwards, every frame
          # sits on the room face and every curtain hangs outside the building),
          # the cavity-wall cill depth, the balcony door's compass end, and that
          # a blackout curtain never folds back through a sheer behind it.
          # Builds real three.js geometry from the vendored module.
          set -euo pipefail
          node scripts/test-wall-fittings.mjs
      - name: Curtains follow Home Assistant and gate the daylight
        run: |
          # Asserts the cover -> curtain and cornice-light -> cornice bindings
          # fire only on a real change (an attribute republish must not become
          # a render tick) and never leak into the room-light path; that
          # re-posing a curtain lands on the same vertices as a fresh build at
          # that openness, each half anchored at its own wall end; and that a
          # closed blackout shuts the daylight out while a sheer dims and warms it.
          set -euo pipefail
          node scripts/test-curtain-binding.mjs
      - name: Curtain slider command mapping and availability
        run: |
          # Asserts the sidebar curtain slider's write path: slider value ->
          # cover.set_cover_position payload (clamp/round, single vs
          # multi-motor fan-out, null when nothing is bound), and the
          # unavailable/unknown -> disabled-slider signal (any down motor on a
          # multi-motor curtain disables the whole slider, flips back on a
          # real reading, fires only on an actual change, and reports null --
          # not false -- before any reading has ever arrived).
          set -euo pipefail
          node scripts/test-curtain-slider-command.mjs
      - name: Room sidebar rows (climate, curtain buttons, motion, door) and slider write path
        run: |
          # Asserts climate.set_temperature mapping (clamp to min/max, round
          # to target_temp_step, nothing sent when off / null target /
          # unavailable / NaN), curtain Open/Close service calls, the motion
          # OR-reduction and door status text, row disabled states, and the
          # shared drag sender (one send per release, per-drag dedupe, button
          # cancels a pending slider send, drag lock released on pointerup)
          # against the real callServiceDebounced.
          set -euo pipefail
          node scripts/test-room-panel.mjs
      - name: Home Assistant transport is the WebSocket only (no REST, no CORS)
        run: |
          # Asserts ha-client never calls fetch(): a whole session (connect,
          # get_states snapshot, live event, call_service) runs over a fake
          # HA WebSocket with ZERO fetches; a command with no socket, or on a
          # socket not yet authenticated, is dropped rather than sent over
          # REST; and no module that talks to HA contains a fetch( at all.
          # A browser REST call to HA is cross-origin with a Bearer header, so
          # it is CORS-preflighted and fails unless HA allow-lists this app --
          # the console error every load used to show. See the script's header.
          set -euo pipefail
          node scripts/test-ha-client-transport.mjs
      - name: HA offline disables every command control; reconnect is a full resync
        run: |
          # Against the fake HA WebSocket: while HA is not 'connected', every
          # light / ambience / curtain / thermostat control renders disabled
          # and a drag sends nothing and changes nothing; a send queued before
          # the drop never replays; on reconnect EVERY target is re-applied
          # even when HA's value did not change (so an unsent "Open: 30%" is
          # erased), before the controls re-enable, with ZERO call_service.
          set -euo pipefail
          node scripts/test-ha-resync.mjs
      - name: Cold start compiles no shader inside a frame
        run: |
          # Source-level guard on the three fixes for the 1-3 s
          # requestAnimationFrame stalls on a cold load: the loop draws
          # nothing until the shader precompile settles, wallpaper materials
          # are built with a placeholder map so gaining the photo is not a
          # new program, and the shadow pass's depth program is precompiled
          # with the casters' real side and kept alive. See the header.
          set -euo pipefail
          node scripts/test-first-frame-gate.mjs
      - name: Gaming chair builder
        run: |
          # Asserts src/furniture/gaming-chair.js: the furniture frame (floor at
          # y=0, back at z=0 at every recline), the published size-L dimensions,
          # recline measured on the built geometry, and colour placement -- the
          # colourway on the seat and backrest FRONT only, black everywhere
          # else. A colour leaking onto the back is invisible from the front
          # 3/4 view a screenshot shows. Also: flat finishes only, and 'low'
          # detail genuinely cheaper. See the script's header.
          set -euo pipefail
          node scripts/test-gaming-chair.mjs
      - name: Standing desk builder geometry and height clamp
        run: |
          # Asserts src/furniture/standing-desk.js against the generic
          # furniture contract (bbox vs DEFAULTS within 0.5cm, x centred,
          # bottom y=0, back z=0, finish/keep tags, low <= full triangles --
          # already covered for every registered type by
          # test-furniture-core.mjs below) plus the desk-specific behaviour a
          # screenshot cannot pin: a requested topHeight outside
          # [minHeight, maxHeight] is CLAMPED rather than honoured (the sit-
          # stand slider's acceptance criterion), an absent topHeight
          # defaults to the range midpoint, and the two T-foot legs visibly
          # telescope (the upper stage's extension grows with topHeight while
          # the lower sleeve and its overlap stay fixed).
          set -euo pipefail
          node scripts/test-standing-desk.mjs
      - name: Strip light builder (A/B/C/D techniques)
        run: |
          # Asserts src/strip-light.js on the BUILT objects: light counts per
          # technique, B's lights spread evenly along the tube and set back
          # behind the mounting plane, conserved total intensity, C's area
          # light sized and aimed along the strip, D has no light objects.
          set -euo pipefail
          node scripts/test-strip-light.mjs
      - name: Robot vacuum builder envelope, dock toggle and caps
        run: |
          # Asserts src/furniture/robot-vacuum.js beyond the generic contract:
          # the envelope holds at DEFAULTS, with the dock off (35 x 35 x 10)
          # and with oversized parts (clamped), the robot's front is at
          # z = depth with its rear tucked under the tower, the status LED is
          # emissive and kept, dock:false has no dock meshes, no lights, the
          # triangle caps (2800 full / 600 low, low <= 0.3 x full), that
          # toFurnitureJSON emits only non-default keys, and the look: a TRUE
          # circle on 64 / 32 segments, a rounded top edge, the bumper round
          # the front, a turret above the body, seams at full only, a
          # bevelled dock lid.
          set -euo pipefail
          node scripts/test-robot-vacuum.mjs
      - name: Robot vacuum Home Assistant control (fake HA, no real calls)
        run: |
          # src/vacuum-control.js + the client fold + the tap card: bindings,
          # parseVacuum, each button enabled only when it applies, the exact
          # service call per button and per room, one reading per snapshot,
          # no repaint on an attribute-only republish, a resync that sends no
          # command, picking a merged robot by its world box, and every
          # button disabled offline. Runs against scripts/fake-ha-websocket.mjs.
          set -euo pipefail
          node scripts/test-vacuum-control.mjs
      - name: Plant moisture card (fake HA, read-only)
        run: |
          # src/plant-status.js + the client fold + the tap card: bindings,
          # parsePlant (an unavailable sensor reads OFFLINE, never 0%), the
          # dry / ok / wet thresholds at their edges, a status helper
          # overriding them, battery % and text, the watering countdown, one
          # reading per snapshot, no repaint on an unchanged republish, a
          # reconnect re-emits, NO call_service ever, picking a plant item,
          # and a card with no controls. Runs against scripts/fake-ha-websocket.mjs.
          set -euo pipefail
          node scripts/test-plant-status.mjs
      - name: Balcony builder envelope, bar gap, side modes and caps
        run: |
          # Asserts src/furniture/balcony.js beyond the generic contract: the
          # envelope at several sizes and every side mode, the largest clear
          # gap between the front railing's bars (measured on the built
          # geometry) is <= 10 cm even when barSpacing asks for more, the
          # front rail sits at z = depth, leftSide/rightSide 'none' and
          # 'solid' remove or replace that side (+x is right), glass panes
          # are glass and kept, and the caps (1500 full / 450 low, low <=
          # 0.6 x full).
          set -euo pipefail
          node scripts/test-balcony.mjs
      - name: Desk strip as a room light channel; Ambient row comes from rooms.json
        run: |
          # Asserts a named light channel (a desk LED strip bound in rooms.json
          # to its own entity) follows brightness AND colour, not just on/off,
          # with main/ambient/galaxy unchanged and cornice and channel entities
          # never driving each other; that a room's single Ambient row comes
          # from its rooms.json ambient binding rather than a geometry fixture
          # and a named channel adds no row; and that an office with a cornice
          # and a desk strip counts exactly two accent emitters, each on its own
          # entity, with no floor-level fixture.
          set -euo pipefail
          node scripts/test-desk-strip-channel.mjs
      - name: Scene light state seeding (bound channels)
        run: |
          # Asserts src/light-state.js seedLightState: a channel rooms.json
          # binds gets a light-state entry even with no geometry fixture, an
          # unbound unfixtured channel gets none, and main is never overwritten.
          set -euo pipefail
          node scripts/test-light-state.mjs
      - name: Kitchen LED strips as room light channels
        run: |
          # Asserts a kitchen's strip channels (top, under-cabinet, plinth),
          # each bound to its own entity, are driven only by that entity and
          # never by the ambience group; that the room keeps exactly ONE
          # Ambient row from its binding with no ambient fixture; and that its
          # accent emitters are exactly the three channels, with only the
          # plinth runs floor-level.
          set -euo pipefail
          node scripts/test-kitchen-strip-channels.mjs
      - name: Bedside table LED strips as room light channels
        run: |
          # Asserts that each drawer level of the two bedside tables, a strip
          # channel bound to its own entity, is driven only by that entity and
          # never by the ambience group; that the bedroom keeps ONE Ambient
          # row with no ambient fixture; that its emitters are the four levels
          # plus the cornice, each on its own entity; and that a level's
          # fixture box from cabinet.channelStripBoxes() lands on its table.
          set -euo pipefail
          node scripts/test-bedside-strip-channels.mjs
      - name: Wall decor (framed sign + wall sconce, both kinds) builder contract
        run: |
          # Asserts the builder contract for src/furniture/wall-sign.js and
          # wall-sconce.js (kinds 'swing-arm-globe' and 'up-down'): frozen
          # DEFAULTS with numeric width/height/depth, bbox matching DEFAULTS
          # within 0.5 cm, y=0 at the bottom, back face at z=0, and the
          # finish/merge contract -- every mesh tagged from the closed finish
          # palette, with the glass globe, its bulb, the up-down sconce's two
          # lenses and beam-cone hints, and the sign's CanvasTexture text
          # panel all marked userData.keep so the live renderer's per-finish
          # mesh merge leaves them as their own draw call. Also builds
          # wall-sign with NO global `document` at all -- the shape the
          # furniture-core drift test (branch feat/furniture-data-layer) runs
          # every builder in. Builds real three.js geometry from the vendored
          # module, same as test-wall-fittings.mjs.
          set -euo pipefail
          node scripts/test-wall-decor.mjs
      - name: Cabinet builder bbox, back-face, low-detail and fronts-grid rules
        run: |
          # Asserts src/furniture/cabinet.js: the built group's bounding box
          # matches params (width/height/depth, cm -> m) with y=0 the floor,
          # z=0 is the back (nothing behind it), detail:'low' produces fewer
          # triangles than 'full', normaliseFronts() fills/normalises/errors
          # per the fronts-grid contract, every mesh is tagged with a finish
          # from the closed set with glass/mirror/emissive marked keep=true,
          # and the bedside-table LED wrap sits in a drawer gap and wraps the
          # front + both sides (never the back). Builds real three.js
          # geometry from the vendored module.
          set -euo pipefail
          node scripts/test-cabinet.mjs
      - name: No two faces of a cabinet or small item z-fight
        run: |
          # Builds every cabinet preset and every small-items type/preset at
          # full and low detail and fails any two faces of one item that face
          # the same way within 1 mm of one plane and overlap -- the TV-screen
          # shimmer, the jagged mirror-pane and TV-console edges. Faces whose
          # materials shade identically are exempt. Self-tests first.
          set -euo pipefail
          node scripts/test-coplanar-faces.mjs
      - name: Live finishes are not near-black without an environment map
        run: |
          # The live scene has no env map, so metal/mirror use a live palette
          # entry; asserts it keeps >= 60% diffuse and that every metal part
          # of every registered builder actually reads it.
          set -euo pipefail
          node scripts/test-live-finishes.mjs
      - name: Plant builder geometry, seed determinism and finish tagging
        run: |
          # Asserts build()'s total height matches potHeight + plantHeight
          # (corn-plant) within tolerance, the base sits at y=0, a leaf's
          # widest spread stays within the requested footprint, 'low' detail
          # stays at or under the 300-triangle mobile budget for BOTH kinds
          # and is a real reduction from 'full', the SAME seed reproduces the
          # IDENTICAL leaf layout while a DIFFERENT seed changes it, the
          # corn-plant preset matches item 889bf6ce's measurements, every
          # mesh in every preset carries a valid userData.finish (the live
          # renderer merges meshes by finish) with glass/emissive meshes also
          # carrying userData.keep=true, and the wall-planter kind mounts
          # back-to-wall (z=0) with a distinct anatomy from the corn plant.
          set -euo pipefail
          node scripts/test-plant-builder.mjs
      - name: Bed builder (channel-tufted headboard)
        run: |
          # Asserts src/furniture/bed.js against the generic furniture
          # contract (covered for every registered type by
          # test-furniture-core.mjs) plus what makes it a soft, made-up bed:
          # channels inside a padded border that runs floor to top on both
          # sides; velvet rails (not a dark box) at baseHeight round the sides
          # and foot; a rounded, crowned mattress with its top at bedside
          # height; a duvet that covers the foot end, drapes to the rail tops,
          # folds back and faces outward; pillows at the headboard end; the
          # botanical print lying on the duvet, facing out, deterministic, and
          # absent for 'plain' and low detail; triangle caps.
          set -euo pipefail
          node scripts/test-bed.mjs
      - name: Soft-form geometry helpers (rounded box, pillow, sweep, cloth)
        run: |
          # src/furniture/soft.js: bbox, rounding, triangle counts and --
          # the one a wrong sign breaks silently -- every face pointing
          # OUTWARD, since a flipped face vanishes under back-face culling.
          set -euo pipefail
          node scripts/test-soft.mjs
      - name: Sofa builder (L corner / straight)
        run: |
          # Asserts src/furniture/sofa.js beyond the generic furniture
          # contract (already covered for every registered type by
          # test-furniture-core.mjs below): the default L is 275 x 197 x 88
          # and every layout, including params that fight each other, builds
          # to its own bbox within 0.5 cm; chaise 'right' puts the chaise
          # cushion at +x and 'left' at -x; an L has one arm at the
          # non-chaise end and 'none' has two; seat top = seatHeight, back
          # top = height, arm top = armHeight; fabric is matte and the
          # plinth takes baseFinish; no lights; full <= 2500 / low <= 800
          # triangles with low <= 0.6 x full; toFurnitureJSON emits only
          # non-default keys.
          set -euo pipefail
          node scripts/test-sofa.mjs
      - name: Rug pattern (procedural chevron shag)
        run: |
          # Asserts src/rug-pattern.js (a pure pixel filler, not a furniture
          # type): the same seed gives identical bytes and a different seed
          # different bytes; with pileNoise 0 every pixel is exactly a
          # palette colour and each colour covers 1/3 +-5 %; along a row the
          # colour changes at least twice per colour cycle and the band order
          # runs both ways (a zig-zag, not flat or plain diagonal stripes);
          # 'solid' is one colour; the module names no DOM global or
          # Math.random.
          set -euo pipefail
          node scripts/test-rug-pattern.mjs
      - name: Rug pattern in the scene (rooms[].rug.pattern -- plan orientation, loader, schema drift)
        run: node scripts/test-rug-pattern-scene.mjs
      - name: Page-only image previews (photo-frame span, rug texture warning)
        run: |
          # Asserts src/photo-span.js: one picked image covers a photo
          # frame's panels, centred and cropped, one slice per panel left to
          # right, on every photo-frame preset of the SmallItems page; and,
          # text-level, that the preview never leaves the browser and that
          # RugSpec shows a visible warning when ?texture= cannot reach 3D.
          set -euo pipefail
          node scripts/test-photo-span.mjs
      - name: Digital piano builder (piano, bench, ottoman)
        run: |
          # Asserts src/furniture/digital-piano.js (multi-type: digital-piano,
          # piano-bench, ottoman) beyond the generic contract: the piano's
          # case top and recessed keybed heights, exactly 36 black keys on the
          # real 88-key 2+3 pattern each centred on its white-key boundary, a
          # lit display and grilles, a stand of two SOLID side panels and a
          # back board (nothing leg-like), a small centred music rest leaning
          # AWAY from the player with its top pinned to `height`; the bench is
          # one style -- tufted seat dipping at all 8 buttons, an apron with a
          # knob on each end, four square tapered splayed legs, no X/column
          # parts; triangle caps for both; and the ottoman's channel-tufted
          # lid stands proud on exactly 4 legs.
          set -euo pipefail
          node scripts/test-digital-piano.mjs
      - name: Dining set (nesting round table + quadrant chairs) builder contract
        run: |
          # Asserts the builder contract for src/furniture/dining.js
          # (TYPES['dining-table'] and TYPES['dining-chair']): frozen
          # DEFAULTS with numeric width/height/depth, bbox matching DEFAULTS
          # within 0.5 cm, y=0 at the bottom, back face at z=0, and the
          # finish/merge contract. Also: no pedestal and exactly 4 SPLAYED
          # legs plus a crossbar frame for the table; the chair's 90-degree
          # wedge (quadrant) shape at several radius/backSweep combinations,
          # with its legs and stretcher verified to stay strictly inside the
          # wedge's true boundary (arc + two straight sides -- a narrowing
          # triangle, not a rectangle); the curved back shell's OUTER surface
          # faces away from the wedge's own apex (sampled from the built
          # geometry's own winding, with a mutation-probe proving a raw
          # mirrored-scale build would fail this check); and NESTING
          # geometry-sampling checks (round 1 review found the original
          # arithmetic-only nesting checks hollow while the real tucked set
          # interpenetrated): points sampled along the table's own leg and
          # crossbar SURFACES (not just vertices -- a leg's surface can cross
          # a thin band, like the chair seat's slab, entirely between its two
          # vertex rings) are checked against every tucked chair's actual
          # seat and back-shell geometry, with a mutation-probe proving a
          # too-shallow leg inset would be caught; plus the chair back's
          # highest point clearing the table's underside by about 1cm.
          # dining.js had no per-module test file before this (noted on item
          # b27ddcdd); this is that file, added alongside the wall-clock
          # split and the nesting-set redesign (item 89769f2b).
          set -euo pipefail
          node scripts/test-dining.mjs
      - name: Wall clock (framed + diy-numerals) builder contract
        run: |
          # Asserts the builder contract for src/furniture/wall-clock.js,
          # split out of dining.js (item 89769f2b, 2026-09-26): frozen
          # DEFAULTS with numeric width/height/depth, bbox matching DEFAULTS
          # within 0.5 cm for both `kind`s, y=0 at the bottom, back face at
          # z=0, and the finish/merge contract -- the three hand meshes and
          # the hub (the parts that move or must stay flush at the declared
          # depth) carry userData.keep. Also: angleForTime(date) matches the
          # documented radians-clockwise-from-12 convention and is pure,
          # setClockTime(group, date) rotates exactly the three named hand
          # meshes and nothing else, and a garbage `time` string falls back
          # to 10:10 rather than throwing.
          set -euo pipefail
          node scripts/test-wall-clock.mjs
      - name: WebGL failure is classified correctly
        run: |
          # Asserts which of the two WebGL failures we tell the user about. Out
          # of graphics memory (usually a lot of open tabs) is fixed by closing
          # some; no usable GPU is not, and closing tabs does nothing. The
          # dangerous direction is the FALSE POSITIVE: telling someone with a
          # broken GPU to close tabs is confident, actionable and wrong. The
          # string three.js actually throws once it has dropped the reason --
          # "Error creating WebGL context." -- reaches the matcher as a fallback
          # on every failure of either kind, so if it ever starts matching, every
          # broken-GPU user gets the tabs advice. That case is pinned here.
          set -euo pipefail
          node scripts/test-webgl-reason.mjs
      - name: Furniture placement, finishes, box builder and registry
        run: node scripts/test-furniture-core.mjs
      - name: Model furniture type (vendored GLTFLoader, prepare(), fit, merge, demo file)
        run: node scripts/test-model.mjs
      - name: Wall side is probed at the item, not from the room's bbox
        run: node scripts/test-wall-side.mjs
      - name: Wallpaper lands on the face its side names, whichever way the wall was drawn
        run: node scripts/test-wallpaper-face.mjs
      - name: Wall finishes (schema, brick spec-page parity, one face only, bands and spans, fade)
        run: node scripts/test-wall-finishes.mjs
      - name: Living-room slat panel span comes from wall 1's slats field
        run: node scripts/test-wall-slats.mjs
      - name: Furniture drift (registry, schema params blocks, builder DEFAULTS)
        run: node scripts/test-furniture-defaults.mjs
      - name: Spec pages -- one page per family, every type on one page, one object/variant picker
        # Every registry type is signed off on exactly one spec page's
        # manifest, no page is orphaned from the Settings list, old URLs of
        # folded pages redirect to a declared object, and every page uses the
        # shared SpecPage/SpecVariants picker with no other switcher.
        run: node scripts/test-spec-pages.mjs
      - name: Kitchen builders (corner, sink, LEDs, draw budget)
        # What the generic contract cannot see: runs beyond DEFAULTS, the L's
        # worktops meeting without overlap or gap, LED strips continuous round
        # the corner, the four-draw budget, and Copy JSON's diff.
        run: node scripts/test-furniture-kitchen.mjs
      - name: Small items -- envelope, facing and finish tags per type x preset x detail
        run: node scripts/test-small-items.mjs
      - name: Bathroom fittings -- presets, triangle caps, loft winding, notch, envelopes
        run: node scripts/test-furniture-bathroom.mjs
      - name: Furniture renderer (placement, merge buckets, shadow proxies, fade, attach)
        run: node scripts/test-furniture-render.mjs
      - name: Quality tier - mobile-GPU axis, ?tier= override, pixel-ratio cap
        run: node scripts/test-quality-tier.mjs
      - name: Adaptive quality - level ladder, simulated frame-time series, hysteresis, storage
        run: node scripts/test-adaptive-quality.mjs
      - name: Room lights - per-channel collapse to one or two lights
        run: node scripts/test-light-collapse.mjs
      - name: Tap popovers -- target resolution, nearest-visible occlusion, placement
        run: node scripts/test-tap-popovers.mjs
      - name: Room click -- walls block and resolve to the side tapped, furniture passes through
        run: node scripts/test-room-pick.mjs
      - name: Spec pages don't reference a module-scope import alias out of scope
        run: |
          # Item 059873ed, round-2 review: ClockSpec.html's furnitureJSON()
          # referenced a bare `WallClock`, which is a `const` local to a
          # DIFFERENT top-level function (the module import lives in a
          # separate <script type="module"> scope entirely) -- a
          # ReferenceError during React's render that unmounted the WHOLE
          # PAGE, blank at every viewport. No existing job renders a spec
          # page (they are static HTML + Babel, not modules under test), so
          # nothing caught it before a live browser review did. This is a
          # static, per-function scope check across all specs/*.html (not a
          # real render/mount smoke test -- this repo has no headless
          # browser in its toolchain to run one; see the script's own header
          # for exactly what it does and does not catch).
          set -euo pipefail
          node scripts/test-spec-module-scope.mjs
      - name: Pinned sidebar -- open/pin state machine and its triggers
        run: node scripts/test-sidebar-pin.mjs
      - name: Camera zoom (dolly-through, never inverts) and two-finger pan/pinch classification
        run: node scripts/test-camera-gestures.mjs
      - name: Sliders and popover -- every range part styled, diamond matches the card, color-scheme dark
        run: node scripts/test-range-styles.mjs
      - name: Theme -- Auto/Dark/Light resolution, persistence, system listener, pre-paint script
        run: node scripts/test-theme.mjs
      - name: Accent light colour -- rgb/hs conversion, colour square, HA colour parsing
        run: node scripts/test-light-color.mjs
      - name: Real sun -- solar position, daylight curve, window sun pools, sun.sun, ?time=
        run: node scripts/test-sun-position.mjs
      - name: Curtain daylight -- sun only through the open part, floor headroom, title contrast
        run: node scripts/test-curtain-daylight.mjs
      - name: Diagnostics -- frame statistics and scripted camera moves
        run: node scripts/test-diagnostics-stats.mjs
      - name: Diagnostics -- benchmark plan, verdict, result document, inert scene hooks
        run: node scripts/test-diagnostics-verdict.mjs
      - name: Diagnostics -- device block null handling, identity, copy and save I/O
        run: node scripts/test-diagnostics-device.mjs
      - name: Diagnostics -- save endpoint contract (dev server), nginx/njs config, entrypoint switch
        run: node scripts/test-diagnostics-save.mjs
      - name: Validate every JSON file in houses/ and the repo root
        run: |
          set -euo pipefail
          found=0
          check() {
            echo "checking $1"
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$1"
          }
          while IFS= read -r -d '' f; do
            found=$((found + 1)); check "$f"
          done < <(find houses -type f -name '*.json' -not -path '*/vendor/*' -print0 2>/dev/null)
          while IFS= read -r -d '' f; do
            found=$((found + 1)); check "$f"
          done < <(find . -maxdepth 1 -type f -name '*.json' -print0)
          echo "Checked $found JSON file(s)."

  house-profiles:
    name: House profile validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install jsonschema
        # The validator degrades to structural-only checks without this and says
        # so on stdout - but a degraded pass in CI is a pass that missed things,
        # so install it rather than relying on the fallback.
        run: python -m pip install --disable-pip-version-check --quiet jsonschema
      - name: Validate every house profile with scripts/validate-house.py
        run: |
          set -euo pipefail
          # The validator is the single source of truth for what a valid house
          # is (schema + cross-file checks). CI runs THAT script rather than
          # reimplementing validation, so the two can never drift apart.
          if [ ! -f scripts/validate-house.py ]; then
            echo "::error file=scripts/validate-house.py::House validator scripts/validate-house.py is missing."
            exit 1
          fi
          if [ ! -f houses/schema.json ]; then
            echo "::error file=houses/schema.json::houses/schema.json is missing - the validator cannot run."
            exit 1
          fi
          # Null-delimited into an array: safe for paths with spaces, and avoids
          # word-splitting an unquoted expansion (shellcheck SC2086).
          profiles=()
          while IFS= read -r -d '' p; do
            profiles+=("$p")
          done < <(find houses -mindepth 2 -maxdepth 2 -name geometry.json -print0 | sort -z)
          if [ ${#profiles[@]} -eq 0 ]; then
            echo "No houses/*/geometry.json found - nothing to validate."
            exit 0
          fi
          printf 'will validate %s\n' "${profiles[@]}"
          # Pass the house DIRECTORY, not the bare geometry.json: only the
          # directory form also validates rooms.json and the cross-file
          # geometry<->rooms reference checks.
          dirs=()
          for p in "${profiles[@]}"; do
            dirs+=("$(dirname "$p")")
          done
          python scripts/validate-house.py "${dirs[@]}"
      - name: Furniture schema and validator checks
        run: python scripts/test-validate-furniture.py
      - name: footstepPath validator checks (outside waypoint, segment leaving the room, door gap empties the trail)
        run: python scripts/test-validate-footstep-path.py
      - name: sensors.vacuums schema and validator checks (unknown furniture item, unknown segment room, version)
        run: python scripts/test-validate-vacuum.py
      - name: sensors.plants schema and validator checks (moisture or watering, unknown furniture item, thresholds, version)
        run: python scripts/test-validate-plant.py
      - name: sh3d-furniture / furniture-apply tests
        run: python scripts/test-sh3d-furniture.py

  # --- Docker dry run (path-gated) -----------------------------------------

  docker-dry-run:
    name: Docker build (dry run)
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Is there a Dockerfile to build?
        id: dockerfile
        run: |
          # The `docker` path filter also matches .dockerignore and deploy/**,
          # either of which can legitimately change while the Dockerfile itself
          # has not landed yet. Without this probe buildx dies with an opaque
          # "failed to read dockerfile: no such file or directory" and the gate
          # reports a red build for a file nobody touched.
          if [ -f Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Dockerfile at the repo root yet - skipping the dry-run build."
          fi
      - name: Build Docker image (no push)
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: home3d:ci
          build-args: |
            APP_VERSION=ci-dry-run
      - uses: actions/setup-node@v6
        if: steps.dockerfile.outputs.present == 'true'
        with:
          node-version: 24
      - name: Run the image, check cache headers and import stamping
        if: steps.dockerfile.outputs.present == 'true'
        run: |
          set -euo pipefail
          docker run -d --name home3d-ci -p 8080:80 home3d:ci
          trap 'docker logs home3d-ci || true; docker rm -f home3d-ci >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          # Every relative import in the SERVED tree carries ?v=<version>.
          docker cp home3d-ci:/usr/share/nginx/html ./built
          node scripts/test-import-stamping.mjs --scan ./built ci-dry-run
          # Cache policy: only ?v= URLs are immutable.
          cc() { curl -fsSI "http://127.0.0.1:8080$1" | tr -d '\r' | grep -i '^cache-control:' | cut -d' ' -f2-; }
          expect() {
            got=$(cc "$1")
            echo "$1 -> Cache-Control: $got"
            [ "$got" = "$2" ] || { echo "::error::$1 expected Cache-Control '$2', got '$got'"; exit 1; }
          }
          expect '/src/wall-fittings.js'               'no-cache'
          expect '/src/wall-fittings.js?v=ci-dry-run'  'public, max-age=31536000, immutable'
          expect '/specs/spec-three.jsx'               'no-cache'
          expect '/specs/BedSpec.html'                 'no-cache'
          expect '/'                                   'no-cache'
          expect '/houses/demo/geometry.json'          'no-cache'
          expect '/houses/demo/geometry.json?v=x'      'no-cache'
          expect '/vendor/three-r160/three.module.min.js?v=ci-dry-run' 'public, max-age=31536000, immutable'
          # Exactly one Cache-Control header (no stray one from `expires`).
          n=$(curl -fsSI 'http://127.0.0.1:8080/src/wall-fittings.js' | grep -ci '^cache-control:')
          [ "$n" = 1 ] || { echo "::error::expected one Cache-Control header, got $n"; exit 1; }
          # /diagnostics (item 112ec00c): the page, the slash redirect, and the
          # save endpoint OFF by default (a JSON 404, config.js says false).
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          [ "$(code http://127.0.0.1:8080/diagnostics)" = 200 ] || { echo "::error::/diagnostics not 200"; exit 1; }
          loc=$(curl -sI 'http://127.0.0.1:8080/diagnostics/?mode=quick' | tr -d '\r' | grep -i '^location:' | cut -d' ' -f2-)
          [ "$loc" = "/diagnostics?mode=quick" ] || { echo "::error::/diagnostics/ redirect went to '$loc'"; exit 1; }
          body='{"schema":"home3d-diagnostics","schemaVersion":1,"save":{"deviceId":"ci-device","appVersion":"ci"}}'
          [ "$(code -X POST -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8080/api/diagnostics)" = 404 ] \
            || { echo "::error::save endpoint should be OFF by default"; exit 1; }
          curl -fsS http://127.0.0.1:8080/config.js | grep -q 'diagnosticsSave: false' || { echo "::error::config.js lacks diagnosticsSave: false"; exit 1; }
      - name: Diagnostics save endpoint ON (njs in the real image)
        if: steps.dockerfile.outputs.present == 'true'
        run: |
          set -euo pipefail
          mkdir -p runs && sudo chown 101:101 runs
          docker run -d --name home3d-diag -p 8081:80 -e HOME3D_DIAGNOSTICS_DIR=/data/diagnostics \
            -v "$PWD/runs:/data/diagnostics" home3d:ci
          trap 'docker logs home3d-diag || true; docker rm -f home3d-diag >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8081/healthz >/dev/null 2>&1 && break; sleep 1; done
          docker logs home3d-diag 2>&1 | grep -q 'diagnostics saving: ON' || { echo "::error::endpoint did not switch on"; exit 1; }
          curl -fsS http://127.0.0.1:8081/config.js | grep -q 'diagnosticsSave: true'
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          body='{"schema":"home3d-diagnostics","schemaVersion":1,"save":{"deviceId":"../../ci dev","appVersion":"ci-1"}}'
          out=$(curl -s -X POST -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8081/api/diagnostics)
          echo "$out"
          echo "$out" | grep -q '"ok":true' || { echo "::error::save failed"; exit 1; }
          find runs -type f
          n=$(find runs -type f -name '*.json' | wc -l)
          [ "$n" = 1 ] || { echo "::error::expected one saved run, found $n"; exit 1; }
          set -- runs/*_cidev_ci-1.json
          [ -f "$1" ] || { echo "::error::unexpected file name (want <received-at>_cidev_ci-1.json)"; exit 1; }
          case "${1##*/}" in
            [0-9][0-9][0-9][0-9]-*) ;;
            *) echo "::error::file name does not start with the received-at timestamp"; exit 1 ;;
          esac
          [ "$(code http://127.0.0.1:8081/api/diagnostics)" = 405 ] || { echo "::error::GET must be refused"; exit 1; }
          [ "$(code -X POST -H 'Content-Type: application/json' -d '{"schema":"home3d-diagnostics","schemaVersion":2}' http://127.0.0.1:8081/api/diagnostics)" = 422 ]
          [ "$(code -X POST -H 'Content-Type: application/json' -d 'nope' http://127.0.0.1:8081/api/diagnostics)" = 400 ]
          head -c 300000 /dev/zero | tr '\0' 'x' > big.json
          [ "$(code -X POST -H 'Content-Type: application/json' --data-binary @big.json http://127.0.0.1:8081/api/diagnostics)" = 413 ]
          # The burst is spent by now (6/min, burst 3): the next saves are refused.
          last=0; for _ in 1 2 3 4; do last=$(code -X POST -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8081/api/diagnostics); done
          [ "$last" = 429 ] || { echo "::error::rate limit did not engage (last: $last)"; exit 1; }
      - name: Diagnostics save endpoint -- storage cap and web-root refusal (real image)
        if: steps.dockerfile.outputs.present == 'true'
        run: |
          set -euo pipefail
          # A directory already at the file cap: the next save is 507, nothing written.
          mkdir -p full && echo '{}' > full/existing.json && sudo chown -R 101:101 full
          docker run -d --name home3d-cap -p 8082:80 -e HOME3D_DIAGNOSTICS_DIR=/data/diagnostics \
            -e HOME3D_DIAGNOSTICS_MAX_FILES=1 -v "$PWD/full:/data/diagnostics" home3d:ci
          # A save directory inside the web root would make runs readable over HTTP: refused.
          docker run -d --name home3d-webroot -p 8083:80 -e HOME3D_DIAGNOSTICS_DIR=/usr/share/nginx/html/houses home3d:ci
          trap 'docker logs home3d-cap || true; docker logs home3d-webroot || true; docker rm -f home3d-cap home3d-webroot >/dev/null 2>&1 || true' EXIT
          for port in 8082 8083; do
            for _ in $(seq 1 30); do curl -fsS "http://127.0.0.1:$port/healthz" >/dev/null 2>&1 && break; sleep 1; done
          done
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          body='{"schema":"home3d-diagnostics","schemaVersion":1,"save":{"deviceId":"cap","appVersion":"ci"}}'
          got=$(code -X POST -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8082/api/diagnostics)
          [ "$got" = 507 ] || { echo "::error::file cap did not refuse (got $got)"; exit 1; }
          n=$(find full -type f | wc -l)
          [ "$n" = 1 ] || { echo "::error::the cap refusal wrote a file ($n files)"; exit 1; }
          docker logs home3d-webroot 2>&1 | grep -q 'diagnostics saving: OFF' || { echo "::error::web-root directory was not refused"; exit 1; }
          got=$(code -X POST -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8083/api/diagnostics)
          [ "$got" = 404 ] || { echo "::error::web-root container should have saving OFF (got $got)"; exit 1; }

  docker-dry-run-gate:
    name: Docker dry run (required)
    needs: [changes, docker-dry-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pass — docker files not changed
        if: needs.changes.outputs.docker == 'false'
        run: echo "No Docker-relevant files changed, skipping docker-dry-run"
      - name: Fail — docker-dry-run failed
        if: needs.changes.outputs.docker == 'true' && needs.docker-dry-run.result != 'success'
        run: exit 1
