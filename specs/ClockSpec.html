<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wall clock — Spec</title>
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { background:#f4f1ec; color:#1a1a1a; font-family:ui-monospace,'SF Mono',Menlo,monospace; padding:24px; }
  h1 { font-size:14px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; margin-bottom:4px; }
  .sub { font-size:11px; opacity:0.6; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
  .card { background:#fff; border:1px solid #d8d3c8; border-radius:6px; padding:20px; }
  .card h2 { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; opacity:0.7; margin-bottom:14px; }
  #c3d { width:100%; height:560px; display:block; background:#1a1a1c; border-radius:4px; }
  .legend { font-size:10px; line-height:1.6; margin-top:14px; opacity:0.75; }
  .row { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .btn { padding:6px 10px; font:inherit; font-size:10px; background:#1a1a1c; color:#fff; border:none; border-radius:4px; cursor:pointer; }
  .btn:hover { background:#333; }
  .btn.active { background:#6b5d4a; }
  .full { grid-column:1 / -1; }
  table { width:100%; border-collapse:collapse; font-size:11px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid #ece8e0; }
  th { font-weight:600; opacity:0.6; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  pre.json { font-size:10px; background:#f8f6f1; border:1px solid #e6e1d6; border-radius:4px; padding:10px;
    max-height:180px; overflow:auto; white-space:pre-wrap; word-break:break-word; }
  .copied { color:#2a7a3f; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Which objects this page holds (read by SpecPage in tweaks-panel.jsx and by
     scripts/test-spec-pages.mjs). Both are the one `wall-clock` type, but the
     stick-on word clock has different controls (no face or rim; a second-hand
     colour), so it is its own OBJECT. DIY numerals and framed share controls,
     so they are VARIANTS of the wall clock. -->
<script type="application/json" id="spec-manifest">
{
  "title": "Wall clock",
  "description": "A working wall clock that always shows the time. Renders the REAL src/furniture/wall-clock.js builder. Pick an object and a variant, then fine-tune in the Tweaks panel.",
  "objects": [
    { "id": "word-clock", "label": "Word clock (stick-on)", "types": ["wall-clock"] },
    { "id": "wall-clock", "label": "Wall clock", "types": ["wall-clock"] }
  ]
}
</script>

<!-- React/ReactDOM/Babel/three served LOCALLY (../vendor/) — no CDN: this app must work on a LAN with no internet. React is the production build; Babel is required because the .jsx below is transpiled in-browser at runtime. -->
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../vendor/babel.min.js"></script>
<script src="../vendor/three.js"></script>
<!-- Shared harness: tweaks-panel.jsx (tweaks machinery) + reusable ThreeView -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="spec-three.jsx"></script>

<!--
  wall-clock.js is the REAL shipped builder module (pure ESM, THREE injected,
  no side effects) -- this page renders exactly what the live scene renders,
  not a re-implementation that could drift from it. It is loaded here via a
  classic `type="module"` script (the only way an ES module reaches a page
  built from classic `text/babel` scripts) and its exports are copied onto
  `window` for the Babel script below to use. `window.THREE` above is the UMD
  build of the SAME three.js revision wall-clock.js is tested against, so
  passing it in as wall-clock.js's injected THREE is exactly what the live
  scene does.
-->
<script type="module">
  import * as WallClock from '../src/furniture/wall-clock.js';
  window.__wallClock = WallClock;
  window.dispatchEvent(new Event('__wall_clock_ready'));
</script>

<script type="text/babel">
/* =====================================================================
   CLOCK SPEC — a working wall clock, three styles. Renders the REAL builder
   in src/furniture/wall-clock.js, not a re-implementation, so this page can
   never drift from what a house profile actually gets.

   `diy-numerals` -- a DIY wall clock seen in the living room (numerals/dots
   stuck straight on the wall around a plain hands unit -- no face disc).
   `framed` -- a conventional round face + rim + hands.
   `diy-words` -- a frameless stick-on clock design (item 059873ed,
   2026-09-27): big numerals at 12/9/6, dots at 7/8/10/11, the words
   "One" to "Five" to the right of the 1-5 ring positions, a centre disc,
   tapered black hour/minute hands and a thin red second hand with a tail.
   This is the DEFAULT preset below, per the item's acceptance criteria.

   Split out of DiningSpec.html (item 89769f2b, 2026-09-26) -- the clock
   shared no geometry with the dining table/chairs, just a spec page by
   coincidence of both being kitchen photos.

   THE CLOCK IS LIVE, ALWAYS. wall-clock.js exports startLiveClock(group,
   opts), which ticks setClockTime(group, date) once a second and resyncs
   immediately whenever this tab becomes visible again (see its own doc
   comment for why: a backgrounded tab's timers are throttled/suspended by
   the browser, so without an explicit resync the clock would sit frozen,
   then jump, rather than reading correctly the instant you look at it).
   This page's own render loop (spec-three.jsx's ThreeView) already runs
   continuously for the orbit camera regardless of the clock, so calling
   setClockTime once a second here costs nothing extra; the live HOUSE scene
   (render-on-demand) is the case startLiveClock's onTick hook exists for --
   src/home3d-scene.js's attachFurniture starts one per placed wall-clock
   item and requests a single repaint per tick, exactly as this page does,
   just without a continuously-running orbit loop underneath it.
   ===================================================================== */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "preset": "photo-match-words",
  "clockKind": "diy-words",
  "clockDiameter": 30,
  "clockDepth": 4,
  "clockFaceColor": "#f5f2ea",
  "clockRimColor": "#1a1a1a",
  "clockNumeralColor": "#1a1a1a",
  "clockHandColor": "#1a1a1a",
  "clockSecondHandColor": "#c62828",
  "clockLive": true
}/*EDITMODE-END*/;

const CM = 0.01;

// Presets: named combinations a reviewer can jump straight to, instead of
// hand-dialling every slider back to a known-good state. "photo-match-words"
// (the DEFAULT) is the owner's actual kitchen clock; "photo-match" is the
// living-room diy-numerals photo; "framed" is the conventional alternative.
const PRESETS = {
  'photo-match-words': {
    clockKind: 'diy-words', clockDiameter: 30, clockDepth: 4,
    clockFaceColor: '#f5f2ea', clockRimColor: '#1a1a1a', clockNumeralColor: '#1a1a1a',
    clockHandColor: '#1a1a1a', clockSecondHandColor: '#c62828'
  },
  'photo-match': {
    clockKind: 'diy-numerals', clockDiameter: 30, clockDepth: 4,
    clockFaceColor: '#f5f2ea', clockRimColor: '#1a1a1a', clockNumeralColor: '#1a1a1a',
    clockHandColor: '#1a1a1a', clockSecondHandColor: '#1a1a1a'
  },
  'framed-clock': {
    clockKind: 'framed', clockDiameter: 34, clockDepth: 5,
    clockFaceColor: '#f5f2ea', clockRimColor: '#3a2f22', clockNumeralColor: '#1a1a1a',
    clockHandColor: '#1a1a1a', clockSecondHandColor: '#1a1a1a'
  }
};

// ============== Wait for wall-clock.js (ES module) to attach to window ==============
function useWallClockModule() {
  const [mod, setMod] = React.useState(window.__wallClock || null);
  React.useEffect(() => {
    if (mod) return;
    const onReady = () => setMod(window.__wallClock);
    window.addEventListener('__wall_clock_ready', onReady);
    return () => window.removeEventListener('__wall_clock_ready', onReady);
  }, [mod]);
  return mod;
}

// ============== Build the clock into a scene ==============
function buildClockScene(t, group, THREE, ctx) {
  const WallClock = window.__wallClock;
  if (!WallClock) return;

  // A small backing wall behind the scene so "on the wall" reads clearly
  // rather than floating in space. Widened for diy-words, whose envelope
  // extends well past the ring diameter (the words to the right of it).
  const wallSpan = t.clockKind === 'diy-words' ? 3.2 : 2;
  const wallHeight = 2.2;
  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(wallSpan, wallHeight, 0.1),
    new THREE.MeshStandardMaterial({ color: 0xece8e0, roughness: 0.95 })
  );
  wall.position.set(0, wallHeight / 2, -0.8);
  wall.receiveShadow = true;
  group.add(wall);

  // diy-words' own width/height are the WIDER full envelope (including the
  // words), not the ring diameter -- width/height are derived by the
  // builder from `diameter` for diy-words too (DIY_WORDS_DEFAULTS), so pass
  // the ring diameter through `diameter` only and let the builder compute
  // its own envelope, rather than forcing width=height=diameter as the
  // other two kinds do.
  const buildParams = t.clockKind === 'diy-words'
    ? {
        diameter: t.clockDiameter, depth: t.clockDepth, kind: t.clockKind,
        numeralColor: t.clockNumeralColor, handColor: t.clockHandColor,
        secondHandColor: t.clockSecondHandColor, time: '10:10'
      }
    : {
        width: t.clockDiameter, height: t.clockDiameter, depth: t.clockDepth, diameter: t.clockDiameter,
        kind: t.clockKind, faceColor: t.clockFaceColor, rimColor: t.clockRimColor,
        numeralColor: t.clockNumeralColor, handColor: t.clockHandColor,
        secondHandColor: t.clockSecondHandColor, time: '10:10'
      };
  const clock = WallClock.build(THREE, buildParams, { detail: 'full' });
  clock.position.set(0, 1.15, wall.position.z + 0.05 + 0.001);
  group.add(clock);
  ctx.clockGroup = clock;
  ctx.WallClock = WallClock;

  // ALWAYS shows the viewer's current local time (item 059873ed) --
  // startLiveClock ticks once a second and resyncs on a visibilitychange to
  // a visible tab; this page's own render loop already runs continuously
  // (the orbit camera), so onTick has nothing extra to request here.
  //
  // The running timer is tracked in the MODULE-scope currentStopLiveClock,
  // not on `ctx`: ThreeView's own rebuild effect deletes every key on `ctx`
  // BEFORE calling buildModel again (see spec-three.jsx, "reset per-build
  // context stash"), so a value stashed on ctx here would already be gone
  // by the time the NEXT rebuild tried to read it back to stop the old
  // timer -- a stale interval would keep ticking a disposed, geometry-freed
  // group forever every time a tweak changes. This page only ever mounts
  // one ThreeView, so one module-scope slot is enough; a page with more than
  // one live clock at once would need to key this per clock instance
  // instead.
  if (currentStopLiveClock) currentStopLiveClock();
  currentStopLiveClock = t.clockLive ? WallClock.startLiveClock(clock) : null;
}
let currentStopLiveClock = null;

function animateClockScene() {
  // Intentionally empty: the clock's own live-time updates are driven by
  // startLiveClock's 1-second interval (started in buildClockScene), not by
  // this per-frame animate callback -- see the header note on why.
}

// ============== Copy-JSON: the furniture[] entry this preset implies ==============
//
// Round 2 review (item 059873ed, code_review 01ba013f HIGH): this function
// used to reference a bare `WallClock` -- that identifier is a LOCAL const
// inside buildClockScene() (the scene-builder closure above), not a global,
// so calling furnitureJSON() from anywhere else threw a ReferenceError.
// React calls furnitureJSON() during render for the Copy JSON <pre>, so this
// crashed the WHOLE PAGE on the default diy-words preset -- confirmed blank
// at every viewport by both reviewers. Fixed the same way buildClockScene()
// itself already reads the module: window.__wallClock, with a null guard
// (App can render before the '__wall_clock_ready' event fires, exactly the
// race useWallClockModule() above exists to handle -- see its own doc
// comment). When the module is not yet loaded, this returns a short
// placeholder string instead of JSON, rather than throwing.
//
// F5 residual (same code_review, low): a fixed 49.8x39 (the 30cm-diameter
// envelope) was itself wrong at any OTHER diameter -- the Diameter slider
// runs 20-45cm, and at 45cm the builder draws ~74.7x58.5. Re-deriving the
// layout formula here would be a second copy of WORD_LEFT_R/WORD_RIGHT_R/
// Y_MARGIN_R to keep in sync (they are private to wall-clock.js, not
// exported); instead this BUILDS the real diy-words clock at the chosen
// diameter with the actual builder and reads its own bounding box, so the
// emitted width/height can never drift from what build() actually draws,
// at any diameter.
function furnitureJSON(t) {
  const mod = window.__wallClock;
  const THREE = window.THREE;
  let params;
  if (t.clockKind === 'diy-words') {
    let width = t.clockDiameter, height = t.clockDiameter; // placeholder until the real build below
    if (mod && THREE) {
      // 'low' detail: this measures the envelope only, never rendered, so
      // the cheaper geometry is enough and keeps the per-render cost small.
      // React calls this on every render (it is inlined in JSX, not memoed),
      // so the probe group's geometries/materials are disposed immediately
      // after reading its bbox -- otherwise this would leak a full set of
      // clock meshes on every keystroke in the Tweaks panel.
      const probe = mod.build(THREE, Object.assign({}, mod.DIY_WORDS_DEFAULTS, { diameter: t.clockDiameter }), { detail: 'low' });
      const box = new THREE.Box3().setFromObject(probe);
      const size = new THREE.Vector3();
      box.getSize(size);
      width = Math.round(size.x * 100 * 100) / 100;  // metres -> cm, 2 decimal places
      height = Math.round(size.y * 100 * 100) / 100;
      probe.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
      });
    }
    params = {
      width, height,
      diameter: t.clockDiameter, depth: t.clockDepth, kind: t.clockKind,
      numeralColor: t.clockNumeralColor, handColor: t.clockHandColor, secondHandColor: t.clockSecondHandColor
    };
  } else {
    params = {
      width: t.clockDiameter, height: t.clockDiameter, depth: t.clockDepth, diameter: t.clockDiameter,
      kind: t.clockKind, faceColor: t.clockFaceColor, rimColor: t.clockRimColor,
      numeralColor: t.clockNumeralColor, handColor: t.clockHandColor
    };
  }
  const items = [
    {
      id: 'kitchen_wall_clock', room: 'kitchen', type: 'wall-clock',
      wall: 0, centre: 0, offset: 0, elevation: 150,
      params,
      notes: 'wall/centre are placeholders -- set to the real wall id and position.'
    }
  ];
  return JSON.stringify(items, null, 2);
}

function CopyJSONButton({ t }) {
  const [copied, setCopied] = React.useState(false);
  const onClick = () => {
    const json = furnitureJSON(t);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 1500);
      });
    }
  };
  return (
    <button className="btn" onClick={onClick}>{copied ? 'Copied!' : 'Copy JSON'}</button>
  );
}

// A plain, human-readable "what the clock should be showing right now"
// readout, refreshed once a second from the SAME wall-clock time source
// (the browser's own Date) -- so a reviewer's screenshot can show this text
// next to the system clock and the 3D hands, satisfying the acceptance
// criterion that the shown time is stated and comparable to the system
// clock. This is independent of clockLive (it always reflects "now"),
// deliberately: the acceptance check is "does live time work", not "is the
// toggle currently on".
function useNowLabel() {
  const [now, setNow] = React.useState(() => new Date());
  React.useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  return hh + ':' + mm + ':' + ss;
}

// ============== App ==============
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const clockReady = useWallClockModule();
  const nowLabel = useNowLabel();

  const applyPreset = (name) => {
    const p = PRESETS[name];
    if (!p) return;
    setTweak(Object.assign({ preset: name }, p));
  };

  // OBJECT: the stick-on word clock (diy-words) or a wall clock; VARIANTS: the
  // presets of that object (same controls, different values).
  const OBJECT_PRESETS = { 'word-clock': ['photo-match-words'], 'wall-clock': ['photo-match', 'framed-clock'] };
  const VARIANT_LABELS = { 'photo-match-words': 'Words + numerals (photo match)', 'photo-match': 'DIY numerals (photo match)', 'framed-clock': 'Framed' };
  const objectId = t.clockKind === 'diy-words' ? 'word-clock' : 'wall-clock';
  const variants = OBJECT_PRESETS[objectId].map(id => ({ id, label: VARIANT_LABELS[id], params: PRESETS[id] }));
  return (
    <SpecPage objectId={objectId} onObject={id => applyPreset(OBJECT_PRESETS[id][0])}>
      <SpecVariants variants={variants} values={t} onSelect={applyPreset} />
      <div className="sub">{objectId === 'word-clock'
        ? 'A frameless stick-on clock: big numerals at 12/9/6, dots, the words One to Five, tapered hands and a thin red second hand.'
        : 'A clock with numerals and dots stuck straight on the wall (DIY numerals), or a conventional round face with a rim (Framed).'}</div>

      <div className="row" style={{ marginBottom: 16 }}>
        <CopyJSONButton t={t} />
      </div>

      <div className="grid">
        <div className="card">
          <h2>Numbers</h2>
          <table>
            <tbody>
              <tr><th>Feature</th><th className="num">value</th><th>Variability</th></tr>
              <tr><td>Clock kind</td><td className="num">{t.clockKind}</td><td><b>Variable</b> — diy-words, diy-numerals or framed</td></tr>
              <tr><td>Clock diameter × depth</td><td className="num">{t.clockDiameter}×{t.clockDepth}</td><td>Wall-mounted</td></tr>
              <tr><td><b>Current local time</b></td><td className="num"><b>{nowLabel}</b></td><td>The system clock -- compare against the 3D hands and the "Live" toggle below</td></tr>
              <tr><td>Clock live</td><td className="num">{t.clockLive ? 'running' : 'stopped'}</td><td>startLiveClock() ticks once a second and resyncs on tab visibility (see wall-clock.js)</td></tr>
            </tbody>
          </table>
          <div className="legend">
            <b>Copy JSON</b> copies the furniture[] entry this preset implies, ready to paste into a house profile and adjust placement for.
          </div>
          <pre className="json">{furnitureJSON(t)}</pre>
        </div>

        <div className="card full">
          <h2>3D — wall clock</h2>
          {!clockReady && <div className="legend">Loading src/furniture/wall-clock.js…</div>}
          {clockReady &&
            <ThreeView
              t={t}
              buildModel={buildClockScene}
              animate={animateClockScene}
              heightOf={() => 1.15 + (t.clockDiameter / 100) / 2}
            />}
          <div className="legend">Drag to orbit, scroll to zoom. The clock's second hand is live (real time) while "Clock live" is on -- compare it against "Current local time" above.</div>
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Wall clock" />
        <TweakSlider label="Diameter" value={t.clockDiameter} min={20} max={45} step={1} unit="cm"
          onChange={v => setTweak('clockDiameter', v)} />
        <TweakSlider label="Depth" value={t.clockDepth} min={2} max={8} step={0.5} unit="cm"
          onChange={v => setTweak('clockDepth', v)} />
        {t.clockKind !== 'diy-words' &&
          <TweakColor label="Face colour" value={t.clockFaceColor}
            onChange={v => setTweak('clockFaceColor', v)} />}
        {t.clockKind !== 'diy-words' &&
          <TweakColor label="Rim colour" value={t.clockRimColor}
            onChange={v => setTweak('clockRimColor', v)} />}
        <TweakColor label="Numeral/dot colour" value={t.clockNumeralColor}
          onChange={v => setTweak('clockNumeralColor', v)} />
        <TweakColor label="Hand colour" value={t.clockHandColor}
          onChange={v => setTweak('clockHandColor', v)} />
        {t.clockKind === 'diy-words' &&
          <TweakColor label="Second hand colour" value={t.clockSecondHandColor}
            onChange={v => setTweak('clockSecondHandColor', v)} />}
        <TweakToggle label="Live (real time)" value={t.clockLive}
          onChange={v => setTweak('clockLive', v)} />
      </TweaksPanel>
    </SpecPage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Standalone viewing (opened directly at a /w URL, no design-tool host):
// the shared TweaksPanel stays closed until it receives __activate_edit_mode.
// Self-post it so the panel is visible when there's no host driving it.
setTimeout(() => window.postMessage({ type: '__activate_edit_mode' }, '*'), 0);
</script>
</body>
</html>
