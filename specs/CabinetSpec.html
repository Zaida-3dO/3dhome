// Bathroom mirror cabinets: mirror fronts, no plinth, no handles (moved here
// from BathroomFittingsSpec, 2026-09-27 -- a mirror cabinet is a `cabinet`, so
// it is signed off with the other cabinets; same params as it had there).
function mirrorCabinetParams(w, h, d, doors) {
  const cells = [];
  for (let i = 0; i < doors; i++) cells.push({ kind: 'mirror', width: +(w / doors).toFixed(3) });
  return { width: w, height: h, depth: d, plinth: { type: 'plinth', height: 0 }, handles: false,
    color: '#f4f1ea', topColor: '#f4f1ea', fronts: [{ height: h, cells }] };
}
PRESETS.mirrorCabinet3Door = { label: 'Mirror cabinet, 3 doors', params: mirrorCabinetParams(120, 70, 18, 3) };
PRESETS.mirrorCabinet2Door = { label: 'Mirror cabinet, 2 doors', params: mirrorCabinetParams(80, 70, 16, 2) };

// OBJECT -> its VARIANTS (preset keys above), in picker order.
const CABINET_OBJECTS = {
  'wardrobe':         ['mirroredWardrobe2Door', 'slidingWardrobe4Panel'],
  'display-cabinet':  ['tallDisplayCabinet', 'tallDisplayCabinetMirror'],
  'tv-console':       ['tvConsole'],
  'chest-of-drawers': ['chestOfDrawers'],
  'bedside-table':    ['bedsideTableLedNarrow', 'bedsideTableLedWide'],
  'mobile-pedestal':  ['mobilePedestal'],
  'open-shelving':    ['openShelving2Columns'],
  'mirror-cabinet':   ['mirrorCabinet3Door', 'mirrorCabinet2Door'],
};
const cabinetObjectOf = presetKey =>
  Object.keys(CABINET_OBJECTS).find(o => CABINET_OBJECTS[o].includes(presetKey));

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "preset": "mirroredWardrobe2Door"
}/*EDITMODE-END*/;

// ============== Cabinet model (buildModel) ==============
// cabinet.js (a plain ESM module - same file the Node tests and, later, the
// live renderer import; THREE is injected, never imported by it) is loaded
// by the real `type="module"` script above, NOT here: Babel's browser
// transform rewrites a dynamic import() into a require() call, which does
// not exist in a browser, so window.cabinetModuleReady / window.CabinetFurniture
// are what this Babel-transpiled script reads instead.
function buildCabinet(params, levels) {
  return (t, group, THREE, ctx) => {
    if (!window.CabinetFurniture) return; // not loaded yet; App doesn't render until it is
    const channels = channelRows(params);
    // Each level is built FOLLOWING a light (`channel.light`) and posed from
    // its preview state with the same light-parts.js the house uses: on, its
    // strip in its colour and the drawer below washed by brightness; off,
    // just the recess.
    const built = window.CabinetFurniture.build(THREE,
      channels.length ? withLevelLights(params) : params, { detail: 'full' });
    if (channels.length) {
      built.traverse(o => {
        if (!o.isMesh || !window.LightParts.isLightPart(o)) return;
        const i = Number(o.userData.lightChannel.replace('level', ''));
        const st = levelState(levels, i);
        window.LightParts.applyLightPart(o, { on: st.on, bri: st.brightness,
          color: params.fronts[channels[i]].channel.color || '#dbe8ff' });
      });
    }
    group.add(built);
    ctx.built = built;
    if (channels.length) addLevelPreview(THREE, group, params, levels);
  };
}

// ============== Light-channel preview (PAGE-ONLY) ==============
// The LED bedside tables have one light channel per drawer level (top first).
// In a house each level is a REAL light: a room light `strip` fixture on its
// own channel, bound to its own Home Assistant entity (docs/house-profile.md,
// "Bedside table LED strips"). This preview shows the same thing here: a real
// point light per level on its strip's front (channelStripBoxes().lightAt,
// where the house fixture puts it), in the level's colour, with the house's
// intensity and reach, and a floor and a wall behind the table to see what
// it lights.
const PREVIEW_MAX_INTENSITY = 0.3;   // the house's accent intensity at 100%
const PREVIEW_REACH_M = 0.9;         // the reach the house fixture is given (reachCm 90)
const levelName = (i, n) => (n === 2 ? ['top', 'bottom'][i] : 'level ' + (i + 1));

/** Indices (into params.fronts, top first) of the light channel rows. */
function channelRows(params) {
  return (params.fronts || []).map((r, i) => (r && r.channel ? i : -1)).filter(i => i >= 0);
}

/** A level's preview state (on, brightness 0-100), defaulting to on at 70%. */
function levelState(levels, i) {
  return Object.assign({ on: true, brightness: 70 }, levels[i] || {});
}

/** params with level i's channel following light 'level<i>'. */
function withLevelLights(params) {
  const out = JSON.parse(JSON.stringify(params));
  channelRows(out).forEach((ri, i) => { out.fronts[ri].channel.light = 'level' + i; });
  return out;
}


function addLevelPreview(THREE, group, params, levels) {
  const room = new THREE.MeshStandardMaterial({ color: 0xcfc9bf, roughness: 0.9 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), room);
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(0, -0.001, 0.5);
  floor.receiveShadow = true;
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(3, 2.4), room);
  wall.position.set(0, 1.2, -0.01);
  wall.receiveShadow = true;
  group.add(floor, wall);
  const boxes = window.CabinetFurniture.channelStripBoxes(params);
  const rows = channelRows(params);
  rows.forEach((ri, i) => {
    const st = levelState(levels, i);
    if (!st.on) return;
    const colour = params.fronts[ri].channel.color || '#dbe8ff';
    const light = new THREE.PointLight(new THREE.Color(colour),
      (st.brightness / 100) * PREVIEW_MAX_INTENSITY, PREVIEW_REACH_M, 2);
    const at = boxes[i].lightAt;
    light.position.set(at[0] / 100, at[1] / 100, at[2] / 100);
    light.name = 'levelPreviewLight:' + levelName(i, rows.length);
    group.add(light);
  });
}

function heightOfParams(params) {
  return () => (params.height || 200) * 0.01;
}

// ============== App ==============
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const presetKey = PRESETS[t.preset] ? t.preset : 'mirroredWardrobe2Door';
  const preset = PRESETS[presetKey];

  // Editable fronts-grid JSON, seeded from the selected preset and reset
  // whenever the preset changes (but NOT on every keystroke - it's a
  // separate piece of state the user is actively editing).
  const [paramsJson, setParamsJson] = React.useState(() => JSON.stringify(preset.params, null, 2));
  const [jsonError, setJsonError] = React.useState('');
  const lastPresetRef = React.useRef(presetKey);
  React.useEffect(() => {
    if (lastPresetRef.current !== presetKey) {
      lastPresetRef.current = presetKey;
      setParamsJson(JSON.stringify(PRESETS[presetKey].params, null, 2));
      setJsonError('');
    }
  }, [presetKey]);

  // Parsed params actually fed to the builder. Falls back to the preset's
  // last-known-good params if the edited JSON doesn't parse or doesn't build,
  // so a mid-edit typo never blanks the 3D view. Real STATE (not a ref) -
  // the Numbers table and the 3D view both read this at render time, and a
  // ref mutation alone does not trigger the re-render either of them needs.
  const [params, setParams] = React.useState(preset.params);
  const [copyStatus, setCopyStatus] = React.useState('');
  // Per-level light preview (page-only): [{ on, brightness }], top level first.
  const [levels, setLevels] = React.useState([]);
  const setLevel = (i, patch) => setLevels(prev => {
    const next = prev.slice();
    next[i] = Object.assign(levelState(prev, i), patch);
    return next;
  });
  // A level's colour IS its channel's `color` param, so it edits the JSON.
  const setLevelColour = (i, colour) => {
    try {
      const parsed = JSON.parse(paramsJson);
      const ri = channelRows(parsed)[i];
      if (ri == null) return;
      parsed.fronts[ri].channel.color = colour;
      setParamsJson(JSON.stringify(parsed, null, 2));
    } catch (e) { /* mid-edit JSON: leave it alone */ }
  };
  // The 3D view rebuilds when `t` changes identity: the params or a level.
  const viewT = React.useMemo(() => ({ params, levels }), [params, levels]);
  React.useEffect(() => {
    try {
      const parsed = JSON.parse(paramsJson);
      // Cheap validation: build once off-screen via the real builder so a
      // fronts grid that doesn't fill the width surfaces here, not silently
      // in the 3D view.
      window.CabinetFurniture.build(THREE, parsed, { detail: 'low' });
      setParams(parsed);
      setJsonError('');
    } catch (e) {
      setJsonError(e.message);
      // keep the last good `params`
    }
  }, [paramsJson]);

  const copyJson = () => {
    const furnitureJson = {
      type: 'cabinet',
      params: params
    };
    const text = JSON.stringify(furnitureJson, null, 2);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => setCopyStatus('Copied!'),
        () => setCopyStatus('Copy failed — select the JSON manually.')
      );
    } else {
      setCopyStatus('Clipboard unavailable — select the JSON manually.');
    }
    setTimeout(() => setCopyStatus(''), 2000);
  };

  const p = params;
  const levelRows = channelRows(p);

  // Picking a variant always re-seeds the editor, even when it is the preset
  // already selected (i.e. "reset my edits back to this variant").
  const pickVariant = (k) => {
    setTweak('preset', k);
    lastPresetRef.current = k;
    setParamsJson(JSON.stringify(PRESETS[k].params, null, 2));
    setJsonError('');
  };
  const objectId = cabinetObjectOf(presetKey);
  const variants = CABINET_OBJECTS[objectId].map(k => ({ id: k, label: PRESETS[k].label, params: PRESETS[k].params }));

  return (
    <SpecPage objectId={objectId} onObject={id => pickVariant(CABINET_OBJECTS[id][0])}>
      <SpecVariants variants={variants} values={params} onSelect={pickVariant} />

      <div className="row" style={{ marginBottom: 16 }}>
        <button className="btn" onClick={copyJson}>Copy as furniture JSON</button>
        {copyStatus && <span className="legend" style={{ marginTop: 0 }}>{copyStatus}</span>}
      </div>

      <div className="grid">
        <div className="card">
          <h2>Edit — fronts grid (JSON)</h2>
          <textarea className="fronts-json" value={paramsJson}
            onChange={e => setParamsJson(e.target.value)} spellCheck={false} />
          <div className="err">{jsonError}</div>
        </div>

        <div className="card">
          <h2>Numbers</h2>
          <table>
            <tbody>
              <tr><th>Feature</th><th className="num">cm</th></tr>
              <tr><td>Width</td><td className="num">{p.width}</td></tr>
              <tr><td>Height</td><td className="num">{p.height}</td></tr>
              <tr><td>Depth</td><td className="num">{p.depth}</td></tr>
              <tr><td>Plinth / base</td><td className="num">{p.plinth ? `${p.plinth.type} · ${p.plinth.height}` : '—'}</td></tr>
              <tr><td>Finish</td><td className="num">{p.finish || (p.gloss ? 'gloss' : 'matte')}</td></tr>
              <tr><td>Shelf lights</td><td className="num">{p.shelfLights ? 'yes' : 'no'}</td></tr>
              <tr><td>Front rows</td><td className="num">{(p.fronts || []).length}</td></tr>
            </tbody>
          </table>
        </div>

        {levelRows.length > 0 && (
          <div className="card full" id="levelPreview">
            <h2>Light per level — preview</h2>
            {levelRows.map((ri, i) => {
              const st = levelState(levels, i);
              const name = levelName(i, levelRows.length);
              return (
                <div className="row" key={ri} data-level={name} style={{ alignItems: 'center' }}>
                  <span className="legend" style={{ marginTop: 0, minWidth: 60 }}>{name}</span>
                  <button className={'btn' + (st.on ? ' active' : '')} onClick={() => setLevel(i, { on: !st.on })}>
                    {st.on ? 'Light: on' : 'Light: off'}
                  </button>
                  <label className="legend" style={{ marginTop: 0 }}>colour{' '}
                    <input type="color" value={p.fronts[ri].channel.color || '#dbe8ff'}
                      onChange={e => setLevelColour(i, e.target.value)} />
                  </label>
                  <label className="legend" style={{ marginTop: 0 }}>brightness{' '}
                    <input type="range" min="0" max="100" step="5" value={st.brightness}
                      onChange={e => setLevel(i, { brightness: Number(e.target.value) })} />
                    {' ' + st.brightness + '%'}
                  </label>
                </div>
              );
            })}
            <div className="legend">
              Each drawer level's strip is a real light: a point light on the strip's front in its colour, and
              the drawer below is washed in that colour by brightness; off leaves just the recess. In a house
              each level is a room light <code>strip</code> fixture on its own channel, bound to its own Home
              Assistant light, and the table's channel names that channel with <code>light</code> so its strip
              and wash follow the same state (docs/house-profile.md, "Bedside table LED strips"). The levels
              get no sidebar row: the room's one Ambient row switches them.
            </div>
          </div>
        )}

        <div className="card full">
          <h2>3D — {preset.label}</h2>
          <ThreeView
            t={viewT}
            buildModel={buildCabinet(params, levels)}
            heightOf={heightOfParams(params)}
          />
        </div>
      </div>
    </SpecPage>
  );
}

// App reads window.CabinetFurniture synchronously on first render (the
// JSON-validation effect that seeds `params` state), so mounting is held
// until the module script's dynamic import resolves rather than racing it.
window.cabinetModuleReady.then(() => {
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});

// Standalone viewing (opened directly at a /w URL, no design-tool host):
// the shared TweaksPanel stays closed until it receives __activate_edit_mode.
// This page has no TweaksPanel controls of its own (the shared picker bar +
// the fronts-grid JSON editor serve that role), but the self-post is kept for
// consistency with the other spec pages in case a future control is added.
setTimeout(() => window.postMessage({ type: '__activate_edit_mode' }, '*'), 0);
</script>
</body>
</html>
