     Babel transpiles the text/babel blocks), so spec-three.jsx and
     tweaks-panel.jsx use it unchanged. -->
<script type="importmap">
{ "imports": { "three": "../vendor/three-r160/three.module.min.js" } }
</script>

<body>
<div id="root"></div>

<!-- Which objects this page holds (read by SpecPage in tweaks-panel.jsx and by
     scripts/test-spec-pages.mjs). A strip light is a light FIXTURE (a room
     light channel's emitter), not a furniture registry type. -->
<script type="application/json" id="spec-manifest">
{
  "title": "Strip lights",
  "description": "All units cm. A linear LED strip that reads as one smooth line of light: four techniques (A today's box + 1 point light, B N point lights in a frosted tube, C one RectAreaLight, D no light at all -- tube + glow card), compared in a playground room with real furniture, a ceiling light and the sun. One brightness and one colour drive every strip. The HUD and the Bench button measure what each costs.",
  "objects": [
    { "id": "strip-light", "label": "Strip light", "types": [] }
  ]
}
</script>

<!-- React/ReactDOM/Babel served LOCALLY (../vendor/) — no CDN: this app must work on a LAN with no internet. -->
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>

<script type="module">

<!-- Shared harness: tweaks-panel.jsx (tweaks machinery) + reusable ThreeView -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="spec-three.jsx"></script>

<script type="text/babel">
/* =====================================================================
   STRIP LIGHT SPEC  ·  a smooth, diffused line light

   ── DIMENSIONS ARE ILLUSTRATIVE ──────────────────────────────────────
   The playground room is a made-up 6 x 4.5 m living-kitchen, not any real
   home. Strip lengths span the range a house uses (10 cm to 340 cm).
   ─────────────────────────────────────────────────────────────────────

   The strip is built by src/strip-light.js (unit-tested by
   scripts/test-strip-light.mjs). This page is a harness around it:

   * CLOSE-UP (spec-three.jsx ThreeView, lit with the house's own rig and
     its time-of-day control -- src/render-rig.js):
     the four techniques side by side under four shelves, A B C D left to
     right.
   * PLAYGROUND (its own renderer, so it can emulate the house): floor,
     walls, ceiling, a window with the sun through it, a ceiling main light,
     and real furniture builders with strips where a house has them: under
     the kitchen wall cabinets, on top of them, the kitchen plinth, under the
     desk, a cove along the window wall, behind the TV, inside the TV
     console. "Strips" adds linear ceiling strips for stress tests.
   * LIGHTING MODE: "house" is the live scene's rig (ACES tone mapping at
     0.85, the hemisphere fill, NO environment map, the live finishes for
     metal/mirror) so colours read as they will in the house; "spec" is the
     spec pages' OLD rig (ambient + key + fill + an env cube), kept here
     for comparison only -- the playground only; the close-up views no
     longer have it.
   * TIER emulates the house's quality tiers: pixel ratio, shadows, and the
     strip caps (low: no strip lights at all, as the house drops ambient
     strips on low today; mid: B capped at MID_MAX_N lights per strip --
     1, the recommended mid setup: today's single light behind the mount).
   * The room and the strip mountings live in specs/strip-light-playground.js
     so scripts/test-strip-light.mjs can prove no strip is buried inside
     furniture.
   * HUD: frame time, draw calls, programs, lights by type, fragment uniform
     vectors (an upper-bound count, see uniformRows) vs the GPU's limit, and
     the first-show time of the last rebuild (shader compile + link + draw).
   * BENCH: renders frames back to back, each forced to finish with a 1-px
     readPixels, at a FIXED size (the house popup's 1178 x 704 CSS px at the
     tier's pixel ratio). That times the GPU work per frame without vsync or
     requestAnimationFrame, which Chromium throttles to ~1 fps on a hidden or
     occluded window -- a live rAF figure from such a window is not evidence.
     window.__stripBench(config) runs it from the console / a test driver.
   ===================================================================== */

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "technique": "C",
  "n": 1,
  "bri": 100,
  "colorMode": "white",
  "kelvin": 3000,
  "color": "#ff7a30",
  "power": 1,
  "mainLight": true,
  "sun": false,
  "lighting": "house",
  "tier": "native",
  "strips": 8,
  "closeup": true,
  "diameter": 1.6
}/*EDITMODE-END*/;

/** The ceiling main light: a merged room light standing for ~6 downlights at the house's 0.6 each. */
const MAIN_I = 3.6;
/** Mid tier: B builds at most this many lights per strip. */
const MID_MAX_N = 1;
/** The house's #3d popup (~92vw x 88vh on a 1280 x 800 CSS tablet screen). */
const BENCH_CSS = [1178, 704];

const TIERS = {
  native: { label: 'native (this PC)', dpr: () => Math.min(window.devicePixelRatio || 1, 2), sunShadow: true, mainShadow: true, stripLights: true, maxN: Infinity },
  ultra:  { label: 'ultra', dpr: () => 2, sunShadow: true, mainShadow: true, stripLights: true, maxN: Infinity },
  mid:    { label: 'mid', dpr: () => 1.5, sunShadow: true, mainShadow: false, stripLights: true, maxN: MID_MAX_N },
  low:    { label: 'low', dpr: () => 1, sunShadow: false, mainShadow: false, stripLights: false, maxN: 0 },
};

function stripColour(t) {
  const S = window.StripLight;
  return t.colorMode === 'white' ? '#' + S.kelvinToHex(t.kelvin).toString(16).padStart(6, '0') : t.color;
}

// ====================================================================
// Room + furniture
// ====================================================================
const PG = window.StripPlayground;
const ROOM = PG.ROOM;
const MAX_STRIPS = PG.stripSlots().length;

// ====================================================================
// Measurement helpers
// ====================================================================
const p = (arr, q) => { if (!arr.length) return NaN; const s = arr.slice().sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(q * s.length))]; };

/**
 * Fragment uniform vectors a program uses -- an UPPER BOUND: every active
 * uniform the fragment shader declares, one row per float/int/bool/vec,
 * 2/3/4 per mat2/3/4, times its array size; samplers not counted. A driver
 * that packs struct members (a vec3 + a float in one row) uses fewer. The
 * same proxy the house's perf audit used.
 */
function uniformRows(gl, program) {
  const shaders = gl.getAttachedShaders(program) || [];
  const fs = shaders.find(s => gl.getShaderParameter(s, gl.SHADER_TYPE) === gl.FRAGMENT_SHADER);
  const src = fs ? gl.getShaderSource(fs) : '';
  const n = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  const rowsOf = {
    [gl.FLOAT_MAT2]: 2, [gl.FLOAT_MAT3]: 3, [gl.FLOAT_MAT4]: 4,
    [gl.SAMPLER_2D]: 0, [gl.SAMPLER_CUBE]: 0, [gl.SAMPLER_3D]: 0, [gl.SAMPLER_2D_SHADOW]: 0, [gl.SAMPLER_2D_ARRAY]: 0,
  };
  let rows = 0;
  const declared = {};
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(program, i);
    if (!info) continue;
    const base = info.name.split(/[\[.]/)[0];
    if (declared[base] === undefined) declared[base] = new RegExp('uniform\\s+[\\w\\s]*\\b' + base + '\\b').test(src);
    if (!declared[base]) continue;
    const r = rowsOf[info.type] !== undefined ? rowsOf[info.type] : 1;
    rows += r * info.size;
  }
  return rows;
}

// ====================================================================
// Playground view (own renderer: tiers, pixel ratio, HUD, bench)
// ====================================================================
function PlaygroundView({ t }) {
  const canvasRef = React.useRef(null);
  const hudRef = React.useRef(null);
  const S = React.useRef({}).current;

  // ---- init once ------------------------------------------------------
  React.useEffect(() => {
    const canvas = canvasRef.current;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    const gl = renderer.getContext();
    renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    // As the house does: shadow maps re-render only when something changes
    // (needsUpdate below), not every frame.
    renderer.shadowMap.autoUpdate = false;
    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(50, canvas.clientWidth / canvas.clientHeight, 0.05, 60);
    const target = new THREE.Vector3(-0.3, 1.1, -0.6);
    const orb = { th: 0.18, ph: 1.36, r: 4.6 };
    const syncCam = () => {
      cam.position.set(target.x + orb.r * Math.sin(orb.ph) * Math.sin(orb.th), target.y + orb.r * Math.cos(orb.ph),
        target.z + orb.r * Math.sin(orb.ph) * Math.cos(orb.th));
      cam.lookAt(target);
    };
    syncCam();
    let drag = null;
    canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener('pointermove', e => {
      if (!drag) return;
      orb.th -= (e.clientX - drag.x) * 0.005;
      orb.ph = Math.max(0.1, Math.min(Math.PI - 0.1, orb.ph - (e.clientY - drag.y) * 0.005));
      drag = { x: e.clientX, y: e.clientY }; syncCam();
    });
    canvas.addEventListener('pointerup', e => { drag = null; canvas.releasePointerCapture(e.pointerId); });
    canvas.addEventListener('wheel', e => { e.preventDefault(); orb.r = Math.max(0.5, Math.min(12, orb.r + e.deltaY * 0.003)); syncCam(); }, { passive: false });

    const room = new THREE.Group(); scene.add(room);
    const built = PG.buildRoom(THREE, room, window.StripFurniture);
    // Remember each furniture material's palette params, for the live-finish swap.
    room.traverse(o => { if (o.isMesh && o.material && o.material.userData && o.material.userData.finish) {
      o.material.userData._spec = { roughness: o.material.roughness, metalness: o.material.metalness };
    } });

    // House rig: hemisphere fill + sun + ceiling main light.
    const hemi = new THREE.HemisphereLight(0xd9d9e6, 0xd9d9e6, 0.12);
    const sun = new THREE.DirectionalLight(0xffffff, 0);
    sun.position.set(-7.5, 4.8, 1.2); sun.target.position.set(0, 0, 0);
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 0.5, far: 20 });
    sun.shadow.bias = -0.0005;
    scene.add(sun, sun.target);
    const main = new THREE.PointLight(0xffe6c0, MAIN_I, 0, 2);
    main.position.set(0, ROOM.h - 0.08, 0.2);
    main.shadow.mapSize.set(512, 512); main.shadow.bias = -0.002;
    scene.add(main);
    const fixture = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.03, 24),
      new THREE.MeshStandardMaterial({ color: 0xfff8e0, emissive: 0xffe6c0, emissiveIntensity: 1.5 }));
    fixture.position.set(0, ROOM.h - 0.015, 0.2); scene.add(fixture);
    // Spec rig (added only in "spec" lighting mode): spec-three.jsx's lights + an env cube.
    const specRig = new THREE.Group();
    specRig.add(new THREE.AmbientLight(0xffffff, 0.45));
    const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(2, 4, 3); specRig.add(key);
    const fill = new THREE.DirectionalLight(0xb8c8ff, 0.3); fill.position.set(-2, 1, -2); specRig.add(fill);
    const cubeRT = new THREE.WebGLCubeRenderTarget(128, { generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter });
    const cubeCam = new THREE.CubeCamera(0.05, 30, cubeRT); cubeCam.position.set(0, 1.3, 0);

    const strips = new THREE.Group(); scene.add(strips);

    let timerExt = null;
    try { timerExt = gl.getExtension('EXT_disjoint_timer_query_webgl2'); } catch (e) { timerExt = null; }
    let gpuName = '';
    try { const dbg = gl.getExtension('WEBGL_debug_renderer_info'); gpuName = String(gl.getParameter(dbg ? dbg.UNMASKED_RENDERER_WEBGL : gl.RENDERER)); } catch (e) {}

    Object.assign(S, { renderer, gl, scene, cam, target, orb, syncCam, room, ceiling: built.ceiling, hemi, sun, main, fixture, specRig, cubeRT, cubeCam,
      strips, timerExt, gpuName, maxFragU: gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_VECTORS),
      frames: [], gpuFrames: [], queries: [], paused: false, firstShow: null, envFrames: 0, px: new Uint8Array(4) });
    window.__stripPlayground = S;

    const syncFrame = () => { renderer.render(scene, cam); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, S.px); };
    S.syncFrame = syncFrame;

    let raf, last = performance.now();
    const loop = () => {
      raf = requestAnimationFrame(loop);
      if (S.paused) return;
      const now = performance.now();
      S.frames.push(now - last); last = now;
      if (S.frames.length > 240) S.frames.shift();
      S.ceiling.visible = cam.position.y < ROOM.h;
      if (S.envFrames > 0) {
        S.envFrames--;
        const prev = scene.environment; scene.environment = null;
        cubeCam.update(renderer, scene); scene.environment = prev;
      }
      // GPU time via the timer query, where the browser exposes it.
      let q = null;
      if (timerExt && S.queries.length < 4) { q = gl.createQuery(); gl.beginQuery(timerExt.TIME_ELAPSED_EXT, q); }
      renderer.render(scene, cam);
      S.lastCalls = renderer.info.render.calls; S.lastTris = renderer.info.render.triangles;
      if (q) { gl.endQuery(timerExt.TIME_ELAPSED_EXT); S.queries.push(q); }
      while (S.queries.length && gl.getQueryParameter(S.queries[0], gl.QUERY_RESULT_AVAILABLE)) {
        const q0 = S.queries.shift();
        if (!gl.getParameter(timerExt.GPU_DISJOINT_EXT)) { S.gpuFrames.push(gl.getQueryParameter(q0, gl.QUERY_RESULT) / 1e6); if (S.gpuFrames.length > 240) S.gpuFrames.shift(); }
        gl.deleteQuery(q0);
      }
    };
    loop();

    const onResize = () => {
      if (S.benching) return;
      cam.aspect = canvas.clientWidth / canvas.clientHeight; cam.updateProjectionMatrix();
      renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
    };
    window.addEventListener('resize', onResize);

    const hudTimer = setInterval(() => updateHud(S, hudRef.current), 300);
    return () => {
      cancelAnimationFrame(raf); clearInterval(hudTimer); window.removeEventListener('resize', onResize);
      cubeRT.dispose(); renderer.dispose(); renderer.forceContextLoss();
    };
  }, []);

  // ---- structural rebuild: technique, N, count, tier, lighting ---------
  React.useEffect(() => {
    if (!S.renderer) return;
    const SL = window.StripLight;
    const tier = TIERS[t.tier] || TIERS.native;
    const { renderer, scene, strips } = S;
    S.tier = t.tier;
    renderer.setPixelRatio(tier.dpr());
    renderer.setSize(canvasRef.current.clientWidth, canvasRef.current.clientHeight, false);
    // lighting mode
    const house = t.lighting === 'house';
    renderer.toneMapping = house ? THREE.ACESFilmicToneMapping : THREE.NoToneMapping;
    renderer.toneMappingExposure = house ? 0.85 : 1;
    if (house) { scene.remove(S.specRig); scene.remove(S.cubeCam); scene.environment = null; scene.add(S.hemi); }
    else { scene.add(S.specRig); scene.add(S.cubeCam); scene.remove(S.hemi); scene.environment = S.cubeRT.texture; S.envFrames = 2; }
    scene.background = new THREE.Color(house ? 0x0f0f1a : 0x1a1a1c);
    // live finishes (house) vs palette finishes (spec), the house's own table
    const Fin = window.StripFurniture.finishes;
    S.room.traverse(o => {
      const m = o.isMesh && o.material; const f = m && m.userData && m.userData.finish;
      if (!f || !m.userData._spec) return;
      const pr = house ? Fin.liveFinishParams(f) : m.userData._spec;
      if (pr) { m.roughness = pr.roughness; m.metalness = pr.metalness; }
    });
    // shadows per tier
    renderer.shadowMap.enabled = tier.sunShadow || tier.mainShadow;
    S.sun.castShadow = tier.sunShadow; S.main.castShadow = tier.mainShadow;
    renderer.shadowMap.needsUpdate = true;
    scene.traverse(o => { if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { m.needsUpdate = true; }); } });

    // strips
    while (strips.children.length) {
      const c = strips.children[0]; strips.remove(c);
      SL.dispose(c);
    }
    const slots = PG.stripSlots().slice(0, Math.max(0, Math.min(MAX_STRIPS, t.strips)));
    const n = Math.max(1, Math.min(t.n, tier.maxN === Infinity ? t.n : tier.maxN));
    slots.forEach(s => {
      const g = SL.build(THREE, PG.slotParams(s, t.technique, n, t.diameter));
      if (!tier.stripLights) {
        // low tier: the house builds no strip lights at all; keep the glowing part only.
        const d = g.userData.stripLight;
        d.lights.forEach(l => l.parent.remove(l)); d.lights = [];
      }
      g.position.set(s.pos[0], s.pos[1], s.pos[2]); g.rotation.y = s.rotY;
      g.userData.slot = s.name;
      strips.add(g);
    });
    S.stripCount = slots.length; S.effectiveN = t.technique === 'B' ? n : null;
    applyState(S, t);
    // first show: compile + link + draw of the new configuration, forced to finish
    // compile() walks EVERY object, including ones outside the view, so no
    // material keeps a program built for the previous light set (they would
    // otherwise linger in renderer.info.programs until next drawn, and the
    // HUD's uniform count would read the stale, heavier program). The house
    // precompiles the same way.
    const t0 = performance.now();
    renderer.compile(scene, S.cam);
    S.syncFrame();
    S.firstShow = { ms: performance.now() - t0, programs: renderer.info.programs.length };
    S.frames.length = 0; S.gpuFrames.length = 0;
  }, [t.technique, t.n, t.strips, t.tier, t.lighting, t.diameter]);

  // ---- cheap state: brightness, colour, power, main light, sun ---------
  React.useEffect(() => { if (S.renderer) applyState(S, t); },
    [t.bri, t.colorMode, t.kelvin, t.color, t.power, t.mainLight, t.sun]);

  // views
  const setView = id => {
    const v = { room: [0.18, 1.36, 4.6, [-0.3, 1.1, -0.6]], kitchen: [0.05, 1.45, 2.2, [-1.7, 1.1, -1.8]],
      desk: [-0.1, 1.35, 2.0, [1.3, 0.9, -1.6]], tv: [-1.35, 1.45, 2.4, [2.6, 1.0, 0]], cove: [1.2, 1.6, 2.6, [-2.8, 1.9, 0]],
      top: [0.0, 0.05, 7.5, [0, 1, 0]] }[id];
    if (!v) return;
    S.orb.th = v[0]; S.orb.ph = v[1]; S.orb.r = v[2]; S.target.set(...v[3]); S.syncCam();
  };
  S.setView = setView;

  const [hudOpen, setHudOpen] = React.useState(() => !(window.matchMedia && window.matchMedia('(max-width: 760px)').matches));
  return (
    <div className="play-wrap">
      <canvas id="playground" ref={canvasRef}></canvas>
      <div className={hudOpen ? 'hud' : 'hud collapsed'} ref={hudRef}>measuring…</div>
      <div className="row">

}

/** Brightness, colour, power, main light and sun -- no rebuild, no recompile. */
function applyState(S, t) {
  const SL = window.StripLight;
  const col = stripColour(t);
  S.strips.children.forEach(g => {
    g.userData.stripLight.intensity = SL.DEFAULTS.intensity * t.power;
    SL.applyStripState(g, { on: t.bri > 0, bri: t.bri, color: col });
  });
  S.main.intensity = t.mainLight ? MAIN_I : 0;
  S.fixture.material.emissiveIntensity = t.mainLight ? 1.5 : 0.05;
  S.fixture.material.emissive.setHex(t.mainLight ? 0xffe6c0 : 0x222222);
  // Sun: the house's own daylight curve at 30 deg elevation; off = night.
  const Sun = window.StripSun;
  const c = Sun.daylightCurve(t.sun ? 30 : -20);
  S.sun.intensity = c.sunIntensity;
  S.sun.color.setRGB(c.sun[0], c.sun[1], c.sun[2]);
  S.hemi.intensity = c.fill;
  S.hemi.color.setRGB(c.sky[0], c.sky[1], c.sky[2]);
  S.hemi.groundColor.setRGB(c.bounce[0], c.bounce[1], c.bounce[2]);
  if (S.renderer && S.renderer.shadowMap.enabled) S.renderer.shadowMap.needsUpdate = true;
}

function lightCensus(scene) {
  const c = { point: 0, spot: 0, rectArea: 0, directional: 0, hemisphere: 0, ambient: 0, shadowed: 0 };
  scene.traverse(o => {
    if (!o.isLight) return;
    if (o.isPointLight) c.point++; else if (o.isSpotLight) c.spot++; else if (o.isRectAreaLight) c.rectArea++;
    else if (o.isDirectionalLight) c.directional++; else if (o.isHemisphereLight) c.hemisphere++; else if (o.isAmbientLight) c.ambient++;
    if (o.castShadow) c.shadowed++;
  });
  return c;
}

/**
 * The heaviest CURRENT program's uniform rows. three keeps every program a
 * material has ever used (materialProperties.programs, r151+) until the
 * material is disposed, so after a rebuild renderer.info.programs still
 * holds the previous light set's programs. A program is current when its
 * per-type light arrays match the scene's light census (or it has none --
 * an unlit program).
 */
function maxUniformRows(S, census) {
  const gl = S.gl;
  let max = 0;
  for (const prog of S.renderer.info.programs) {
    if (!prog.program) continue;
    const n = gl.getProgramParameter(prog.program, gl.ACTIVE_UNIFORMS);
    const seen = { pointLights: 0, spotLights: 0, rectAreaLights: 0 };
    for (let i = 0; i < n; i++) {
      const u = gl.getActiveUniform(prog.program, i);
      const m = u && /^(pointLights|spotLights|rectAreaLights)\[\d+\]\.color$/.exec(u.name);
      if (m) seen[m[1]]++;
    }
    const ok = (seen.pointLights === 0 || seen.pointLights === census.point) &&
      (seen.spotLights === 0 || seen.spotLights === census.spot) &&
      (seen.rectAreaLights === 0 || seen.rectAreaLights === census.rectArea);
    if (!ok) continue;
    max = Math.max(max, uniformRows(gl, prog.program));
  }
  return { rows: max, failed: currentProgramFailed(S) };
}

/**
 * Did a program the scene is drawing with RIGHT NOW fail to compile/link
 * (e.g. "FRAGMENT shader uniforms count exceeds MAX_FRAGMENT_UNIFORM_VECTORS")?
 * Such a material draws nothing. Asked of each visible mesh's current
 * program, not of every program three has ever cached, so the warning clears
 * as soon as a configuration that compiles is shown.
 */
function currentProgramFailed(S) {
  let failed = false;
  S.scene.traverse(o => {
    if (failed || !o.isMesh || !o.visible || !o.material) return;
    for (const m of (Array.isArray(o.material) ? o.material : [o.material])) {
      const prog = S.renderer.properties.get(m).currentProgram;
      if (prog && prog.diagnostics && prog.diagnostics.runnable === false) { failed = true; return; }
    }
  });
  return failed;
}

function updateHud(S, el) {
  if (!el || !S.renderer) return;
  const L = lightCensus(S.scene);
  const u = maxUniformRows(S, L);
  S.lastU = u; S.lastL = L;
  const fr = S.frames, gpu = S.gpuFrames;
  const throttled = fr.length > 5 && p(fr, 0.5) > 100;
  const lines = [
    'GPU  ' + (S.gpuName || '?') ,
    'tier ' + S.tier + '  dpr ' + S.renderer.getPixelRatio().toFixed(2) + '  ' + S.renderer.domElement.width + 'x' + S.renderer.domElement.height + ' px',
    'strips ' + S.stripCount + (S.effectiveN != null ? '  N ' + S.effectiveN : ''),
    'rAF frame  p50 ' + p(fr, 0.5).toFixed(1) + '  p95 ' + p(fr, 0.95).toFixed(1) + ' ms  (vsync-capped)',
    'GPU frame  ' + (S.timerExt ? (gpu.length ? 'p50 ' + p(gpu, 0.5).toFixed(2) + '  p95 ' + p(gpu, 0.95).toFixed(2) + ' ms' : 'waiting…') : 'n/a (no timer query) — use Bench'),
    'draw calls ' + S.lastCalls + '   tris ' + (S.lastTris || 0).toLocaleString() + '   programs ' + S.renderer.info.programs.length,
    'lights  point ' + L.point + '  spot ' + L.spot + '  rectArea ' + L.rectArea + '  dir ' + L.directional + '  hemi ' + L.hemisphere + '  amb ' + L.ambient + '  (shadowed ' + L.shadowed + ')',
    'frag uniforms ' + (u.failed ? 'over the limit (the lit program failed, so it reports none)' : u.rows) + ' / ' + S.maxFragU + '  (upper bound, heaviest program)' + (!u.failed && u.rows > 256 ? '  > 256 phone!' : ''),
    ...(u.failed ? ['!! A SHADER FAILED TO COMPILE (too many uniforms?) — lit surfaces are NOT drawn'] : []),
    'first show ' + (S.firstShow ? S.firstShow.ms.toFixed(0) + ' ms (compile + link + draw; ' + S.firstShow.programs + ' programs live)' : '—'),
  ];
  el.textContent = lines.join('\n');
  if (throttled) el.textContent += '\n!! rAF is throttled (window hidden/occluded?) — live numbers are NOT evidence';
}

/**
 * Bench one configuration. Sync render + 1-px readPixels per frame at the
 * house popup's size and the tier's pixel ratio. Returns the numbers.
 */
async function benchNow(S, frames, warm) {
  const { renderer, cam } = S;
  const dpr = (TIERS[S.tier] || TIERS.native).dpr();
  S.benching = true; S.paused = true;
  const oldAspect = cam.aspect;
  renderer.setPixelRatio(dpr);
  renderer.setSize(BENCH_CSS[0], BENCH_CSS[1], false);
  cam.aspect = BENCH_CSS[0] / BENCH_CSS[1]; cam.updateProjectionMatrix();
  for (let i = 0; i < warm; i++) S.syncFrame();
  const times = [];
  for (let i = 0; i < frames; i++) { const t0 = performance.now(); S.syncFrame(); times.push(performance.now() - t0); }
  const calls = renderer.info.render.calls;
  const out = {
    p50: +p(times, 0.5).toFixed(2), p95: +p(times, 0.95).toFixed(2), mean: +(times.reduce((a, b) => a + b, 0) / times.length).toFixed(2),
    px: renderer.domElement.width + 'x' + renderer.domElement.height, dpr, calls, programs: renderer.info.programs.length,
    lights: lightCensus(S.scene), uniformRows: maxUniformRows(S, lightCensus(S.scene)).rows, shaderFailed: maxUniformRows(S, lightCensus(S.scene)).failed, maxFragU: S.maxFragU,
    firstShowMs: S.firstShow ? +S.firstShow.ms.toFixed(0) : null, 
    strips: S.stripCount, n: S.effectiveN, gpu: S.gpuName,
  };
  const c = renderer.domElement;
  renderer.setSize(c.clientWidth, c.clientHeight, false);
  cam.aspect = oldAspect; cam.updateProjectionMatrix();
  S.benching = false; S.paused = false;
  return out;
}

const nextFrame = () => new Promise(r => setTimeout(r, 0));

// Close-up (spec-three.jsx ThreeView): A B C D side by side
// ====================================================================
/** What each close-up bay's previous build owns, freed on its next rebuild (ThreeView disposes geometry only). */
const closeupOwned = { A: [], B: [], C: [], D: [] };
/**
 * One close-up bay: a 1 m backboard, a 60 cm counter and a shelf with a 45 cm
 * strip under it, 4 cm in from its front; the counter 62 cm below the strip,
 * the backboard face 25 cm behind it. Each technique gets its OWN ThreeView
 * (its own scene), so no bay can light another and every light keeps the
 * house's full 2.5 m reach -- a fair side-by-side.
 */
function buildBay(tech, t, group, THREE) {
  const SL = window.StripLight;
  for (const o of closeupOwned[tech]) SL.dispose(o);
  closeupOwned[tech] = [];
  const C = PG.COLOURS;
  const own = m => { closeupOwned[tech].push(m); group.add(m); return m; };
  own(new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.0, 0.02), new THREE.MeshStandardMaterial({ color: C.wall, roughness: 0.9 }))).position.set(0, 0.5, -0.17);
  own(new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.03, 0.6), new THREE.MeshStandardMaterial({ color: C.worktop, roughness: 0.7 }))).position.set(0, 0.015, 0.14);
  own(new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 0.3), new THREE.MeshStandardMaterial({ color: 0xf2f0ea, roughness: 0.6 }))).position.set(0, 0.8, -0.01);
  // D's cards stay on the counter and the backboard: 45 + 2 x 27 = 99 cm wide;
  // the counter card reaches 25 cm behind the line (to the backboard) and 27 in front.
  const g = SL.build(THREE, { technique: tech, n: t.n, length: 45, facing: 'down', diameter: t.diameter,
    washDistance: 62, washSpread: 27, washBack: 25, washAlbedo: C.worktop, backWash: 25, backAlbedo: C.wall });
  g.userData.stripLight.intensity = SL.DEFAULTS.intensity * t.power;
  SL.applyStripState(g, { on: t.bri > 0, bri: t.bri, color: stripColour(t) });
  g.position.set(0, 0.65, 0.09);
  own(g);
}
const BAY_BUILDERS = { A: (t, g, T) => buildBay('A', t, g, T), B: (t, g, T) => buildBay('B', t, g, T),
  C: (t, g, T) => buildBay('C', t, g, T), D: (t, g, T) => buildBay('D', t, g, T) };

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Standalone viewing (opened directly at a /w URL, no design-tool host):
// the shared TweaksPanel stays closed until it receives __activate_edit_mode.
setTimeout(() => window.postMessage({ type: '__activate_edit_mode' }, '*'), 0);
</script>
</body>
</html>
