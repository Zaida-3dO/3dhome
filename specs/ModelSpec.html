<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Model Spec — a .glb from the house profile</title>
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { background:#f4f1ec; color:#1a1a1a; font-family:ui-monospace,'SF Mono',Menlo,monospace; padding:24px; }
  h1 { font-size:14px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; margin-bottom:4px; }
  .sub { font-size:11px; opacity:0.6; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
  .card { background:#fff; border:1px solid #d8d3c8; border-radius:6px; padding:20px; }
  .card h2 { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; opacity:0.7; margin-bottom:14px; }
  #c3d { width:100%; height:560px; display:block; background:#1a1a1c; border-radius:4px; }
  .legend { font-size:10px; line-height:1.6; margin-top:14px; opacity:0.75; }
  .row { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .btn { padding:6px 10px; font:inherit; font-size:10px; background:#1a1a1c; color:#fff; border:none; border-radius:4px; cursor:pointer; }
  .btn:hover { background:#333; }
  .full { grid-column:1 / -1; }
  .warn { font-size:11px; color:#8a2b12; background:#fbeee8; border:1px solid #e8c2b3; border-radius:4px; padding:8px 10px; margin-top:12px; }
  table { width:100%; border-collapse:collapse; font-size:11px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid #ece8e0; }
  th { font-weight:600; opacity:0.6; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  @media (max-width: 720px) { .grid { grid-template-columns:1fr; } body { padding:12px; } #c3d { height:380px; } }
</style>
<!-- The vendored GLTFLoader (loaded lazily by src/furniture/model.js) imports
     the bare specifier 'three'; the app page maps it in index.html, and this
     page maps it to the same vendored module. The builder itself never uses
     that instance: it converts the parse to plain arrays and builds with the
     THREE it is handed (the UMD build below, like every spec page). -->
<script type="importmap">
{ "imports": { "three": "../vendor/three-r160/three.module.min.js" } }
</script>
</head>
<body>
<div id="root"></div>

<!-- React/ReactDOM/Babel/three served LOCALLY (../vendor/) — no CDN: this app must work on a LAN with no internet. -->
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../vendor/babel.min.js"></script>
<script src="../vendor/three.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="spec-three.jsx"></script>

<script type="module">
  import * as M from '../src/furniture/model.js';
  window.FurnitureModel = M;
  window.dispatchEvent(new Event('furniture-model-ready'));
</script>

<script type="text/babel">
/* =====================================================================
   MODEL SPEC   ·   a piece of furniture drawn from a .glb in the profile

   `type: "model"` is the one furniture type that is LOADED, not built from
   numbers: a house points params.src at a .glb in its own profile (a real
   product model it may not redistribute), and src/furniture/model.js fits
   it into width x depth x height with palette materials.

   This page shows the public demo file, houses/demo/models/test-armchair.glb
   (generated by scripts/make-test-model.mjs, CC0): a vertex-coloured frame
   (joins the merged palette bucket) and a textured cushion (a kept draw).
   ===================================================================== */
const ASSET_BASE = '../houses/demo/';
const DEMO_SRC = 'models/test-armchair.glb';
const MISSING_SRC = 'models/missing.glb';

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "width": 80,
  "depth": 78,
  "height": 82,
  "fit": "stretch",
  "yaw": 0,
  "finish": "matte",
  "detail": "full",
  "missing": false
}/*EDITMODE-END*/;

function modelParams(t) {
  return {
    src: t.missing ? MISSING_SRC : DEMO_SRC,
    width: t.width, depth: t.depth, height: t.height,
    fit: t.fit, yaw: t.yaw, finish: t.finish
  };
}

function tryBuild(t) {
  const M = window.FurnitureModel;
  if (!M || !t._ready) return { group: null, error: null };
  try {
    const p = Object.assign({}, M.DEFAULTS, modelParams(t));
    return { group: M.build(THREE, p, { detail: t.detail, assetBase: ASSET_BASE }), error: null };
  } catch (e) {
    return { group: null, error: String(e && e.message ? e.message : e) };
  }
}

function buildScene(t, group) {
  const r = tryBuild(t);
  if (!r.group) return;
  // The builder's frame has the back at z = 0; centre it for the orbit camera.
  r.group.position.z = -t.depth * 0.01 / 2;
  group.add(r.group);
}

function triangles(g) {
  let n = 0;
  if (g) g.traverse(o => { if (o.isMesh) n += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  return n;
}

function diffFromDefaults(params) {
  const D = window.FurnitureModel.DEFAULTS, out = {};
  Object.keys(params).forEach(k => { if (params[k] !== D[k]) out[k] = params[k]; });
  return out;
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [ready, setReady] = React.useState(0);
  React.useEffect(() => {
    const go = () => {
      const M = window.FurnitureModel;
      M.prepare([
        { params: { src: DEMO_SRC }, assetBase: ASSET_BASE },
        { params: { src: MISSING_SRC }, assetBase: ASSET_BASE }
      ]).then(() => setReady(r => r + 1));
    };
    if (window.FurnitureModel) go(); else window.addEventListener('furniture-model-ready', go, { once: true });
  }, []);
  const tt = Object.assign({}, t, { _ready: ready });
  const built = tryBuild(tt);
  const full = tryBuild(Object.assign({}, tt, { detail: 'full', missing: false }));
  const low = tryBuild(Object.assign({}, tt, { detail: 'low', missing: false }));
  const [copied, setCopied] = React.useState(false);
  const copyAsJSON = () => {
    const json = JSON.stringify({ type: 'model', params: diffFromDefaults(modelParams(t)) }, null, 2);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).catch(() => {});
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };
  return (
    <>
      <h1>Model Spec</h1>
      <div className="sub">All units cm. A piece of furniture drawn from a .glb that lives in the house profile, fitted into width × depth × height. Demo file: a CC0 test armchair.</div>

      <div className="grid">
        <div className="card">
          <h2>Numbers</h2>
          <table>
            <tbody>
              <tr><th>Feature</th><th className="num">Value</th><th>Notes</th></tr>
              <tr><td>Width</td><td className="num">{t.width}</td><td><b>Variable</b> — the envelope</td></tr>
              <tr><td>Depth</td><td className="num">{t.depth}</td><td><b>Variable</b></td></tr>
              <tr><td>Height</td><td className="num">{t.height}</td><td><b>Variable</b></td></tr>
              <tr><td>Fit</td><td className="num">{t.fit}</td><td>stretch: bbox = envelope · contain: uniform</td></tr>
              <tr><td>Yaw</td><td className="num">{t.yaw}°</td><td>Turns the file's front to face +z</td></tr>
              <tr><td>Triangles (full / low)</td><td className="num">{triangles(full.group)} / {triangles(low.group)}</td><td>Refused over maxTriangles (5000)</td></tr>
            </tbody>
          </table>
          <div className="legend">
            The file's own materials are not used. The frame carries vertex colours, so in the house it joins the merged
            palette bucket (no extra draw). The cushion carries a texture, so it is one kept draw, shared by every item
            using the file. The file's <code>low</code> node is used on the low GPU tier.
          </div>
          {built.error && <div className="warn" id="model-error">Skipped: {built.error}</div>}
        </div>

        <div className="card">
          <h2>Use it</h2>
          <div className="legend">
            Put a decimated .glb in the house profile (keep full-size originals out of it: everything in the profile is
            served), then place a <code>model</code> item whose <code>params.src</code> is the file's profile-relative path.
            Make the file with <code>scripts/model-lod</code>: it drops hidden parts, bakes textures into vertex colours
            and simplifies to a triangle budget.
          </div>
          <div className="row">
            <button className="btn" onClick={copyAsJSON}>{copied ? 'Copied!' : 'Copy as furniture JSON'}</button>
          </div>
        </div>

        <div className="card full">
          <h2>3D</h2>
          <ThreeView t={tt} buildModel={buildScene} heightOf={x => x.height * 0.01} />
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Envelope" />
        <TweakSlider label="Width" value={t.width} min={30} max={200} step={1} unit="cm" onChange={v => setTweak('width', v)} />
        <TweakSlider label="Depth" value={t.depth} min={30} max={200} step={1} unit="cm" onChange={v => setTweak('depth', v)} />
        <TweakSlider label="Height" value={t.height} min={30} max={200} step={1} unit="cm" onChange={v => setTweak('height', v)} />
        <TweakRadio label="Fit" value={t.fit} options={['stretch', 'contain']} onChange={v => setTweak('fit', v)} />
        <TweakSlider label="Yaw" value={t.yaw} min={0} max={270} step={90} unit="°" onChange={v => setTweak('yaw', v)} />

        <TweakSection label="Look" />
        <TweakRadio label="Finish" value={t.finish} options={['matte', 'satin', 'gloss']} onChange={v => setTweak('finish', v)} />
        <TweakRadio label="Detail" value={t.detail} options={['full', 'low']} onChange={v => setTweak('detail', v)} />

        <TweakSection label="Failure" />
        <TweakToggle label="Missing file" value={t.missing} onChange={v => setTweak('missing', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
setTimeout(() => window.postMessage({ type: '__activate_edit_mode' }, '*'), 0);
</script>
</body>
</html>
