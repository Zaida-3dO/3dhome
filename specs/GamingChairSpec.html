<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaming chair — Spec</title>
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { background:#f4f1ec; color:#1a1a1a; font-family:ui-monospace,'SF Mono',Menlo,monospace; padding:24px; }
  h1 { font-size:14px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; margin-bottom:4px; }
  .sub { font-size:11px; opacity:0.6; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
  .card { background:#fff; border:1px solid #d8d3c8; border-radius:6px; padding:20px; }
  .card h2 { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; opacity:0.7; margin-bottom:14px; }
  svg { display:block; width:100%; height:auto; }
  #c3d { width:100%; height:560px; display:block; background:#1a1a1c; border-radius:4px; }
  .legend { font-size:10px; line-height:1.6; margin-top:14px; opacity:0.75; }
  .row { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .btn { padding:6px 10px; font:inherit; font-size:10px; background:#1a1a1c; color:#fff; border:none; border-radius:4px; cursor:pointer; }
  .btn:hover { background:#333; }
  .btn.active { background:#6b5d4a; }
  .full { grid-column:1 / -1; }
  table { width:100%; border-collapse:collapse; font-size:11px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid #ece8e0; }
  th { font-weight:600; opacity:0.6; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .sw { display:inline-block; width:11px; height:11px; border-radius:2px; vertical-align:middle; margin-right:5px; border:1px solid rgba(0,0,0,.2); }
  pre.json { font-size:10px; background:#f7f5f0; border:1px solid #ece8e0; border-radius:4px; padding:8px; margin-top:10px; white-space:pre-wrap; word-break:break-all; }
  @media (max-width: 760px) {
    body { padding:12px; }
    .grid { grid-template-columns:1fr; }
    #c3d { height:420px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Which objects this page holds (read by SpecPage in tweaks-panel.jsx and by
     scripts/test-spec-pages.mjs). One object; its colourways are VARIANTS. -->
<script type="application/json" id="spec-manifest">
{
  "title": "Gaming chair",
  "description": "All units cm. Racing-style gaming chair, size L. Colourway on the seat and the backrest front; black back, sides, armrests and base. Pick a colourway variant, or use the Tweaks panel.",
  "objects": [
    { "id": "gaming-chair", "label": "Gaming chair", "types": ["gaming-chair"] }
  ]
}
</script>

<!-- React/ReactDOM/Babel/three served LOCALLY (../vendor/) — no CDN: this app must work on a LAN with no internet. React is the production build; Babel is required because the .jsx below is transpiled in-browser at runtime. -->
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../vendor/babel.min.js"></script>
<script src="../vendor/three.js"></script>
<!-- The chair itself: a pure builder module (THREE injected), shared with the Node test. -->
<script type="module">
  import * as M from '../src/furniture/gaming-chair.js';
  window.FurnitureGamingChair = M;
  window.dispatchEvent(new Event('furniture-gaming-chair-ready'));
</script>
<!-- Shared harness: tweaks-panel.jsx (tweaks machinery) + reusable ThreeView -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="spec-three.jsx"></script>

<script type="text/babel">
/* =====================================================================
   GAMING CHAIR SPEC   ·   racing-style gaming chair, size L

   Default dimensions are published manufacturer figures for a typical
   size-L racing chair; see the Numbers table. This is a stand-alone
   piece of furniture, not a record of any room.

   The geometry lives in src/furniture/gaming-chair.js — a pure builder
   (THREE injected) so the Node test (scripts/test-gaming-chair.mjs) and
   this page build exactly the same chair. This page only supplies the
   tweaks and a side elevation. Flat colours only — no textures — so the
   live renderer can merge meshes by finish.

   COLOURWAYS are params: the presets only set primaryColor.
     colourway  seat cushion + bolsters, backrest front incl. wings
     black      backrest back + sides, armrests, lever, base, casters
     velour     neck pillow, with a white wordmark strip
   ===================================================================== */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "primaryColor": "#3fc9b8",
  "backColor": "#18181a",
  "frameColor": "#141416",
  "pillowColor": "#111113",
  "seatHeight": 47,
  "reclineDeg": 95,
  "armHeight": 24,
  "detail": "full"
}/*EDITMODE-END*/;

const CM = 0.01;

// params for the builder = tweaks minus the page-only keys
function paramsOf(t) {
  const { detail, ...p } = t;
  return p;
}

// ============== Side elevation SVG ==============
function SideElevation({ t }) {
  const M = window.FurnitureGamingChair;
  const D = M.DEFAULTS;
  const W = 460, H = 360, S = 2.1;             // px per cm
  const floorY = H - 30, axisX = 210;
  const X = cm => axisX + cm * S, Y = cm => floorY - cm * S;
  const seatH = t.seatHeight, depth = D.seatDepth, bh = D.backrestHeight;
  const rear = -depth / 2 + 3, front = depth / 2 + 3;
  const pivY = seatH - 8;
  const a = (t.reclineDeg - 90) * Math.PI / 180;
  const topX = rear - Math.sin(a) * bh, topY = pivY + Math.cos(a) * bh;
  const armY = seatH + t.armHeight;
  const baseR = D.baseDiameter / 2;
  return (
    <svg viewBox={`0 0 ${W} ${H}`}>
      <text x="12" y="20" fontSize="12" fill="#333">Side elevation — cm, facing right</text>
      <line x1="10" y1={floorY} x2={W - 10} y2={floorY} stroke="#a89c80" strokeWidth="2" />
      {/* base + casters */}
      <line x1={X(-baseR)} y1={Y(8)} x2={X(baseR)} y2={Y(8)} stroke="#222" strokeWidth="5" />
      <circle cx={X(-baseR + 3)} cy={Y(3.25)} r={3.25 * S} fill="#222" />
      <circle cx={X(baseR - 3)} cy={Y(3.25)} r={3.25 * S} fill="#222" />
      <line x1={X(0)} y1={Y(12)} x2={X(0)} y2={Y(seatH - 11)} stroke="#444" strokeWidth="6" />
      {/* seat */}
      <rect x={X(rear)} y={Y(seatH)} width={depth * S} height={9 * S} rx="6" fill={t.primaryColor} stroke="#333" />
      {/* backrest */}
      <line x1={X(rear)} y1={Y(pivY)} x2={X(topX)} y2={Y(topY)} stroke={t.primaryColor} strokeWidth="16" strokeLinecap="round" />
      <line x1={X(rear) - 7} y1={Y(pivY)} x2={X(topX) - 7} y2={Y(topY)} stroke={t.backColor} strokeWidth="5" strokeLinecap="round" />
      {/* armrest */}
      <line x1={X(-3)} y1={Y(seatH - 12)} x2={X(-3)} y2={Y(armY)} stroke="#222" strokeWidth="5" />
      <line x1={X(-13)} y1={Y(armY)} x2={X(14)} y2={Y(armY)} stroke="#222" strokeWidth="7" strokeLinecap="round" />
      {/* dimensions */}
      <line x1={X(front) + 26} y1={floorY} x2={X(front) + 26} y2={Y(seatH)} stroke="#999" />
      <text x={X(front) + 30} y={Y(seatH / 2)} fontSize="10" fill="#666">seat {seatH} cm</text>
      <text x={X(front) + 30} y={Y(armY) + 4} fontSize="10" fill="#666">arm +{t.armHeight}</text>
      <text x={X(topX) + 14} y={Y(topY) + 4} fontSize="10" fill="#666">recline {t.reclineDeg}°</text>
      <text x={X(-baseR)} y={floorY + 18} fontSize="10" fill="#666">base Ø {D.baseDiameter} cm</text>
    </svg>
  );
}

// ============== 3D ==============
function buildChairModel(t, group, THREE) {
  const M = window.FurnitureGamingChair;
  const chair = M.build(THREE, paramsOf(t), { detail: t.detail });
  // the builder's frame puts the chair's back at z=0; centre it on the view target
  const b = new THREE.Box3().setFromObject(chair);
  chair.position.z = -(b.min.z + b.max.z) / 2;
  group.add(chair);
  let tris = 0;
  chair.traverse(o => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  window.__chairTriangles = tris;
  const floor = new THREE.Mesh(new THREE.CircleGeometry(1.1, 32), new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 1 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  floor.name = 'floor';
  group.add(floor);
}

// ============== App ==============
function App() {
  const M = window.FurnitureGamingChair;
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [copied, setCopied] = React.useState('');
  const json = JSON.stringify(M.toFurnitureJSON(paramsOf(t)), null, 2);
  const presetId = Object.keys(M.PRESETS).find(k => M.PRESETS[k].primaryColor.toLowerCase() === t.primaryColor.toLowerCase());
  const copy = () => {
    const done = () => { setCopied('copied'); setTimeout(() => setCopied(''), 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(done, () => setCopied('copy failed — select the JSON below'));
    else setCopied('clipboard unavailable — select the JSON below');
  };
  const D = M.DEFAULTS, L = M.LIMITS;
  // Colourways are VARIANTS: the same chair, a different primaryColor.
  const variants = Object.entries(M.PRESETS).map(([id, p]) => ({ id, label: p.label, params: { primaryColor: p.primaryColor } }));
  return (
    <SpecPage>
      <SpecVariants variants={variants} values={t}
        onSelect={id => setTweak('primaryColor', M.PRESETS[id].primaryColor)} />

      <div className="grid">
        <div className="card">
          <h2>Side elevation</h2>
          <SideElevation t={t} />
          <div className="legend">
            <span className="sw" style={{ background: t.primaryColor }}></span>colourway — seat cushion, seat bolsters, backrest front incl. shoulder wings ·
            <span className="sw" style={{ background: t.backColor, marginLeft: 8 }}></span>backrest back + side panels
          </div>
        </div>

        <div className="card">
          <h2>Numbers</h2>
          <table>
            <tbody>
              <tr><th>Feature</th><th className="num">value</th><th>Source / range</th></tr>
              <tr><td>Seat height (cushion top)</td><td className="num">{t.seatHeight}</td><td><b>Adjustable</b> {L.seatHeight[0]}–{L.seatHeight[1]} (published)</td></tr>
              <tr><td>Recline</td><td className="num">{t.reclineDeg}°</td><td><b>Adjustable</b> {L.reclineDeg[0]}–{L.reclineDeg[1]}° (published)</td></tr>
              <tr><td>Arm pad above seat</td><td className="num">{t.armHeight}</td><td><b>Adjustable</b>, 13 cm travel (published); base height estimated</td></tr>
              <tr><td>Seat width × depth</td><td className="num">{D.seatWidth}×{D.seatDepth}</td><td>Published, width incl. bolsters</td></tr>
              <tr><td>Backrest height × shoulder width</td><td className="num">{D.backrestHeight}×{D.backrestWidth}</td><td>Published</td></tr>
              <tr><td>Wheelbase Ø</td><td className="num">{D.baseDiameter}</td><td>Published (21.13″), 5-star</td></tr>
              <tr><td>Casters</td><td className="num">Ø{D.casterDiameter}</td><td>65 mm PU twin-wheel ×5</td></tr>
              <tr><td>Arm pad</td><td className="num">27×10.5×3.5</td><td>Published pad size</td></tr>
              <tr><td>Colourway</td><td className="num"><span className="sw" style={{ background: t.primaryColor }}></span>{t.primaryColor}</td><td>{presetId ? M.PRESETS[presetId].label + ' preset' : 'custom'} — estimated from photos</td></tr>
              <tr><td>Triangles</td><td className="num">{window.__chairTriangles || '—'}</td><td>{t.detail} detail</td></tr>
            </tbody>
          </table>
          <div className="row">
            <button className="btn" id="copy-json" onClick={copy}>Copy as furniture JSON</button>
            {copied && <span className="legend" style={{ marginTop: 6 }}>{copied}</span>}
          </div>
          <pre className="json">{json}</pre>
        </div>

        <div className="card full">
          <h2>3D — gaming chair</h2>
          <ThreeView
            t={t}
            buildModel={buildChairModel}
            heightOf={() => 1.3}
          />
          <div className="legend">Drag <b>Recline</b> 90→155° to tip the backrest (pillow, logo and wings go with it; armrests stay). <b>Seat height</b> lengthens the gas lift only. <b>Detail: low</b> drops caster twin wheels, logo, wordmark strips and knobs for mobile.</div>
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Colourway" />
        <TweakColor label="Colour (seat + backrest front)" value={t.primaryColor}
          onChange={v => setTweak('primaryColor', v)} />
        <TweakColor label="Back + sides" value={t.backColor}
          onChange={v => setTweak('backColor', v)} />
        <TweakColor label="Frame (arms, base)" value={t.frameColor}
          onChange={v => setTweak('frameColor', v)} />
        <TweakColor label="Neck pillow" value={t.pillowColor}
          onChange={v => setTweak('pillowColor', v)} />

        <TweakSection label="Adjust" />
        <TweakSlider label="Recline" value={t.reclineDeg} min={L.reclineDeg[0]} max={L.reclineDeg[1]} step={1} unit="°"
          onChange={v => setTweak('reclineDeg', v)} />
        <TweakSlider label="Seat height" value={t.seatHeight} min={L.seatHeight[0]} max={L.seatHeight[1]} step={0.5} unit="cm"
          onChange={v => setTweak('seatHeight', v)} />
        <TweakSlider label="Arm height (above seat)" value={t.armHeight} min={L.armHeight[0]} max={L.armHeight[1]} step={1} unit="cm"
          onChange={v => setTweak('armHeight', v)} />

        <TweakSection label="Render" />
        <TweakRadio label="Detail" value={t.detail} options={['full', 'low']}
          onChange={v => setTweak('detail', v)} />
      </TweaksPanel>
    </SpecPage>
  );
}

// The builder module is an ES module script; wait for it if Babel got here first.
function mount() { ReactDOM.createRoot(document.getElementById('root')).render(<App />); }
if (window.FurnitureGamingChair) mount();
else window.addEventListener('furniture-gaming-chair-ready', mount, { once: true });

// Standalone viewing (opened directly at a /w URL, no design-tool host):
// the shared TweaksPanel stays closed until it receives __activate_edit_mode.
// Self-post it so the panel is visible when there's no host driving it.
setTimeout(() => window.postMessage({ type: '__activate_edit_mode' }, '*'), 0);
</script>
</body>
</html>
