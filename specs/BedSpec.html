<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beds &amp; Sofas — Spec</title>
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { background:#f4f1ec; color:#1a1a1a; font-family:ui-monospace,'SF Mono',Menlo,monospace; padding:24px; }
  h1 { font-size:14px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; margin-bottom:4px; }
  .sub { font-size:11px; opacity:0.6; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
  .card { background:#fff; border:1px solid #d8d3c8; border-radius:6px; padding:20px; }
  .card h2 { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; opacity:0.7; margin-bottom:14px; }
  svg { display:block; width:100%; height:auto; }
  #c3d { width:100%; height:560px; display:block; background:#1a1a1c; border-radius:4px; }
  .legend { font-size:10px; line-height:1.6; margin-top:14px; opacity:0.75; }
  .row { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .btn { padding:6px 10px; font:inherit; font-size:10px; background:#1a1a1c; color:#fff; border:none; border-radius:4px; cursor:pointer; }
  .btn:hover { background:#333; }
  .btn.active { background:#6b5d4a; }
  .full { grid-column:1 / -1; }
  table { width:100%; border-collapse:collapse; font-size:11px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid #ece8e0; }
  th { font-weight:600; opacity:0.6; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  pre.json { font-size:10px; background:#f7f5f0; border:1px solid #ece8e0; border-radius:4px; padding:8px; margin-top:10px; white-space:pre-wrap; word-break:break-all; }
  @media (max-width: 760px) {
    body { padding:12px; }
    .grid { grid-template-columns:1fr; }
    #c3d { height:420px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Which objects this page holds: read by SpecPage (tweaks-panel.jsx) for the
     title and the OBJECT row, and by scripts/test-spec-pages.mjs to check that
     every furniture registry type has exactly one spec page. -->
<script type="application/json" id="spec-manifest">
{
  "title": "Beds & Sofas",
  "description": "Upholstered soft furnishings: beds, ottomans and sofas. All units cm. Every object is drawn by the real furniture builder the house scene uses.",
  "objects": [
    { "id": "bed",     "label": "Bed", "types": ["bed"] },
    { "id": "ottoman", "label": "Ottoman", "types": ["ottoman"] },
    { "id": "sofa",    "label": "Sofa", "types": ["sofa"] }
  ]
}
</script>

<!-- React/ReactDOM/Babel/three served LOCALLY (../vendor/) — no CDN: this app must work on a LAN with no internet. React is the production build; Babel is required because the .jsx below is transpiled in-browser at runtime. -->
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../vendor/babel.min.js"></script>
<script src="../vendor/three.js"></script>
<!-- The bed itself lives in src/furniture/bed.js -- the SAME pure builder
     module the house scene will call once a bed is placed, following the
     furniture-system builder contract (ESM, THREE injected, TYPE/DEFAULTS/
     build, metres, back face at z=0, bottom at y=0). Loaded as a real ES
     module and stashed on window so the Babel-transpiled app below (which
     targets the global THREE from ../vendor/three.js, matching every other
     spec page) can call it. -->
<script type="module">
  import * as M from '../src/furniture/bed.js';
  window.FurnitureBed = M;
  window.dispatchEvent(new Event('furniture-bed-ready'));
</script>
<script type="module">
  import * as S from '../src/furniture/sofa.js';
  window.FurnitureSofa = S;
  window.dispatchEvent(new Event('furniture-sofa-ready'));
</script>
<!-- The ottoman's builder lives in digital-piano.js (TYPES.ottoman) -- a code
     home, not a family: the ottoman is upholstered seating, so its spec is
     here with the bed, not on the piano page. -->
<script type="module">
  import * as P from '../src/furniture/digital-piano.js';
  window.__digitalPianoModule = P;
  window.dispatchEvent(new Event('__digital_piano_module_ready'));
</script>
<!-- Shared harness: tweaks-panel.jsx (tweaks machinery) + reusable ThreeView -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="spec-three.jsx"></script>

<script type="text/babel">
// ---- object "sofa": moved verbatim from SofaSpec.html, wrapped in an IIFE so
// its top-level names (App, TWEAK_DEFAULTS, ...) cannot collide with the bed's.
// Edits: its mount lines and <h1> removed; its preset buttons became the
// shared <SpecVariants>.
(function () {
/* =====================================================================
   SOFA SPEC   ·   corner (L) sofa, or a straight sofa

   ── DIMENSIONS ARE ILLUSTRATIVE ──────────────────────────────────────
   Every dimension below is a DEFAULT (an ordinary retail corner sofa),
   not a survey. Measure your own sofa and drive the geometry from the
   Tweaks panel.
   ─────────────────────────────────────────────────────────────────────

   Look: soft fabric seat and back cushions on a contrasting plinth base; a
   low arm at the non-chaise end (a plinth-coloured box with a padded
   fabric top); a chaise running forward to the full depth, with no arm or
   back on its outer end. The back cushions run the full back length.
   `chaise` is named as seen from the FRONT (+x is the viewer's right).

   The geometry is NOT built here -- it lives in src/furniture/sofa.js,
   unit-tested by scripts/test-sofa.mjs. This page is a thin harness.
   ===================================================================== */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "width": 275,
  "depth": 197,
  "height": 88,
  "chaise": "right",
  "seatDepth": 97,
  "chaiseWidth": 105,
  "seatHeight": 44,
  "baseHeight": 24,
  "backDepth": 22,
  "armWidth": 20,
  "armHeight": 64,
  "cushions": 3,
  "upholsteryColor": "#1e1e20",
  "baseColor": "#ecebe7",
  "baseFinish": "satin",
  "detail": "full"
}/*EDITMODE-END*/;

// The sofa's VARIANTS (same controls, different values), picked from the
// shared picker bar. Each sets only the keys it names.
const PRESETS = {
  'L corner, chaise right': { width: 275, depth: 197, seatDepth: 97, chaise: 'right' },
  'L corner, chaise left': { width: 275, depth: 197, seatDepth: 97, chaise: 'left' },
  'Straight 3-seater': { width: 220, depth: 97, seatDepth: 97, chaise: 'none' }
};

// params for the builder = tweaks minus the page-only "detail" key
function paramsOf(t) {
  const { detail, ...p } = t;
  return p;
}

// See BedSpec.html: set during App's render so the FIRST build's count lands.
let reportTriangles = null;

function buildSofaModel(t, group, THREE) {
  const M = window.FurnitureSofa;
  const sofa = M.build(THREE, paramsOf(t), { detail: t.detail });
  const b = new THREE.Box3().setFromObject(sofa);
  sofa.position.z = -(b.min.z + b.max.z) / 2;
  group.add(sofa);
  let tris = 0;
  sofa.traverse(o => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  if (reportTriangles) reportTriangles(tris);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(2.4, 48), new THREE.MeshStandardMaterial({ color: 0x8a7a64, roughness: 1 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  floor.name = 'floor';
  group.add(floor);
}

// ============== App ==============
function App() {
  const M = window.FurnitureSofa;
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [copied, setCopied] = React.useState('');
  const [triangles, setTriangles] = React.useState(null);
  reportTriangles = setTriangles;
  const json = M ? JSON.stringify(M.toFurnitureJSON(paramsOf(t)), null, 2) : '';
  const copy = () => {
    const done = () => { setCopied('copied'); setTimeout(() => setCopied(''), 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(done, () => setCopied('copy failed — select the JSON below'));
    else setCopied('clipboard unavailable — select the JSON below');
  };
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const L = t.chaise !== 'none';
  return (
    <>
      <SpecVariants values={t}
        variants={Object.keys(PRESETS).map(n => ({ id: slug(n), label: n, params: PRESETS[n] }))}
        onSelect={id => setTweak(Object.assign({}, PRESETS[Object.keys(PRESETS).find(n => slug(n) === id)]))} />
      <div className="sub">All units cm. Corner (L) sofa with a chaise, or a straight sofa: fabric cushions on a plinth base, padded arm(s). Use the Tweaks panel to change size, layout and colours.</div>

      <div className="grid">
        <div className="card">
          <h2>Numbers</h2>
          <table>
            <tbody>
              <tr><th>Feature</th><th className="num">cm</th><th>Variability</th></tr>
              <tr><td>Width</td><td className="num">{t.width.toFixed(0)}</td><td><b>Variable</b> -- arm(s) + seats + chaise</td></tr>
              <tr><td>Depth</td><td className="num">{t.depth.toFixed(0)}</td><td><b>Variable</b> -- {L ? 'back to the chaise front' : 'straight: set it = seat depth'}</td></tr>
              <tr><td>Height (back top)</td><td className="num">{t.height.toFixed(0)}</td><td><b>Variable</b></td></tr>
              <tr><td>Chaise</td><td className="num">{t.chaise}</td><td>seen from the front</td></tr>
              <tr><td>Seat depth (main leg)</td><td className="num">{t.seatDepth.toFixed(0)}</td><td>{L ? <b>Variable</b> : 'unused: straight = depth'}</td></tr>
              <tr><td>Chaise width</td><td className="num">{t.chaiseWidth.toFixed(0)}</td><td>{L ? <b>Variable</b> : 'unused'}</td></tr>
              <tr><td>Seat height</td><td className="num">{t.seatHeight.toFixed(0)}</td><td><b>Variable</b></td></tr>
              <tr><td>Plinth height</td><td className="num">{t.baseHeight.toFixed(0)}</td><td><b>Variable</b></td></tr>
              <tr><td>Arm height / width</td><td className="num">{t.armHeight.toFixed(0)} / {t.armWidth.toFixed(0)}</td><td><b>Variable</b></td></tr>
              <tr><td>Triangles</td><td className="num">{triangles ?? '—'}</td><td>{t.detail} detail</td></tr>
            </tbody>
          </table>
          <div className="legend">
            Every part is clamped so any params build to exactly width x depth x height. Low detail draws every
            part as a plain box.
          </div>
        </div>

        <div className="card">
          <h2>Look</h2>
          <h2 style={{ marginTop: 18 }}>Look</h2>
          <div className="legend">
            Soft, rounded fabric seat and back cushions on a contrasting plinth base (roughly the lower half of
            the seat height). A low arm at the non-chaise end: a plinth-coloured box with a padded fabric top.
            The chaise runs forward to the full depth with no arm or back on its outer end; the back cushions
            run the full back length. A straight sofa has an arm at both ends.
          </div>
          <div className="row">
            <button className="btn" onClick={copy}>Copy as furniture JSON</button>
            {copied && <span className="legend" style={{ marginTop: 6 }}>{copied}</span>}
          </div>
          <pre className="json">{json}</pre>
        </div>

        <div className="card full">
          <h2>3D — sofa</h2>
          <ThreeView
            t={t}
            buildModel={buildSofaModel}
            heightOf={tt => tt.height * 0.006}
          />
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Layout" />
        <TweakRadio label="Chaise" value={t.chaise} options={['left', 'none', 'right']}
          onChange={v => setTweak('chaise', v)} />
        <TweakSlider label="Seat cushions" value={t.cushions} min={1} max={4} step={1} unit=""
          onChange={v => setTweak('cushions', v)} />

        <TweakSection label="Size" />
        <TweakSlider label="Width" value={t.width} min={120} max={360} step={1} unit="cm"
          onChange={v => setTweak('width', v)} />
        <TweakSlider label="Depth" value={t.depth} min={70} max={260} step={1} unit="cm"
          onChange={v => setTweak('depth', v)} />
        <TweakSlider label="Height (back top)" value={t.height} min={60} max={110} step={1} unit="cm"
          onChange={v => setTweak('height', v)} />
        <TweakSlider label="Seat depth (main leg)" value={t.seatDepth} min={60} max={130} step={1} unit="cm"
          onChange={v => setTweak('seatDepth', v)} />
        <TweakSlider label="Chaise width" value={t.chaiseWidth} min={60} max={160} step={1} unit="cm"
          onChange={v => setTweak('chaiseWidth', v)} />
        <TweakSlider label="Seat height" value={t.seatHeight} min={30} max={60} step={1} unit="cm"
          onChange={v => setTweak('seatHeight', v)} />
        <TweakSlider label="Plinth height" value={t.baseHeight} min={5} max={40} step={1} unit="cm"
          onChange={v => setTweak('baseHeight', v)} />
        <TweakSlider label="Back depth" value={t.backDepth} min={10} max={40} step={1} unit="cm"
          onChange={v => setTweak('backDepth', v)} />
        <TweakSlider label="Arm width" value={t.armWidth} min={8} max={40} step={1} unit="cm"
          onChange={v => setTweak('armWidth', v)} />
        <TweakSlider label="Arm height" value={t.armHeight} min={40} max={90} step={1} unit="cm"
          onChange={v => setTweak('armHeight', v)} />

        <TweakSection label="Colours" />
        <TweakColor label="Upholstery (fabric)" value={t.upholsteryColor}
          onChange={v => setTweak('upholsteryColor', v)} />
        <TweakColor label="Plinth base" value={t.baseColor}
          onChange={v => setTweak('baseColor', v)} />
        <TweakSelect label="Plinth finish" value={t.baseFinish} options={['matte', 'satin', 'gloss']}
          onChange={v => setTweak('baseFinish', v)} />

        <TweakSection label="Render" />
        <TweakRadio label="Detail" value={t.detail} options={['full', 'low']}
          onChange={v => setTweak('detail', v)} />
      </TweaksPanel>
    </>
  );
}

window.__specObjects = window.__specObjects || {};
window.__specObjects['sofa'] = App;
})();
</script>

<script type="text/babel">
/* =====================================================================
   BED SPEC   ·   soft upholstered bed, made up

   ── DIMENSIONS ARE ILLUSTRATIVE ──────────────────────────────────────
   Every dimension below is a DEFAULT, not a survey. This is a design
   reference for modelling a fixture, not a record of any particular
   building: measure your own bed and drive the geometry from the Tweaks
   panel.
   ─────────────────────────────────────────────────────────────────────

   Look: a pale blue-grey velvet headboard -- vertical padded channels set
   inside a padded border that rolls up both sides and across the top --
   and velvet side and foot rails with rounded tops, floating on a dark
   recessed plinth. A rounded, crowned mattress in a fitted sheet sits down
   inside the rails. Made up with a duvet draped over the sides and the foot
   to the rail tops, its top edge folded back, in a white cover with a
   leaf-and-flower print (drawn as geometry, not a texture); two sleeping
   pillows, two sage accent pillows propped against the headboard and an
   olive cushion. Default envelope ~161 x 220, headboard 120 tall (== the
   `height` param directly -- there is no separate headboardHeight).

   The geometry itself is NOT built here -- it lives in
   src/furniture/bed.js (build / TYPE / DEFAULTS), loaded above as a real
   ES module and unit-tested by scripts/test-bed.mjs. This page is a thin
   harness: tweaks in, THREE.Group out, via the same reusable ThreeView
   every other spec page uses.
   ===================================================================== */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "width": 161,
  "depth": 220,
  "height": 120,
  "baseHeight": 38,
  "mattressHeight": 24,
  "channelCount": 8,
  "channelDepth": 3.5,
  "headboardColor": "#9ba8b3",
  "baseColor": "#9ba8b3",
  "plinthColor": "#2b2b2d",
  "mattressColor": "#efe6d6",
  "pillowColor": "#f7f5f0",
  "accentPillowColor": "#c9d3b0",
  "cushionColor": "#5d6b45",
  "duvet": true,
  "duvetColor": "#f4f1ea",
  "beddingPreset": "botanical",
  "detail": "full"
}/*EDITMODE-END*/;

// params for the builder = tweaks minus the page-only "detail" key
function paramsOf(t) {
  const { detail, ...p } = t;
  return p;
}

// Set by App below, right after mount, to whatever forces a re-render --
// buildBedModel runs inside ThreeView's OWN useEffect (spec-three.jsx),
// which fires after App has already committed, so writing a plain
// window/module global here and reading it from App's JSX (as the first cut
// of this page did) is stale: nothing tells App to re-render once the count
// is known, so the Numbers table's Triangles cell keeps whatever it read at
// its own last render (initially "-", forever, on a page nobody tweaks).
// Calling this setter is what actually gets the number on screen.
let reportTriangles = null;

function buildBedModel(t, group, THREE) {
  const M = window.FurnitureBed;
  const bed = M.build(THREE, paramsOf(t), { detail: t.detail });
  // the builder's frame puts the bed's back at z=0; centre it on the view target
  const b = new THREE.Box3().setFromObject(bed);
  bed.position.z = -(b.min.z + b.max.z) / 2;
  group.add(bed);
  let tris = 0;
  bed.traverse(o => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  if (reportTriangles) reportTriangles(tris);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(1.6, 32), new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 1 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  floor.name = 'floor';
  group.add(floor);
}

// ============== Object: bed ==============
function BedObject() {
  const M = window.FurnitureBed;
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [copied, setCopied] = React.useState('');
  const [triangles, setTriangles] = React.useState(null);
  // Set DURING RENDER, not in a useEffect: ThreeView is a CHILD of App, and
  // React fires child effects before parent effects, so ThreeView's own
  // build-on-mount effect (which calls buildBedModel, which calls
  // reportTriangles) would otherwise run before an effect here ever got the
  // chance to set it -- silently dropping the very first triangle count
  // (the one that matters on a page nobody has tweaked yet) with nothing
  // left to trigger a second build. Setting the module-level binding inline
  // during render has no such ordering hazard.
  reportTriangles = setTriangles;
  const json = M ? JSON.stringify(M.toFurnitureJSON(paramsOf(t)), null, 2) : '';
  const copy = () => {
    const done = () => { setCopied('copied'); setTimeout(() => setCopied(''), 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(done, () => setCopied('copy failed — select the JSON below'));
    else setCopied('clipboard unavailable — select the JSON below');
  };
  return (
    <>
      <div className="sub">All units cm. A soft upholstered bed, made up: channelled velvet headboard in a padded border, velvet rails, a crowned mattress in a fitted sheet, a draped botanical-print duvet with its top folded back, pillows and a cushion. Use the Tweaks panel to change size, bedding and colours.</div>

      <div className="grid">
        <div className="card">
          <h2>Numbers</h2>
          <table>
            <tbody>
              <tr><th>Feature</th><th className="num">cm</th><th>Variability</th></tr>
              <tr><td>Width</td><td className="num">{t.width.toFixed(0)}</td><td><b>Variable</b></td></tr>
              <tr><td>Depth</td><td className="num">{t.depth.toFixed(0)}</td><td><b>Variable</b></td></tr>
              <tr><td>Height <span style={{opacity:0.6}}>(= headboard height)</span></td><td className="num">{t.height.toFixed(0)}</td><td><b>Variable</b> -- honoured directly, no separate headboardHeight</td></tr>
              <tr><td>Rail height</td><td className="num">{t.baseHeight.toFixed(0)}</td><td><b>Variable</b> -- the mattress sits down inside the rails</td></tr>
              <tr><td>Mattress height</td><td className="num">{t.mattressHeight.toFixed(0)}</td><td><b>Variable</b></td></tr>
              <tr><td>Channel count</td><td className="num">{t.channelCount.toFixed(0)}</td><td><b>Variable</b></td></tr>
              <tr><td>Channel depth</td><td className="num">{t.channelDepth.toFixed(1)}</td><td><b>Variable</b></td></tr>
              <tr><td>Triangles</td><td className="num">{triangles ?? '—'}</td><td>{t.detail} detail</td></tr>
            </tbody>
          </table>
          <div className="legend">
            The channels fill the headboard between the two side rolls of its padded border, butted together with
            deep creases (build() in src/furniture/bed.js). `height` IS the headboard height -- there is no separate
            headboardHeight param to drift out of sync with it. Low detail keeps the shape on coarser grids and drops
            the print, the accent pillows and the cushion.
          </div>
        </div>

        <div className="card">
          <h2>Look</h2>
          <div className="legend">
            Velvet rails with rounded tops run round the sides and the foot on a dark recessed plinth; the
            mattress (rounded edges, a crowned top, a fitted sheet) sits down inside them. The duvet covers the
            foot end, drapes down to the rail tops and is folded back at its top edge. Its print is a scatter of
            leaf sprigs and small flowers made of a few triangles each, laid on the cloth -- no image texture.
            Accent pillows are propped against the headboard, the sleeping pillows lie in front of them, and the
            cushion leans in the middle.
          </div>
          <div className="row">
            <button className="btn" onClick={() => setTweak('duvet', !t.duvet)}>{t.duvet ? 'Remove duvet' : 'Add duvet'}</button>
            <button className="btn" onClick={() => setTweak('beddingPreset', t.beddingPreset === 'plain' ? 'botanical' : 'plain')}>{t.beddingPreset === 'plain' ? 'Botanical print' : 'Plain cover'}</button>
            <button className="btn" onClick={copy}>Copy as furniture JSON</button>
            {copied && <span className="legend" style={{ marginTop: 6 }}>{copied}</span>}
          </div>
          <pre className="json">{json}</pre>
        </div>

        <div className="card full">
          <h2>3D — bed</h2>
          <ThreeView
            t={t}
            buildModel={buildBedModel}
            heightOf={tt => tt.height * 0.01}
          />
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Size" />
        <TweakSlider label="Width" value={t.width} min={90} max={200} step={1} unit="cm"
          onChange={v => setTweak('width', v)} />
        <TweakSlider label="Depth" value={t.depth} min={180} max={230} step={1} unit="cm"
          onChange={v => setTweak('depth', v)} />
        <TweakSlider label="Height (headboard)" value={t.height} min={80} max={160} step={1} unit="cm"
          onChange={v => setTweak('height', v)} />
        <TweakSlider label="Rail height" value={t.baseHeight} min={20} max={50} step={1} unit="cm"
          onChange={v => setTweak('baseHeight', v)} />
        <TweakSlider label="Mattress height" value={t.mattressHeight} min={15} max={35} step={1} unit="cm"
          onChange={v => setTweak('mattressHeight', v)} />

        <TweakSection label="Headboard channels" />
        <TweakSlider label="Channel count" value={t.channelCount} min={3} max={12} step={1} unit=""
          onChange={v => setTweak('channelCount', v)} />
        <TweakSlider label="Channel depth" value={t.channelDepth} min={1} max={6} step={0.1} unit="cm"
          onChange={v => setTweak('channelDepth', v)} />

        <TweakSection label="Colours" />
        <TweakColor label="Headboard (velvet)" value={t.headboardColor}
          onChange={v => setTweak('headboardColor', v)} />
        <TweakColor label="Rails (velvet)" value={t.baseColor}
          onChange={v => setTweak('baseColor', v)} />
        <TweakColor label="Plinth" value={t.plinthColor}
          onChange={v => setTweak('plinthColor', v)} />
        <TweakColor label="Fitted sheet" value={t.mattressColor}
          onChange={v => setTweak('mattressColor', v)} />
        <TweakColor label="Pillows" value={t.pillowColor}
          onChange={v => setTweak('pillowColor', v)} />
        <TweakColor label="Accent pillows" value={t.accentPillowColor}
          onChange={v => setTweak('accentPillowColor', v)} />
        <TweakColor label="Cushion" value={t.cushionColor}
          onChange={v => setTweak('cushionColor', v)} />
        <TweakColor label="Duvet cover" value={t.duvetColor}
          onChange={v => setTweak('duvetColor', v)} />

        <TweakSection label="Bedding" />
        <TweakRadio label="Duvet cover" value={t.beddingPreset} options={['botanical', 'plain']}
          onChange={v => setTweak('beddingPreset', v)} />

        <TweakSection label="Render" />
        <TweakRadio label="Detail" value={t.detail} options={['full', 'low']}
          onChange={v => setTweak('detail', v)} />
      </TweaksPanel>
    </>
  );
}

// ============== Object: ottoman ==============
// Moved here from DigitalPianoSpec (2026-09-27): the same builder call, the same
// sliders and ranges, the same defaults -- only the page it lives on changed.
const OTTOMAN_DEFAULTS = /*EDITMODE-BEGIN*/{
  "ottomanWidth": 92,
  "ottomanDepth": 46,
  "ottomanHeight": 40,
  "channelCount": 5,
  "ottomanColor": "#2e6e6b",
  "legColor": "#3a2f28",
  "detail": "full"
}/*EDITMODE-END*/;

function ottomanParams(t) {
  return { width: t.ottomanWidth, depth: t.ottomanDepth, height: t.ottomanHeight,
    channelCount: t.channelCount, color: t.ottomanColor, legColor: t.legColor };
}

let reportOttomanTriangles = null;

function buildOttomanModel(t, group, THREE) {
  const impl = window.__digitalPianoModule.TYPES['ottoman'];
  const built = impl.build(THREE, Object.assign({}, impl.DEFAULTS, ottomanParams(t)), { detail: t.detail });
  // back at z=0 in the builder's frame; centre it on the view target
  const b = new THREE.Box3().setFromObject(built);
  built.position.z = -(b.min.z + b.max.z) / 2;
  group.add(built);
  let tris = 0;
  built.traverse(o => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  if (reportOttomanTriangles) reportOttomanTriangles(tris);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(1.2, 32), new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 1 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  floor.name = 'floor';
  group.add(floor);
}

function OttomanObject() {
  const impl = window.__digitalPianoModule.TYPES['ottoman'];
  const [t, setTweak] = useTweaks(OTTOMAN_DEFAULTS);
  const [triangles, setTriangles] = React.useState(null);
  reportOttomanTriangles = setTriangles; // set during render -- see BedObject's note
  const [copied, setCopied] = React.useState('');
  const p = ottomanParams(t);
  const diff = {}; Object.keys(p).forEach(k => { if (p[k] !== impl.DEFAULTS[k]) diff[k] = p[k]; });
  const json = JSON.stringify({ type: 'ottoman', params: diff }, null, 2);
  const copy = () => {
    const done = () => { setCopied('copied'); setTimeout(() => setCopied(''), 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(done, () => setCopied('copy failed — select the JSON below'));
    else setCopied('clipboard unavailable — select the JSON below');
  };
  return (
    <>
      <div className="sub">A teal velvet ottoman with a channel-tufted lid, on four short legs. Use the Tweaks panel to change size, channels and colours.</div>
      <div className="grid">
        <div className="card">
          <h2>Numbers</h2>
          <table>
            <tbody>
              <tr><th>Feature</th><th className="num">cm</th><th>Variability</th></tr>
              <tr><td>Width</td><td className="num">{t.ottomanWidth.toFixed(0)}</td><td><b>Variable</b></td></tr>
              <tr><td>Depth</td><td className="num">{t.ottomanDepth.toFixed(0)}</td><td><b>Variable</b></td></tr>
              <tr><td>Height</td><td className="num">{t.ottomanHeight.toFixed(0)}</td><td><b>Variable</b></td></tr>
              <tr><td>Channel count</td><td className="num">{t.channelCount.toFixed(0)}</td><td><b>Variable</b></td></tr>
              <tr><td>Triangles</td><td className="num">{triangles ?? '—'}</td><td>{t.detail} detail</td></tr>
            </tbody>
          </table>
        </div>
        <div className="card">
          <h2>Look</h2>
          <div className="legend">
            A velvet box with a channel-tufted lid, on four short legs. Built by src/furniture/digital-piano.js
            (TYPES.ottoman) -- the same builder the house scene calls for an `ottoman` item.
          </div>
          <div className="row">
            <button className="btn" onClick={copy}>Copy as furniture JSON</button>
            {copied && <span className="legend" style={{ marginTop: 6 }}>{copied}</span>}
          </div>
          <pre className="json">{json}</pre>
        </div>
        <div className="card full">
          <h2>3D — ottoman</h2>
          <ThreeView t={t} buildModel={buildOttomanModel} heightOf={tt => tt.ottomanHeight * 0.01} />
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Size" />
        <TweakSlider label="Width" value={t.ottomanWidth} min={60} max={130} step={1} unit="cm"
          onChange={v => setTweak('ottomanWidth', v)} />
        <TweakSlider label="Depth" value={t.ottomanDepth} min={30} max={65} step={1} unit="cm"
          onChange={v => setTweak('ottomanDepth', v)} />
        <TweakSlider label="Height" value={t.ottomanHeight} min={30} max={50} step={1} unit="cm"
          onChange={v => setTweak('ottomanHeight', v)} />
        <TweakSlider label="Channel count" value={t.channelCount} min={3} max={9} step={1} unit=""
          onChange={v => setTweak('channelCount', v)} />
        <TweakSection label="Colours" />
        <TweakColor label="Body (velvet)" value={t.ottomanColor}
          onChange={v => setTweak('ottomanColor', v)} />
        <TweakColor label="Legs" value={t.legColor}
          onChange={v => setTweak('legColor', v)} />
        <TweakSection label="Render" />
        <TweakRadio label="Detail" value={t.detail} options={['full', 'low']}
          onChange={v => setTweak('detail', v)} />
      </TweaksPanel>
    </>
  );
}

// ============== Page ==============
function App() {
  return <SpecPage render={{ bed: () => <BedObject />, ottoman: () => <OttomanObject />,
    sofa: () => React.createElement(window.__specObjects.sofa) }} />;
}

// Both builder modules are ES module scripts; wait for them if Babel got here first.
let mounted = false;
function mount() {
  if (mounted || !window.FurnitureBed || !window.__digitalPianoModule || !window.FurnitureSofa) return;
  mounted = true;
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}
window.addEventListener('furniture-bed-ready', mount);
window.addEventListener('__digital_piano_module_ready', mount);
window.addEventListener('furniture-sofa-ready', mount);
mount();

// Standalone viewing (opened directly at a /w URL, no design-tool host):
// the shared TweaksPanel stays closed until it receives __activate_edit_mode.
// Self-post it so the panel is visible when there's no host driving it.
setTimeout(() => window.postMessage({ type: '__activate_edit_mode' }, '*'), 0);
</script>
</body>
</html>
