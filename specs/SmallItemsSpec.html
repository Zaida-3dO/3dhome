<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Small items — Spec</title>
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { background:#f4f1ec; color:#1a1a1a; font-family:ui-monospace,'SF Mono',Menlo,monospace; padding:24px; }
  h1 { font-size:14px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; margin-bottom:4px; }
  .sub { font-size:11px; opacity:0.6; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
  .card { background:#fff; border:1px solid #d8d3c8; border-radius:6px; padding:20px; }
  .card h2 { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; opacity:0.7; margin-bottom:14px; }
  #c3d { width:100%; height:560px; display:block; background:#1a1a1c; border-radius:4px; }
  .legend { font-size:10px; line-height:1.6; margin-top:14px; opacity:0.75; }
  .row { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .btn { padding:6px 10px; font:inherit; font-size:10px; background:#1a1a1c; color:#fff; border:none; border-radius:4px; cursor:pointer; }
  .btn:hover { background:#333; }
  .btn.active { background:#6b5d4a; }
  .full { grid-column:1 / -1; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Which objects this page holds (read by SpecPage in tweaks-panel.jsx and by
     scripts/test-spec-pages.mjs). The two wall-light kinds are one registry
     type but different controls, so two OBJECTS; each object's presets are
     its VARIANTS. -->
<script type="application/json" id="spec-manifest">
{
  "title": "Small items",
  "description": "The small things across every room -- wall, surface and floor accessories that are not furniture: screens and tech, speakers, lights, wall art and signs, mirrors, shelves and a coat rack. Generic names and dimensions only; a private house's own params carry the real numbers. Pick an object and a variant; Copy JSON emits only the params that differ from the type's DEFAULTS.",
  "objects": [
    { "id": "tv",                   "label": "TV", "types": ["tv"] },
    { "id": "monitor",              "label": "Monitor", "types": ["monitor"] },
    { "id": "pc-tower",             "label": "PC tower", "types": ["pc-tower"] },
    { "id": "speaker",              "label": "Speaker", "types": ["speaker"] },
    { "id": "subwoofer",            "label": "Subwoofer", "types": ["subwoofer"] },
    { "id": "tube-floor-lamp",      "label": "Tube floor lamp", "types": ["tube-floor-lamp"] },
    { "id": "wall-light-swing-arm", "label": "Swing-arm wall light", "types": ["wall-sconce"] },
    { "id": "wall-light-up-down",   "label": "Up/down wall light", "types": ["wall-sconce"] },
    { "id": "photo-frame",          "label": "Photo frame", "types": ["photo-frame"] },
    { "id": "wall-sign",            "label": "Wall sign", "types": ["wall-sign"] },
    { "id": "mirror",               "label": "Mirror", "types": ["mirror"] },
    { "id": "shelf",                "label": "Shelf", "types": ["shelf"] },
    { "id": "coat-rack",            "label": "Coat rack", "types": ["coat-rack"] }
  ]
}
</script>

<!-- React/ReactDOM/Babel/three served LOCALLY (../vendor/) — no CDN: this app must work on a LAN with no internet. React is the production build; Babel is required because the .jsx below is transpiled in-browser at runtime. -->
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../vendor/babel.min.js"></script>
<script src="../vendor/three.js"></script>
<!-- Shared harness: tweaks-panel.jsx (tweaks machinery) + reusable ThreeView -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="spec-three.jsx"></script>
<!-- The multi-type furniture builder itself. THREE is injected by this page
     (window.THREE, published by ../vendor/three.js), never imported by the
     module -- the same contract the live scene and the Node tests use. -->
<script type="module">
  import * as SmallItems from '../src/furniture/small-items.js';
  // The photo-frame image preview's span maths (page-only, DOM-free).
  import * as PhotoSpan from '../src/photo-span.js';
  window.PhotoSpan = PhotoSpan;
  window.SmallItems = SmallItems;
  window.dispatchEvent(new Event('small-items-ready'));
</script>
<!-- The wall sign and the wall lights (moved here from WallDecorSpec): their
     builder modules, loaded as real ESM and handed to the Babel code below via
     a global once ready. -->
<script type="module">
  import * as WallSign from '../src/furniture/wall-sign.js';
  import * as WallSconce from '../src/furniture/wall-sconce.js';
  window.__wallDecorModules = { WallSign, WallSconce };
  window.dispatchEvent(new Event('wall-decor-modules-ready'));
</script>

<script type="text/babel">
// ---- the small-items.js objects (one component, one object per TYPE).
(function () {
/* =====================================================================
   SMALL ITEMS SPEC   ·  one page, one type picker, for every small
   wall/floor fitting src/furniture/small-items.js builds.

   Signed off here, in "as merged" mode where available
   (PR1c), before a type is placed in a real house. This page never carries
   real names, real images or real house measurements -- see
   docs/house-profile.md, "Furniture" / privacy. Every preset below is a
   GENERIC reference shape; a private house's furniture[].params carries
   the real numbers.
   ===================================================================== */

const TYPE_ORDER = [
  'tv', 'photo-frame', 'speaker', 'subwoofer', 'tube-floor-lamp',
  'coat-rack', 'mirror', 'shelf', 'monitor', 'pc-tower'
];

const TYPE_LABELS = {
  'tv': 'TV', 'photo-frame': 'Photo frame', 'speaker': 'Speaker',
  'subwoofer': 'Subwoofer', 'tube-floor-lamp': 'Tube floor lamp',
  'coat-rack': 'Coat rack', 'mirror': 'Mirror', 'shelf': 'Shelf',
  'monitor': 'Monitor', 'pc-tower': 'PC tower'
};

// Presets are DELTAS from DEFAULTS -- only the keys that differ. Every
// preset uses a GENERIC name and GENERIC numbers (some drawn from real-
// world reference dimensions, never a model or brand name).
// `height`/`depth` are the FULL assembly (the shared envelope contract):
// an add-on that grows the footprint below/behind the main body -- a TV's
// pedestal, a monitor's riser, a stacked shelf set, a coat rack's draped
// coats -- must be included in the preset's own height/depth, not layered
// on top of the type's plain DEFAULTS. See src/furniture/small-items.js's
// own per-type comments for exactly which params combine into the envelope.
const PRESETS = {
  'tv': {
    'Flat, thin bezel': {},
    // ENVELOPE: `stand` adds standHeight (10) below the panel and the
    // pedestal foot is standDepth (31.7) deep, both deeper than the plain
    // panel -- so height/depth here must include them, per the shared
    // envelope contract (src/furniture/small-items.js's own TV_DEFAULTS:
    // height 95.9 + standHeight 10 = 105.9; depth = standDepth 31.7).
    'Flat, on pedestal stand': { stand: true, height: 105.9, depth: 31.7 },
    'Picture-frame (art mode)': { bezelStyle: 'picture-frame' }
  },
  'photo-frame': {
    'Single panel': {},
    'Hallway pair (60x50)': { width: 60, height: 50 },
    'Living-room 4-photo': { width: 140, height: 40, panels: 4 },
    'Office 5-panel': { width: 250, height: 60, panels: 5 }
  },
  'speaker': {
    'Wall (trapezoid)': {},
    'Wall (box)': { boxShape: true },
    'Floor-standing': { kind: 'floor-standing', width: 16.5, depth: 24, height: 90 },
    'Floor-standing (white satin)': { kind: 'floor-standing', width: 16.5, depth: 24, height: 90, finish: 'gloss', color: '#f4f4f2' },
    'Ceiling (Atmos, down-firing)': { kind: 'ceiling', width: 18.5, depth: 18.5, height: 31, firing: 'down' },
    'Ceiling (Atmos, angled)': { kind: 'ceiling', width: 18.5, depth: 18.5, height: 31, firing: 'angled' },
    'Centre channel': { kind: 'centre', width: 45, depth: 20, height: 16.5 }
  },
  'subwoofer': {
    'Default': {}
  },
  'tube-floor-lamp': {
    'Default (all-round glow)': {},
    'One-sided glow': { oneSidedGlow: true }
  },
  'coat-rack': {
    'Empty rail': {},
    // ENVELOPE: the rail is a fixed 10cm band at the TOP of `height`; a
    // draped coat hangs from the rail down toward y=0, so `height` must
    // include the coat's own drop (coatHeight 55 + the 10cm rail band).
    'One coat': { coats: 1, height: 10 + 55 },
    'Three coats': { coats: 3, height: 10 + 55 }
  },
  'mirror': {
    'Rectangle': {},
    'Round': { shape: 'round' },
    'Pebble': { shape: 'pebble' },
    'Triangle (hallway)': { shape: 'triangle', width: 55, height: 70 }
  },
  'shelf': {
    'Single': {},
    'Single, LED edge': { led: true },
    // ENVELOPE: `height` is the FULL stack (3 slabs of shelfThickness=5 plus
    // 2 gaps of 30 each = 15 + 60 = 75), while shelfThickness stays the
    // per-slab thickness independently.
    'Stacked set of 3 (store)': { levels: [30, 30], height: 5 + 30 + 5 + 30 + 5 },
    'Floating shelf with back panel': { width: 180, depth: 22, height: 20, backPanel: true }
  },
  'monitor': {
    'Flat': {},
    // ENVELOPE: the riser (riserDepth 25) is deeper than the plain panel
    // (depth 8), so `depth` must be at least riserDepth for the riser to
    // render at its full requested depth rather than being clamped to fit.
    'Flat, on riser': { riser: true, depth: 25 },
    'Curved super-ultrawide': { curved: true },
    'Curved, on riser': { curved: true, riser: true, depth: 25 },
    // A 49in 32:9 super-ultrawide on a true 1000R arc (curveRadius 100),
    // from a maker's published set dimensions: 114.76 wide, 53.72 high and
    // 41.64 deep on its stand, 36.35 high and 29.1 deep without it, an
    // active area 119.19 x 33.52 (so a ~1.5 bezel). The foot is not
    // published; 37 x 30 is a measured approximation. Black bezel, white
    // gloss back and stand, and the round light ring on the back.
    'Curved 49in 32:9, 1000R, white': {
      curved: true, curveRadius: 100, width: 114.8, height: 53.7, depth: 41.6,
      panelHeight: 36.4, panelDepth: 29.1, bezel: 1.5, color: '#111111', coreLight: true
    },
    'Curved 49in 32:9, 1000R, white, dark stand': {
      curved: true, curveRadius: 100, width: 114.8, height: 53.7, depth: 41.6,
      panelHeight: 36.4, panelDepth: 29.1, bezel: 1.5, color: '#111111', coreLight: true,
      standColor: '#1c1c1e', standFinish: 'matte'
    }
  },
  'pc-tower': {
    'Glass side panel': {},
    'No glass panel': { glassPanel: false },
    'White, glass side panel': { color: '#f1f1ef', glassColor: '#e2ecef', interiorColor: '#e6e6e4' }
  }
};

// A variant's URL id: its name, lower-cased, runs of anything else as '-'.
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

function typeDefaults(type) {
  return window.SmallItems.TYPES[type].DEFAULTS;
}

function paramsFor(type, presetName) {
  const delta = (PRESETS[type] && PRESETS[type][presetName]) || {};
  return Object.assign({}, typeDefaults(type), delta);
}

/** Only the keys that differ from DEFAULTS -- what the placement JSON
 * should actually carry (anything omitted falls back to the builder's own
 * DEFAULTS, per the furniture contract). */
function diffFromDefaults(type, params) {
  const d = typeDefaults(type);
  const out = {};
  Object.keys(params).forEach(k => {
    if (JSON.stringify(params[k]) !== JSON.stringify(d[k])) out[k] = params[k];
  });
  return out;
}

function buildItem(t, group, THREE, ctx) {
  const impl = window.SmallItems.TYPES[t.type];
  if (!impl) return;
  // Tube floor lamp, light preview OFF: the tube is drawn unlit (matte).
  let params = t.lamp && !t.lamp.on ? Object.assign({}, t.params, { finish: 'matte' }) : t.params;
  // Photo frame, image preview ON: hand the builder the preview texture
  // through its own injection hook. Only this build-params copy carries it:
  // `t.params` (the params table, Copy JSON) never sees it.
  if (t.photo) params = Object.assign({}, params, { image: 'page-preview', textureLoader: () => t.photo.tex });
  const built = impl.build(THREE, params, { detail: t.detail || 'full' });
  group.add(built);
  disposePhotoSlices(ctx);
  if (t.photo) spanPhoto(THREE, built, t.photo, ctx);
  if (t.lamp) addLampPreview(THREE, group, t.params, t.lamp);
  ctx.builtType = t.type;
}

// ---- PAGE-ONLY photo-frame image preview ----------------------------------
// The owner picks an image (or the test pattern) and sees it in the frame;
// on a multi-panel frame ONE image spans every panel, cover-fitted to their
// combined area (src/photo-span.js, unit-tested by scripts/test-photo-span.mjs). The image is read with
// URL.createObjectURL and drawn from memory: it is never uploaded, never
// stored, and never part of Copy JSON. A house's own placements keep taking
// their pictures from the house's files.

// The rebuild before this one gave each picture panel its own material and
// texture clone (its slice of the image); free them.
function disposePhotoSlices(ctx) {
  (ctx.photoSlices || []).forEach(x => x.dispose());
  ctx.photoSlices = [];
}

function spanPhoto(THREE, built, photo, ctx) {
  const r = window.PhotoSpan.applyPhotoSpan(THREE, built, photo.tex, photo.aspect);
  ctx.photoSlices = r.disposables;
  ctx.photoPanels = r.panels;
}

/** A page-drawn test pattern: a numbered grid over a colour sweep, a circle
 * and a frame line -- so the span and the crop can be judged at a glance. */
function testPatternCanvas() {
  const c = document.createElement('canvas');
  c.width = 1600; c.height = 800;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, c.width, 0);
  ['#d94f4f', '#e3a23b', '#e8d84a', '#57b85a', '#3f8fd1', '#8a5cc7'].forEach((col, i, a) => grad.addColorStop(i / (a.length - 1), col));
  g.fillStyle = grad; g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 4;
  g.fillStyle = '#ffffff'; g.font = 'bold 56px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i = 0; i < 8; i++) for (let j = 0; j < 4; j++) {
    g.strokeRect(i * 200, j * 200, 200, 200);
    g.fillText(String(j * 8 + i + 1), i * 200 + 100, j * 200 + 100);
  }
  g.lineWidth = 14; g.strokeStyle = '#111111';
  g.beginPath(); g.arc(800, 400, 330, 0, Math.PI * 2); g.stroke();
  g.strokeRect(7, 7, c.width - 14, c.height - 14);
  return c;
}

// PAGE-ONLY light preview for the tube floor lamp: a real point light at the
// tube, in the tube's colour, and a floor and wall corner round the lamp to
// see what it lights. Nothing here is part of the builder or the house.
function addLampPreview(THREE, group, p, lamp) {
  const room = new THREE.MeshStandardMaterial({ color: 0xcfc9bf, roughness: 0.9 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), room);
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(0, -0.001, 0.5);
  floor.receiveShadow = true;
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(3, 2.4), room);
  wall.position.set(0, 1.2, -0.01);
  wall.receiveShadow = true;
  group.add(floor, wall);
  if (!lamp.on) return;
  // The brightness is spread over five lights along the tube, a little in
  // front of it, so the light falls as a soft band the tube's length rather
  // than a blown-out disc on the wall a few cm behind. A one-sided lamp
  // glows towards the room only, so its lights sit further forward and the
  // wall behind gets the spill, not the full glare.
  const baseH = Math.min(p.baseHeight, p.height * 0.5) / 100;
  const tubeH = p.height / 100 - baseH;
  const cz = Math.min(p.width, p.depth) / 200 + (p.oneSidedGlow ? 0.25 : 0.15);
  [0.1, 0.3, 0.5, 0.7, 0.9].forEach(f => {
    const light = new THREE.PointLight(new THREE.Color(p.color), lamp.brightness / 5, 6, 2);
    light.position.set(0, baseH + tubeH * f, cz);
    group.add(light);
  });
}

function heightOfItem(t) {
  return (t.params.height || 100) / 100;
}

function SmallItemObject({ type }) {
  const [ready, setReady] = React.useState(!!window.SmallItems);
  React.useEffect(() => {
    if (ready) return;
    const onReady = () => setReady(true);
    window.addEventListener('small-items-ready', onReady);
    return () => window.removeEventListener('small-items-ready', onReady);
  }, [ready]);

  const [presetName, setPresetName] = React.useState(null);
  const [overrides, setOverrides] = React.useState({});
  const [detail, setDetail] = React.useState('full');
  const [copied, setCopied] = React.useState(false);
  // Tube floor lamp light preview (page-only): on/off and brightness; the
  // colour is the lamp's own `color` param.
  const [lamp, setLamp] = React.useState({ on: true, brightness: 1 });
  // Photo frame image preview (page-only): { tex, aspect, name, url }.
  const [photo, setPhoto] = React.useState(null);
  const [photoError, setPhotoError] = React.useState('');
  const photoRef = React.useRef(null);
  const replacePhoto = next => {
    const prev = photoRef.current;
    if (prev) { prev.tex.dispose(); if (prev.url) URL.revokeObjectURL(prev.url); }
    photoRef.current = next;
    setPhoto(next);
  };
  React.useEffect(() => () => replacePhoto(null), []);
  const pickPhoto = e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (!/^image\//.test(file.type)) { setPhotoError('That is not an image file.'); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.src = url;
    img.decode().then(() => {
      const tex = new THREE.Texture(img);
      if ('colorSpace' in tex && THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      setPhotoError('');
      replacePhoto({ tex, aspect: img.naturalWidth / img.naturalHeight, name: file.name, size: img.naturalWidth + ' x ' + img.naturalHeight, url });
    }, () => { URL.revokeObjectURL(url); setPhotoError('Could not read that image.'); });
  };
  const useTestPattern = () => {
    const tex = new THREE.CanvasTexture(testPatternCanvas());
    if ('colorSpace' in tex && THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    setPhotoError('');
    replacePhoto({ tex, aspect: 2, name: 'test pattern', size: '1600 x 800', url: null });
  };

  if (!ready) {
    return <div className="sub">Loading src/furniture/small-items.js…</div>;
  }

  const presets = PRESETS[type] || {};
  const presetNames = Object.keys(presets);
  const activePreset = presetName && presets[presetName] ? presetName : presetNames[0];
  const baseParams = paramsFor(type, activePreset);
  const params = Object.assign({}, baseParams, overrides);
  const t = { type, params, detail, lamp: type === 'tube-floor-lamp' ? lamp : null,
    photo: type === 'photo-frame' ? photo : null };

  const selectPreset = (pn) => {
    setPresetName(pn);
    setOverrides({});
  };
  const setParam = (key, value) => {
    setOverrides(prev => Object.assign({}, prev, { [key]: value }));
  };

  const copyJson = () => {
    const diff = diffFromDefaults(type, params);
    const json = JSON.stringify({ type, params: diff }, null, 2);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).catch(() => {});
    }
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };

  return (
    <>
      <SpecVariants values={params} onSelect={id => selectPreset(presetNames.find(pn => slug(pn) === id))}
        variants={presetNames.map(pn => ({ id: slug(pn), label: pn, params: paramsFor(type, pn) }))} />
      <div className="sub">Built by src/furniture/small-items.js (TYPES['{type}']).</div>

      <div className="grid">
        <div className="card">
          <h2>{TYPE_LABELS[type]} — params</h2>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '11px', marginTop: '10px' }}>
            <tbody>
              <tr><th style={{ textAlign: 'left', opacity: 0.6 }}>Param</th><th style={{ textAlign: 'right', opacity: 0.6 }}>Value</th></tr>
              {Object.keys(params).sort().map(k => (
                <tr key={k}>
                  <td style={{ padding: '3px 6px 3px 0' }}>{k}</td>
                  <td style={{ padding: '3px 0', textAlign: 'right', fontVariantNumeric: 'tabular-nums' }}>
                    {typeof params[k] === 'object' ? JSON.stringify(params[k]) : String(params[k])}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="row">
            <button className="btn" onClick={copyJson}>{copied ? 'Copied!' : 'Copy JSON'}</button>
            <button className={'btn' + (detail === 'low' ? ' active' : '')}
              onClick={() => setDetail(detail === 'low' ? 'full' : 'low')}>
              {detail === 'low' ? 'detail: low' : 'detail: full'}
            </button>
          </div>
          <div className="legend">
            Copy JSON emits only the params that differ from this type's DEFAULTS —
            exactly what a real placement's furniture[].params should carry.
          </div>
          {type === 'photo-frame' && (
            <div id="photoPreview">
              <div className="row">
                <label className="btn">
                  Preview an image…
                  <input id="photoFile" type="file" accept="image/*" style={{ display: 'none' }} onChange={pickPhoto} />
                </label>
                <button className={'btn' + (photo && !photo.url ? ' active' : '')} onClick={useTestPattern}>Test pattern</button>
                {photo && <button className="btn" onClick={() => replacePhoto(null)}>Clear</button>}
              </div>
              <div className="legend">
                {photo
                  ? 'Previewing ' + photo.name + ' (' + photo.size + ')' + (params.panels > 1 ? ', spanned across all ' + params.panels + ' panels' : '') + '. '
                  : ''}
                Preview only: the image stays in this browser tab. It is never uploaded or stored, and is not
                part of Copy JSON. A real placement takes its picture from the house's own files.
              </div>
              {photoError && <div className="legend" style={{ color: '#a33', opacity: 1 }}>{photoError}</div>}
            </div>
          )}
          {type === 'tube-floor-lamp' && (
            <div className="row" id="lampPreview">
              <button className={'btn' + (lamp.on ? ' active' : '')}
                onClick={() => setLamp(Object.assign({}, lamp, { on: !lamp.on }))}>
                {lamp.on ? 'Light: on' : 'Light: off'}
              </button>
              <label className="legend" style={{ marginTop: 0 }}>colour{' '}
                <input type="color" value={params.color} onChange={e => setParam('color', e.target.value)} />
              </label>
              <label className="legend" style={{ marginTop: 0 }}>brightness{' '}
                <input type="range" min="0" max="4" step="0.1" value={lamp.brightness}
                  onChange={e => setLamp(Object.assign({}, lamp, { brightness: Number(e.target.value) }))} />
              </label>
            </div>
          )}
        </div>

        <div className="card">
          <h2>Numbers</h2>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '11px' }}>
            <tbody>
              <tr><th style={{ textAlign: 'left', opacity: 0.6 }}>Dimension</th><th style={{ textAlign: 'right', opacity: 0.6 }}>cm</th></tr>
              <tr><td>Width</td><td style={{ textAlign: 'right' }}>{params.width}</td></tr>
              <tr><td>Depth</td><td style={{ textAlign: 'right' }}>{params.depth}</td></tr>
              <tr><td>Height</td><td style={{ textAlign: 'right' }}>{params.height}</td></tr>
            </tbody>
          </table>
          <div className="legend">
            Local frame: y=0 is the item's bottom, x is centred on width, the back
            face is at z=0 and the front faces +z (docs/house-profile.md, "Furniture").
          </div>
        </div>

        <div className="card full">
          <h2>3D — {TYPE_LABELS[type]} ({activePreset})</h2>
          <ThreeView
            t={t}
            buildModel={buildItem}
            heightOf={heightOfItem}
          />
        </div>
      </div>
    </>
  );
}

window.__specObjects = window.__specObjects || {};
TYPE_ORDER.forEach(tp => { window.__specObjects[tp] = () => <SmallItemObject type={tp} />; });
})();
</script>

<script type="text/babel">
// ---- object "wall-sign" and the two wall lights: moved verbatim from
// WallDecorSpec.html, wrapped in an IIFE so its top-level names cannot
// collide with the block above. Edits: its mount lines, <h1> and sign/sconce
// switchers removed; the object is a prop.
(function () {
/* =====================================================================
   WALL DECOR SPEC   ·   framed wall sign + wall sconce (2 kinds)

   ── DIMENSIONS ARE ILLUSTRATIVE ──────────────────────────────────────
   Every dimension below is a DEFAULT, not a survey. Sign text is a stock
   retail sign phrase, not any real house's wording — this is a public
   repo and carries no real-house text or data. Measure your own item and
   drive the geometry from the Tweaks panel.

   The sign has TWO depth levels: the outer frame (`depth`, default 3cm,
   front at z=depth) projects forward past the inner white-washed
   panel/body (`panelDepth`, default 1.5cm, its own text-bearing front
   face at z=panelDepth) by their difference (1.5cm by default).
   ─────────────────────────────────────────────────────────────────────

   This page renders the two builder modules directly
   (src/furniture/wall-sign.js, src/furniture/wall-sconce.js) via a
   dynamic ES import bridged onto window.__wallDecorModules above, so the
   page is always in sync with what the app and the Node tests build —
   never a re-implementation of the geometry.

   Builder contract: ESM, THREE injected, exports TYPE/DEFAULTS (frozen,
   with numeric width/height/depth)/build(THREE, params, {detail}),
   metres, y=0 at the bottom, back face at z=0, front faces +z. Finish
   contract: every mesh carries userData.finish from the closed palette
   {matte, gloss, metal, glass, mirror, emissive}; glass/emissive/textured
   parts carry userData.keep so the live renderer's per-finish mesh merge
   leaves them as their own draw call.

   wall-sconce.js is ONE registered type ("wall-sconce") with two visual
   kinds selected by params.kind:
     - "swing-arm-globe" (default) — brass arm + smoked glass globe + bulb.
     - "up-down" — a rectangular wall light with a lens at top and bottom,
       each with a faint up/down beam-cone hint when on.
   ===================================================================== */

const SIGN_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "width": 110,
  "height": 45,
  "depth": 3,
  "panelDepth": 1.5,
  "frameThickness": 2,
  "frameColor": "#151515",
  "panelColor": "#f2ede2",
  "line1": "GIVE IT TO GOD",
  "line2": "and go to sleep",
  "textColor": "#1a1a1a"
}/*EDITMODE-END*/;

// Preset params per sconce kind. Switching the preset replaces the whole
// tweak object (via setSconceTweak with no key) so stale params from the
// other kind never leak through onto the new one.
const SCONCE_PRESETS = {
  'swing-arm-globe': {
    label: 'Swing-arm globe',
    defaults: {
      kind: 'swing-arm-globe',
      armLength: 22,
      dropLength: 18,
      globeDiameter: 15,
      metalColor: '#b08d57',
      glassColor: '#6b4a2a',
      on: true
    }
  },
  'up-down': {
    label: 'Up/down wall light (rectangular)',
    defaults: {
      kind: 'up-down',
      width: 12,
      height: 20,
      plateThickness: 1,
      bodyWidth: 6,
      bodyHeight: 12,
      bodyDepth: 5,
      lensDiameter: 3,
      lensProtrusion: 1,
      metalColor: '#8a5a3c',
      on: true
    }
  }
};

const SCONCE_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "kind": "swing-arm-globe",
  "armLength": 22,
  "dropLength": 18,
  "globeDiameter": 15,
  "metalColor": "#b08d57",
  "glassColor": "#6b4a2a",
  "on": true
}/*EDITMODE-END*/;

function useModulesReady() {
  const [ready, setReady] = React.useState(!!window.__wallDecorModules);
  React.useEffect(() => {
    if (ready) return;
    const onReady = () => setReady(true);
    window.addEventListener('wall-decor-modules-ready', onReady);
    return () => window.removeEventListener('wall-decor-modules-ready', onReady);
  }, [ready]);
  return ready;
}

// ============== App ==============
// On Small items the sign and each sconce kind are separate OBJECTS (the two
// sconce kinds have different controls), so the object is a prop now, where
// it used to be this page's own sign/sconce + kind switchers.
function App({ item, sconceKind: kindProp }) {
  const ready = useModulesReady();
  const [signT, setSignTweak] = useTweaks(SIGN_TWEAK_DEFAULTS);
  const [sconceT, setSconceTweak] = useTweaks(kindProp === 'up-down' ? SCONCE_PRESETS['up-down'].defaults : SCONCE_TWEAK_DEFAULTS);
  const [copied, setCopied] = React.useState(false);

  const sconceKind = sconceT.kind === 'up-down' ? 'up-down' : 'swing-arm-globe';

  const buildSign = React.useCallback((t, group, THREE, ctx) => {
    const mods = window.__wallDecorModules;
    if (!mods) return;
    const built = mods.WallSign.build(THREE, t, { detail: 'full' });
    group.add(built);
  }, []);

  const buildSconce = React.useCallback((t, group, THREE, ctx) => {
    const mods = window.__wallDecorModules;
    if (!mods) return;
    const built = mods.WallSconce.build(THREE, t, { detail: 'full' });
    group.add(built);
  }, []);

  const copyJson = () => {
    const mods = window.__wallDecorModules;
    if (!mods) return;
    const payload = item === 'sign'
      ? { type: mods.WallSign.TYPE, params: signT }
      : { type: mods.WallSconce.TYPE, params: sconceT };
    const text = JSON.stringify(payload, null, 2);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => {});
    }
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };

  if (!ready) {
    return <div className="sub">Loading builder modules…</div>;
  }

  const isSign = item === 'sign';
  const heightOf = sconceKind === 'up-down'
    ? (tt => (tt.height || 20) * 0.01 + 0.15)
    : (tt => ((tt.armLength || 22) + (tt.dropLength || 18) + (tt.globeDiameter || 15)) * 0.01 + 0.15);

  return (
    <>
      <div className="sub">All units cm unless noted. Framed wall sign + wall sconce (2 kinds). Sign text is a stock retail phrase — no real-house wording ships in this repo. The sign's outer frame (depth) projects forward past its inner panel/body (panelDepth) by their difference.</div>

      <div className="grid">
        <div className="card full">
          <h2>3D — {isSign ? 'wall sign' : SCONCE_PRESETS[sconceKind].label}</h2>
          {isSign ? (
            <ThreeView
              key="sign"
              t={signT}
              buildModel={buildSign}
              heightOf={tt => tt.height * 0.01 + 0.2}
            />
          ) : (
            <ThreeView
              key={'sconce-' + sconceKind}
              t={sconceT}
              buildModel={buildSconce}
              heightOf={heightOf}
            />
          )}
        </div>
      </div>

      <TweaksPanel>
        {isSign ? (
          <>
            <TweakSection label="Sign — frame" />
            <TweakSlider label="Width" value={signT.width} min={60} max={200} step={1} unit="cm"
              onChange={v => setSignTweak('width', v)} />
            <TweakSlider label="Height" value={signT.height} min={20} max={100} step={1} unit="cm"
              onChange={v => setSignTweak('height', v)} />
            <TweakSlider label="Depth (outer frame)" value={signT.depth} min={1} max={8} step={0.5} unit="cm"
              onChange={v => setSignTweak('depth', v)} />
            <TweakSlider label="Panel depth (inner body)" value={signT.panelDepth} min={0.5} max={signT.depth} step={0.5} unit="cm"
              onChange={v => setSignTweak('panelDepth', v)} />
            <TweakSlider label="Frame thickness" value={signT.frameThickness} min={1} max={10} step={0.5} unit="cm"
              onChange={v => setSignTweak('frameThickness', v)} />
            <TweakColor label="Frame colour" value={signT.frameColor}
              onChange={v => setSignTweak('frameColor', v)} />
            <TweakColor label="Panel colour" value={signT.panelColor}
              onChange={v => setSignTweak('panelColor', v)} />
            <TweakSection label="Sign — text" />
            <TweakText label="Line 1 (serif caps)" value={signT.line1}
              onChange={v => setSignTweak('line1', v)} />
            <TweakText label="Line 2 (script)" value={signT.line2}
              onChange={v => setSignTweak('line2', v)} />
            <TweakColor label="Text colour" value={signT.textColor}
              onChange={v => setSignTweak('textColor', v)} />
          </>
        ) : sconceKind === 'up-down' ? (
          <>
            <TweakSection label="Up/down — geometry" />
            <TweakSlider label="Backplate width" value={sconceT.width} min={8} max={24} step={1} unit="cm"
              onChange={v => setSconceTweak('width', v)} />
            <TweakSlider label="Backplate height" value={sconceT.height} min={14} max={32} step={1} unit="cm"
              onChange={v => setSconceTweak('height', v)} />
            <TweakSlider label="Body height" value={sconceT.bodyHeight} min={6} max={20} step={1} unit="cm"
              onChange={v => setSconceTweak('bodyHeight', v)} />
            <TweakSlider label="Lens diameter" value={sconceT.lensDiameter} min={1.5} max={5} step={0.5} unit="cm"
              onChange={v => setSconceTweak('lensDiameter', v)} />
            <TweakSection label="Up/down — finish" />
            <TweakColor label="Metal colour" value={sconceT.metalColor}
              onChange={v => setSconceTweak('metalColor', v)} />
            <TweakToggle label="On (glow)" value={sconceT.on}
              onChange={v => setSconceTweak('on', v)} />
          </>
        ) : (
          <>
            <TweakSection label="Swing-arm — geometry" />
            <TweakSlider label="Arm length" value={sconceT.armLength} min={10} max={40} step={1} unit="cm"
              onChange={v => setSconceTweak('armLength', v)} />
            <TweakSlider label="Drop length" value={sconceT.dropLength} min={5} max={40} step={1} unit="cm"
              onChange={v => setSconceTweak('dropLength', v)} />
            <TweakSlider label="Globe diameter" value={sconceT.globeDiameter} min={8} max={30} step={1} unit="cm"
              onChange={v => setSconceTweak('globeDiameter', v)} />
            <TweakSection label="Swing-arm — finish" />
            <TweakColor label="Metal colour" value={sconceT.metalColor}
              onChange={v => setSconceTweak('metalColor', v)} />
            <TweakColor label="Glass colour" value={sconceT.glassColor}
              onChange={v => setSconceTweak('glassColor', v)} />
            <TweakToggle label="On (glow)" value={sconceT.on}
              onChange={v => setSconceTweak('on', v)} />
          </>
        )}
        <TweakSection label="Export" />
        <TweakButton label={copied ? 'Copied!' : 'Copy as furniture JSON'} onClick={copyJson} />
      </TweaksPanel>
    </>
  );
}

window.__specObjects = window.__specObjects || {};
window.__specObjects['wall-sign'] = () => <App item="sign" />;
window.__specObjects['wall-light-swing-arm'] = () => <App item="sconce" sconceKind="swing-arm-globe" />;
window.__specObjects['wall-light-up-down'] = () => <App item="sconce" sconceKind="up-down" />;
})();
</script>

<script type="text/babel">
// The family page: one SpecPage; each object its own component (remount mode).
const ids = JSON.parse(document.getElementById('spec-manifest').textContent).objects.map(o => o.id);
const render = {};
ids.forEach(id => { render[id] = () => window.__specObjects[id](); });
ReactDOM.createRoot(document.getElementById('root')).render(<SpecPage render={render} />);

// Standalone viewing (opened directly at a /w URL, no design-tool host):
// the shared TweaksPanel stays closed until it receives __activate_edit_mode.
// Self-post it so the panel is visible when there's no host driving it.
setTimeout(() => window.postMessage({ type: '__activate_edit_mode' }, '*'), 0);
</script>
</body>
</html>
