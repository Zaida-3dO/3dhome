<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wall panels — Spec</title>
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { background:#f4f1ec; color:#1a1a1a; font-family:ui-monospace,'SF Mono',Menlo,monospace; padding:24px; }
  h1 { font-size:14px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; margin-bottom:4px; }
  .sub { font-size:11px; opacity:0.6; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
  .card { background:#fff; border:1px solid #d8d3c8; border-radius:6px; padding:20px; }
  .card h2 { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; opacity:0.7; margin-bottom:14px; }
  svg { display:block; width:100%; height:auto; }
  #c3d { width:100%; height:560px; display:block; background:#1a1a1c; border-radius:4px; }
  .legend { font-size:10px; line-height:1.6; margin-top:14px; opacity:0.75; }
  .row { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .btn { padding:6px 10px; font:inherit; font-size:10px; background:#1a1a1c; color:#fff; border:none; border-radius:4px; cursor:pointer; }
  .btn:hover { background:#333; }
  .btn.active { background:#6b5d4a; }
  .full { grid-column:1 / -1; }
  table { width:100%; border-collapse:collapse; font-size:11px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid #ece8e0; }
  th { font-weight:600; opacity:0.6; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .note { font-size:11px; opacity:0.7; margin-top:10px; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Which objects this page holds (read by SpecPage in tweaks-panel.jsx and by
     scripts/test-spec-pages.mjs). Black/oak slats are VARIANTS of the slat panel. -->
<script type="application/json" id="spec-manifest">
{
  "title": "Wall panels",
  "description": "All units cm. Two independent panel types built by the real furniture module (src/furniture/wall-panels.js), not a page-local reimplementation. Pick an object and a variant, then fine-tune in the Tweaks panel.",
  "objects": [
    { "id": "slat-panel",        "label": "Slat panel", "types": ["slat-panel"] },
    { "id": "hex-panel-cluster", "label": "Hex panel cluster", "types": ["hex-panel-cluster"] }
  ]
}
</script>

<!-- React/ReactDOM/Babel/three served LOCALLY (../vendor/) — no CDN: this app must work on a LAN with no internet. React is the production build; Babel is required because the .jsx below is transpiled in-browser at runtime. -->
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../vendor/babel.min.js"></script>
<script src="../vendor/three.js"></script>
<!-- Shared harness: tweaks-panel.jsx (tweaks machinery) + reusable ThreeView -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="spec-three.jsx"></script>

<!-- The actual builder module (src/furniture/wall-panels.js) is loaded as a
     real ES module, dynamically, from the classic/Babel script below — this
     is deliberate: this page is a spec for the REAL furniture builder, not a
     reimplementation of its geometry. `window.THREE` (the UMD build the
     scripts above already share) is passed in as the injected THREE the
     builder contract requires; both this build and the one behind the `three`
     import map are r160, so the classes the builder constructs (THREE.Group,
     THREE.Mesh, THREE.BoxGeometry, THREE.ExtrudeGeometry, THREE.Shape) behave
     identically regardless of which namespace created them. -->
<script type="module">
  import * as WallPanels from '../src/furniture/wall-panels.js';
  window.__wallPanelsModule = WallPanels;
  window.dispatchEvent(new Event('__wall_panels_module_ready'));
</script>

<script type="text/babel">
/* =====================================================================
   WALL PANEL SPEC   ·   slat panelling + hexagon acoustic panel clusters

   Plan of record: plan-furniture-system-r2.md (PR10). Builder module:
   src/furniture/wall-panels.js, multi-type (`slat-panel`, `hex-panel-cluster`).

   Two independent panel types, switched with a segmented control:

     SLAT PANEL — vertical wood/black slats over a felt backing. Ported
     visually from the acoustic-panel look in src/home3d-scene.js
     (buildAcousticPanelWall25 / buildAcousticPanelLivingRoomWall1Wall3),
     READ-ONLY — this page never imports or calls that code.
       Presets:
         "Black slats" — dark charcoal slats, near-black backing.
         "Oak slats"   — the bedroom headboard wall: light oak slats on a
                         black felt backing.

     HEX PANEL CLUSTER — a honeycomb of regular hexagon felt panels, 29
     meshes sharing one geometry, cheap to draw. The living-room default is
     29 hexes in vertical columns, left to right (3,4,5,4,4,4,3,2), 18cm side, matching
     the photo reference named in the plan (living-room-hex-wall-tv.jpg):
     flat-top hexes, stacked in an offset honeycomb, each column centred by
     default except column 5, shifted down half a hex to interlock with
     columns 4 and 6.

   Both types are built by calling the REAL builder
   (window.__wallPanelsModule.TYPES[type].build), not a page-local copy —
   so this page can never drift from what the house loader actually draws.
   ===================================================================== */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "panelType": "slat-panel",
  "slatPreset": "black",
  "slatWidthCm": 240,
  "slatHeightCm": 250,
  "slatWidth": 2.7,
  "pitch": 4.0,
  "slatDepth": 1.0,
  "backingDepth": 0.9,
  "hexSide": 18,
  "hexThickness": 1,
  "hexColor": "#466e5e",
  "hexBevelWidth": 0.9,
  "hexBevelDepth": 0.5
}/*EDITMODE-END*/;

// Real Acupanel Contemporary Oak product spec (src/home3d-scene.js's
// hard-coded bedroom panel) -- both presets share these geometry numbers
// (2026-09-26, WallPanelSpec review criterion 9); only colour (and, for oak,
// the grain map) differs between them.
const SLAT_PRESETS = {
  black: { label: 'Black slats', slatColor: '#322e29', backingColor: '#0e0b09', grainMap: false },
  oak:   { label: 'Oak slats',   slatColor: '#c9a06a', backingColor: '#1c1815', grainMap: true }
};

// The living-room default cluster (29 hexes), in vertical columns left to
// right. Matches wall-panels.js's own HEX_DEFAULT_COLUMNS /
// HEX_DEFAULT_COLUMN_OFFSETS — kept as literals here (rather than reached
// into the module) so the preset reads clearly as "the real house use",
// independent of internal module names. Column 5 (index 4) is shifted down
// half a hex to interlock with columns 4 and 6 (see wall-panels.js).
const HEX_LIVING_ROOM_COLUMNS = [3, 4, 5, 4, 4, 4, 3, 2];
const HEX_LIVING_ROOM_COLUMN_OFFSETS = [0, 0, 0, 0, 1, 0, 0, 0];

function countHexes(columns) { return columns.reduce((s, n) => s + n, 0); }

// The cluster's derived bbox height (m), mirroring wall-panels.js's own
// layoutHexes: each column's flat-top hexes are centred vertically then
// shifted by its offset (half-hex units, positive = down); the bbox is the
// min/max of every column's own top/bottom edge -- NOT a formula from the
// tallest column alone, since a shifted shorter column can exceed it.
function hexClusterHeightM(sideCm, columns, columnOffsets) {
  const sideM = sideCm / 100;
  const rowPitch = Math.sqrt(3) * sideM, halfHex = rowPitch / 2;
  let minY = Infinity, maxY = -Infinity;
  columns.forEach((count, c) => {
    const off = columnOffsets[c] || 0;
    const y0 = -((count - 1) * rowPitch) / 2 - off * halfHex;
    const yTop = y0 - rowPitch / 2, yBottom = y0 + (count - 1) * rowPitch + rowPitch / 2;
    minY = Math.min(minY, yTop);
    maxY = Math.max(maxY, yBottom);
  });
  return maxY - minY;
}

// ============== Model: calls the REAL builder module ==============
function buildPanel(t, group, THREE, ctx) {
  const mod = window.__wallPanelsModule;
  if (!mod) return; // module still loading; the effect below re-fires once it's ready

  if (t.panelType === 'slat-panel') {
    const preset = SLAT_PRESETS[t.slatPreset] || SLAT_PRESETS.black;
    const impl = mod.TYPES['slat-panel'];
    const params = Object.assign({}, impl.DEFAULTS, {
      width: t.slatWidthCm,
      height: t.slatHeightCm,
      slatWidth: t.slatWidth,
      pitch: t.pitch,
      slatDepth: t.slatDepth,
      backingDepth: t.backingDepth,
      slatColor: preset.slatColor,
      backingColor: preset.backingColor,
      grainMap: preset.grainMap
    });
    const built = impl.build(THREE, params, { detail: 'full' });
    group.add(built);
    ctx.heightM = params.height / 100;
  } else {
    const impl = mod.TYPES['hex-panel-cluster'];
    const params = Object.assign({}, impl.DEFAULTS, {
      side: t.hexSide,
      columns: HEX_LIVING_ROOM_COLUMNS,
      columnOffsets: HEX_LIVING_ROOM_COLUMN_OFFSETS,
      thickness: t.hexThickness,
      color: t.hexColor,
      bevelWidth: t.hexBevelWidth,
      bevelDepth: t.hexBevelDepth
    });
    const built = impl.build(THREE, params, { detail: 'full' });
    group.add(built);
    // heightOf needs the ACTUAL derived bbox height, not a DEFAULTS guess —
    // recompute it the same way the builder does (side + columns +
    // columnOffsets -> bbox).
    ctx.heightM = hexClusterHeightM(t.hexSide, HEX_LIVING_ROOM_COLUMNS, HEX_LIVING_ROOM_COLUMN_OFFSETS);
  }
}

// ============== App ==============
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [moduleReady, setModuleReady] = React.useState(!!window.__wallPanelsModule);

  React.useEffect(() => {
    if (moduleReady) return;
    const onReady = () => setModuleReady(true);
    window.addEventListener('__wall_panels_module_ready', onReady);
    return () => window.removeEventListener('__wall_panels_module_ready', onReady);
  }, [moduleReady]);

  const isSlat = t.panelType === 'slat-panel';
  const preset = SLAT_PRESETS[t.slatPreset] || SLAT_PRESETS.black;
  const hexCount = countHexes(HEX_LIVING_ROOM_COLUMNS);

  // Black/oak are VARIANTS of the slat panel (same geometry, different finish).
  const slatVariants = Object.keys(SLAT_PRESETS)
    .map(key => ({ id: key, label: SLAT_PRESETS[key].label, params: { slatPreset: key } }));
  return (
    <SpecPage objectId={t.panelType} onObject={id => setTweak('panelType', id)}>
      {isSlat && <SpecVariants variants={slatVariants} values={t} onSelect={key => setTweak('slatPreset', key)} />}

      <div className="grid">
        <div className="card">
          <h2>{isSlat ? 'Slat panel' : 'Hex panel cluster'}</h2>
          {isSlat ? (
            <>
              <div className="note">{preset.label}: slat {preset.slatColor}, backing {preset.backingColor}. The oak preset is the bedroom headboard wall — light oak slats (with a subtle grain map) on a black felt backing; both presets share the real Acupanel geometry (slat 2.7cm wide, 4.0cm pitch, 1.0cm deep, 0.9cm backing).</div>
            </>
          ) : (
            <div className="note">Living-room default: side {t.hexSide} cm, columns (left to right) {HEX_LIVING_ROOM_COLUMNS.join(',')} = {hexCount} hexes, dark green felt, ~{t.hexThickness} cm thick. Flat-top, offset honeycomb; each column centred except column 5, shifted down half a hex to interlock with columns 4 and 6. Each hex has a chamfered front edge (bevel width {t.hexBevelWidth} cm, bevel depth {t.hexBevelDepth} cm) -- full thickness in the centre, sloping to a thinner rim, so a V-groove line reads where two hexes meet.</div>
          )}
          {!moduleReady && <div className="note">Loading src/furniture/wall-panels.js…</div>}
        </div>

        <div className="card">
          <h2>Numbers</h2>
          {isSlat ? (
            <table>
              <tbody>
                <tr><th>Feature</th><th className="num">cm</th><th>Variability</th></tr>
                <tr><td>Panel width</td><td className="num">{t.slatWidthCm.toFixed(0)}</td><td><b>Variable</b></td></tr>
                <tr><td>Panel height</td><td className="num">{t.slatHeightCm.toFixed(0)}</td><td><b>Variable</b></td></tr>
                <tr><td>Slat width</td><td className="num">{t.slatWidth.toFixed(1)}</td><td><b>Variable</b></td></tr>
                <tr><td>Nominal pitch</td><td className="num">{t.pitch.toFixed(1)}</td><td><b>Variable</b> — adjusted to fit a whole number of slats</td></tr>
                <tr><td>Slat depth (protrusion)</td><td className="num">{t.slatDepth.toFixed(1)}</td><td><b>Variable</b></td></tr>
                <tr><td>Backing depth</td><td className="num">{t.backingDepth.toFixed(1)}</td><td><b>Variable</b></td></tr>
                <tr><td>Total depth</td><td className="num">{(t.slatDepth + t.backingDepth).toFixed(1)}</td><td>Derived</td></tr>
              </tbody>
            </table>
          ) : (
            <table>
              <tbody>
                <tr><th>Feature</th><th className="num">cm</th><th>Variability</th></tr>
                <tr><td>Hex side</td><td className="num">{t.hexSide.toFixed(1)}</td><td><b>Variable</b></td></tr>
                <tr><td>Panel thickness</td><td className="num">{t.hexThickness.toFixed(1)}</td><td><b>Variable</b></td></tr>
                <tr><td>Bevel width (front inset)</td><td className="num">{t.hexBevelWidth.toFixed(1)}</td><td><b>Variable</b></td></tr>
                <tr><td>Bevel depth (rim vs. centre)</td><td className="num">{t.hexBevelDepth.toFixed(2)}</td><td><b>Variable</b></td></tr>
                <tr><td>Column counts (left to right)</td><td className="num">{HEX_LIVING_ROOM_COLUMNS.join('-')}</td><td>Fixed (living-room preset)</td></tr>
                <tr><td>Hex count</td><td className="num">{hexCount}</td><td>Derived from columns</td></tr>
              </tbody>
            </table>
          )}
        </div>

        <div className="card full">
          <h2>3D — {isSlat ? preset.label : 'Hex cluster (living room preset)'}</h2>
          <ThreeView
            t={t}
            buildModel={buildPanel}
            heightOf={tt => (tt.panelType === 'slat-panel' ? tt.slatHeightCm * 0.01 : hexClusterHeightM(tt.hexSide, HEX_LIVING_ROOM_COLUMNS, HEX_LIVING_ROOM_COLUMN_OFFSETS))}
            // A dark-green felt is nearly invisible against ThreeView's
            // default near-black background (rgb 26,26,28), making the
            // colour hard to judge on this page. Hex mode gets a pale,
            // off-white wall colour instead (matching the photo reference
            // named in the plan comment above). Slat mode is unaffected
            // (keeps the original dark viewer background). NOTE (round 6,
            // 2026-09-27): the felt colour default itself is tuned for the
            // LIVE APP's lighting across four light states (night/morning/
            // noon-lit/noon-lights-off), not this page's -- this page also
            // has an environment map (see ThreeView's own comment above)
            // that makes the same base colour render noticeably lighter and
            // more sage here (rgb ~80,113,95) than the dark green it reads
            // as in the app. That is accepted, not a bug; aligning this
            // page's lighting with the app is a separate follow-up. See
            // wall-panels.js's HEX_CLUSTER_DEFAULTS.color for the full
            // account of how the value was chosen.
            backgroundOf={tt => (tt.panelType === 'hex-panel-cluster' ? '#d8d3c8' : 0x1a1a1c)}
          />
        </div>
      </div>

      <TweaksPanel>
        {isSlat && (
          <>
            <TweakSection label="Size" />
            <TweakSlider label="Width" value={t.slatWidthCm} min={60} max={400} step={1} unit="cm"
              onChange={v => setTweak('slatWidthCm', v)} />
            <TweakSlider label="Height" value={t.slatHeightCm} min={100} max={300} step={1} unit="cm"
              onChange={v => setTweak('slatHeightCm', v)} />

            <TweakSection label="Slats" />
            <TweakSlider label="Slat width" value={t.slatWidth} min={2} max={15} step={0.1} unit="cm"
              onChange={v => setTweak('slatWidth', v)} />
            <TweakSlider label="Pitch" value={t.pitch} min={t.slatWidth} max={20} step={0.1} unit="cm"
              onChange={v => setTweak('pitch', v)} />
            <TweakSlider label="Slat depth" value={t.slatDepth} min={0.5} max={4} step={0.1} unit="cm"
              onChange={v => setTweak('slatDepth', v)} />
            <TweakSlider label="Backing depth" value={t.backingDepth} min={0.3} max={3} step={0.1} unit="cm"
              onChange={v => setTweak('backingDepth', v)} />
          </>
        )}

        {!isSlat && (
          <>
            <TweakSection label="Hex cluster" />
            <TweakSlider label="Hex side" value={t.hexSide} min={8} max={30} step={0.5} unit="cm"
              onChange={v => setTweak('hexSide', v)} />
            <TweakSlider label="Thickness" value={t.hexThickness} min={0.5} max={4} step={0.1} unit="cm"
              onChange={v => setTweak('hexThickness', v)} />
            <TweakColor label="Felt colour" value={t.hexColor}
              onChange={v => setTweak('hexColor', v)} />
            <TweakSlider label="Bevel width" value={t.hexBevelWidth} min={0} max={3} step={0.1} unit="cm"
              onChange={v => setTweak('hexBevelWidth', v)} />
            <TweakSlider label="Bevel depth" value={t.hexBevelDepth} min={0} max={t.hexThickness} step={0.05} unit="cm"
              onChange={v => setTweak('hexBevelDepth', v)} />
          </>
        )}
      </TweaksPanel>
    </SpecPage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Standalone viewing (opened directly at a /w URL, no design-tool host):
// the shared TweaksPanel stays closed until it receives __activate_edit_mode.
// Self-post it so the panel is visible when there's no host driving it.
setTimeout(() => window.postMessage({ type: '__activate_edit_mode' }, '*'), 0);
</script>
</body>
</html>
