<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dining table &amp; chairs — Spec</title>
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { background:#f4f1ec; color:#1a1a1a; font-family:ui-monospace,'SF Mono',Menlo,monospace; padding:24px; }
  h1 { font-size:14px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; margin-bottom:4px; }
  .sub { font-size:11px; opacity:0.6; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
  .card { background:#fff; border:1px solid #d8d3c8; border-radius:6px; padding:20px; }
  .card h2 { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; opacity:0.7; margin-bottom:14px; }
  #c3d { width:100%; height:560px; display:block; background:#1a1a1c; border-radius:4px; }
  .legend { font-size:10px; line-height:1.6; margin-top:14px; opacity:0.75; }
  .row { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .btn { padding:6px 10px; font:inherit; font-size:10px; background:#1a1a1c; color:#fff; border:none; border-radius:4px; cursor:pointer; }
  .btn:hover { background:#333; }
  .btn.active { background:#6b5d4a; }
  .full { grid-column:1 / -1; }
  table { width:100%; border-collapse:collapse; font-size:11px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid #ece8e0; }
  th { font-weight:600; opacity:0.6; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  pre.json { font-size:10px; background:#f8f6f1; border:1px solid #e6e1d6; border-radius:4px; padding:10px;
    max-height:180px; overflow:auto; white-space:pre-wrap; word-break:break-word; }
  .copied { color:#2a7a3f; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Which objects this page holds (read by SpecPage in tweaks-panel.jsx and by
     scripts/test-spec-pages.mjs). The set and a lone chair are two OBJECTS;
     tucked / pulled-out / larger-table are VARIANTS of the set. -->
<script type="application/json" id="spec-manifest">
{
  "title": "Dining table & chairs",
  "description": "A space-saving NESTING dining set: a round table on 4 splayed legs (no pedestal) plus 4 quadrant chairs that, tucked in, form the cylinder the white top overhangs like a lid. Renders the REAL src/furniture/dining.js builders. Pick an object and a variant, then fine-tune in the Tweaks panel. (The wall clock has its own page, under Decor & accessories.)",
  "objects": [
    { "id": "dining-set",   "label": "Dining set", "types": ["dining-table", "dining-chair"] },
    { "id": "dining-chair", "label": "Dining chair", "types": ["dining-chair"] }
  ]
}
</script>

<!-- React/ReactDOM/Babel/three served LOCALLY (../vendor/) — no CDN: this app must work on a LAN with no internet. React is the production build; Babel is required because the .jsx below is transpiled in-browser at runtime. -->
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../vendor/babel.min.js"></script>
<script src="../vendor/three.js"></script>
<!-- Shared harness: tweaks-panel.jsx (tweaks machinery) + reusable ThreeView -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="spec-three.jsx"></script>

<!--
  dining.js is the REAL shipped builder module (pure ESM, THREE injected, no
  side effects) -- this page renders exactly what the live scene renders, not
  a re-implementation that could drift from it. It is loaded here via a
  classic `type="module"` script (the only way an ES module reaches a page
  built from classic `text/babel` scripts) and its exports are copied onto
  `window` for the Babel script below to use. `window.THREE` above is the UMD
  build of the SAME three.js revision dining.js is tested against, so passing
  it in as dining.js's injected THREE is exactly what the live scene does.
-->
<script type="module">
  import * as Dining from '../src/furniture/dining.js';
  window.__dining = Dining;
  window.dispatchEvent(new Event('__dining_ready'));
</script>

<script type="text/babel">
/* =====================================================================
   DINING SPEC — a space-saving NESTING dining set: a round table on 4
   splayed legs (no pedestal) plus 4 quadrant chairs whose curved backs, when
   tucked in, form the black cylinder the white top overhangs like a lid.
   Renders the REAL builders in src/furniture/dining.js, not a
   re-implementation, so this page can never drift from what a house profile
   actually gets.

   Modelled from real (private, never committed) kitchen photos of this
   house's dining set.

   The wall clock that used to be tweakable here moved to its own page,
   ClockSpec.html (item 89769f2b, 2026-09-26) -- it shared no geometry with
   the table/chairs, just this page by coincidence of both being kitchen
   photos.

   NESTING MATH (shared by the "nested set" preset's live scene AND
   scripts/test-dining.mjs's interpenetration checks -- see that file for the
   proof this is exact): chair i (i=0..3) is tucked with its own local
   origin -- the back-arc's centre -- placed at world
   (radius*sin(theta_i), 0, radius*cos(theta_i)) for theta_i = i*90deg, then
   rotated by theta_i + 180deg so its apex (front, pointing away from its own
   back) converges on the shared centre. `pulledOut` (0..1) linearly scales
   that radial placement distance from the tucked radius up to +45cm, so at
   1 the chairs sit visibly apart from the nested cylinder.
   ===================================================================== */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "preset": "nested-set",
  "tableDiameter": 100,
  "tableHeight": 75,
  "tableTopColor": "#f5f5f2",
  "tableFrameHeight": 22,
  "legColor": "#1a1a1a",
  "chairRadius": 45,
  "chairBackSweep": 84,
  "chairHeight": 71,
  "chairSeatHeight": 46,
  "chairColor": "#1a1a1a",
  "pulledOut": 0,
  "chairAlone": false,
  "detail": "full"
}/*EDITMODE-END*/;

const CM = 0.01;
const PULL_OUT_MAX_M = 0.45; // 45 cm, per the "pulled out" acceptance criterion

// Presets: named combinations a reviewer can jump straight to, instead of
// hand-dialling every slider back to a known-good state. "nested-set" is the
// numbers read off the real photos; "larger-table" is an alternate size;
// "chair-alone" isolates one chair (no table, no other chairs) so its own
// shape -- the wedge, the curved back, the leg/stretcher frame -- can be
// checked without three others obscuring it (visual review round 1, item
// 89769f2b, fix #7).
const PRESETS = {
  'nested-set': {
    tableDiameter: 100, tableHeight: 75, tableTopColor: '#f5f5f2', tableFrameHeight: 22, legColor: '#1a1a1a',
    chairRadius: 45, chairBackSweep: 84, chairHeight: 71, chairSeatHeight: 46, chairColor: '#1a1a1a', pulledOut: 0, chairAlone: false
  },
  'pulled-out': {
    tableDiameter: 100, tableHeight: 75, tableTopColor: '#f5f5f2', tableFrameHeight: 22, legColor: '#1a1a1a',
    chairRadius: 45, chairBackSweep: 84, chairHeight: 71, chairSeatHeight: 46, chairColor: '#1a1a1a', pulledOut: 1, chairAlone: false
  },
  'larger-table': {
    // chairRadius scaled up with the table (50, not the DEFAULTS 45) --
    // the table's own leg-top radius (tableRadius*0.78) grows with
    // tableDiameter, so a bigger table needs a bigger nested chair ring to
    // keep the legs inside it (round-3 code review, item 89769f2b: at
    // chairRadius=45 this preset's leg tops sit just outside the chair
    // arc, which is exactly what the collisionRisk() guard now catches).
    tableDiameter: 120, tableHeight: 76, tableTopColor: '#f5f5f2', tableFrameHeight: 24, legColor: '#1a1a1a',
    chairRadius: 50, chairBackSweep: 84, chairHeight: 71, chairSeatHeight: 46, chairColor: '#1a1a1a', pulledOut: 0, chairAlone: false
  },
  'chair-alone': {
    tableDiameter: 100, tableHeight: 75, tableTopColor: '#f5f5f2', tableFrameHeight: 22, legColor: '#1a1a1a',
    chairRadius: 45, chairBackSweep: 84, chairHeight: 71, chairSeatHeight: 46, chairColor: '#1a1a1a', pulledOut: 0, chairAlone: true
  }
};

// ============== Wait for dining.js (ES module) to attach to window ==============
function useDiningModule() {
  const [mod, setMod] = React.useState(window.__dining || null);
  React.useEffect(() => {
    if (mod) return;
    const onReady = () => setMod(window.__dining);
    window.addEventListener('__dining_ready', onReady);
    return () => window.removeEventListener('__dining_ready', onReady);
  }, [mod]);
  return mod;
}

// ============== Slider guard: warn when sizes can recreate a collision ==============
// dining.js's table leg placement (legTopRadius = tableRadius*0.78,
// legFootRadius = tableRadius*0.97, legWidthTangential = 2cm) assumes its
// companion chairs open a seam gap (backSweep < 90) wide enough for that
// tangential width at the leg's own radius -- so an unusual COMBINATION
// (backSweep too close to 90, or a table/chair pairing that pushes the leg
// top outside the chair's own arc) can reopen a collision even though each
// slider alone stays in its declared range.
//
// Round-2's version of this check warned on "legTopRadius < chairRadius+2",
// a leftover from when the legs sat OUTSIDE the chair cylinder -- now that
// they deliberately sit INSIDE it (in the seam), that condition fires on
// every shipped preset and its "try a larger table" advice pushes the legs
// back outside (round-3 code review, item 89769f2b, finding 1). The two
// REAL risks are: (a) the seam gap at the leg's own radius is narrower than
// the leg's tangential half-width plus a safety margin, and (b) the leg top
// itself has drifted outside the chair's own arc radius (round 2's actual
// defect class). The old "feet past the rim" check is dropped -- the foot
// radius (tableR*0.97) can never exceed tableR, so it could never fire.
function collisionRisk(t) {
  const warnings = [];
  const tableR = t.tableDiameter / 2;
  const chairR = t.chairRadius;
  const legTopRadius = tableR * 0.78;
  const legWidthTangentialHalfCm = 1.0; // half of dining.js's 2cm legWidthTangential
  const seamHalfGapDeg = (90 - t.chairBackSweep) / 2;
  const legHalfAngleDeg = (Math.atan2(legWidthTangentialHalfCm, legTopRadius) * 180) / Math.PI;
  const marginDeg = seamHalfGapDeg - legHalfAngleDeg;
  if (marginDeg < 0.3) {
    warnings.push('The seam gap (backSweep ' + t.chairBackSweep + '°, ' + seamHalfGapDeg.toFixed(1) + '° half-gap) is too narrow for the table leg (' + legHalfAngleDeg.toFixed(1) + '° half-width at its own radius) — lower the chair backSweep (try 84–86°) to open more room at each seam.');
  }
  if (legTopRadius > chairR) {
    warnings.push('Table leg tops (~' + legTopRadius.toFixed(0) + 'cm from centre) fall OUTSIDE the chairs’ own arc (radius ' + chairR + 'cm) — try a larger chair radius or a smaller table diameter, so the legs stay inside the nested cylinder.');
  }
  const tableUndersideCm = t.tableHeight - 2.8;
  if (t.chairHeight > tableUndersideCm - 1) {
    warnings.push('Chair height (' + t.chairHeight + 'cm) leaves under 1cm clearance below the table underside (~' + tableUndersideCm.toFixed(1) + 'cm) — lower the chair height or raise the table.');
  }
  if (t.chairBackSweep * 4 >= 360) {
    warnings.push('Chair backSweep (' + t.chairBackSweep + '°) leaves no seam gap at all for the table legs (4×' + t.chairBackSweep + ' ≥ 360°).');
  }
  return warnings;
}

// ============== Build the nested table + 4 chairs into one scene ==============
function buildDiningScene(t, group, THREE, ctx) {
  const Dining = window.__dining;
  if (!Dining) return;
  const detailOpt = { detail: t.detail === 'low' ? 'low' : 'full' };

  // "chair-alone": isolate one chair, facing the camera, no table and no
  // other chairs -- so its own shape can be checked without the other three
  // obscuring it (fix #7).
  if (t.chairAlone) {
    const chair = Dining.TYPES['dining-chair'].build(THREE, {
      radius: t.chairRadius, backSweep: t.chairBackSweep, height: t.chairHeight, seatHeight: t.chairSeatHeight,
      seatColor: t.chairColor, seatFinish: 'matte', legColor: t.chairColor, legFinish: 'matte'
    }, detailOpt);
    // Rotate 180 so its front (the wedge's point) faces the default camera,
    // the same "facing the viewer" convention every other single-item spec
    // page uses.
    chair.rotation.y = Math.PI;
    group.add(chair);
    return;
  }

  const table = Dining.TYPES['dining-table'].build(THREE, {
    width: t.tableDiameter, depth: t.tableDiameter, height: t.tableHeight,
    topColor: t.tableTopColor, topFinish: 'matte',
    legColor: t.legColor, legFinish: 'matte', frameHeight: t.tableFrameHeight
  }, detailOpt);
  // By the builder contract the table's own local frame has its BACK at
  // z=0 and its centre at z=+diameter/2 -- so placing the GROUP at the
  // nesting centre (as the chairs below do) requires shifting it back by
  // that radius, or the table renders half a diameter off the chair ring
  // (code review + visual review round 1, item 89769f2b, fix #3).
  table.position.z = -(t.tableDiameter / 2) * CM;
  group.add(table);

  // Four quadrant chairs, tucked at 90-degree rotations so their curved
  // backs together form the cylinder the table top overhangs -- see the
  // NESTING MATH note above the tweak defaults for the placement formula
  // this shares with scripts/test-dining.mjs. Both the table above and the
  // chairs here are centred on the SAME point (the group origin), so
  // `pulledOut` -- which only moves `placeDist`, the chairs' own radial
  // distance from that shared origin -- is already radial from the table's
  // true centre (fix #3's other half: keep this centre shared, not
  // re-derive a second one for the slider).
  const chairRadiusM = t.chairRadius / 100;
  const placeDist = chairRadiusM + t.pulledOut * PULL_OUT_MAX_M;
  for (let i = 0; i < 4; i++) {
    const theta = (i * Math.PI) / 2;
    const chair = Dining.TYPES['dining-chair'].build(THREE, {
      radius: t.chairRadius, backSweep: t.chairBackSweep, height: t.chairHeight, seatHeight: t.chairSeatHeight,
      seatColor: t.chairColor, seatFinish: 'matte', legColor: t.chairColor, legFinish: 'matte'
    }, detailOpt);
    chair.position.set(placeDist * Math.sin(theta), 0, placeDist * Math.cos(theta));
    chair.rotation.y = theta + Math.PI;
    group.add(chair);
  }
}

// ============== Copy-JSON: the furniture[] entries this preset implies ==============
function furnitureJSON(t) {
  const items = [
    {
      id: 'kitchen_dining_table', room: 'kitchen', type: 'dining-table',
      at: [0, 0], rotation: 0,
      params: {
        width: t.tableDiameter, depth: t.tableDiameter, height: t.tableHeight,
        topColor: t.tableTopColor, legColor: t.legColor, frameHeight: t.tableFrameHeight
      },
      notes: '`at` is this item\'s own LOCAL-FRAME origin (its back edge, per the builder contract), NOT its visual centre -- the table\'s round centre sits `diameter/2` in front of `at` along its own +z (unrotated: `at.y + diameter/2`). This spec page\'s own 3D view accounts for that offset when centring the table on the same point the 4 chairs ring; a house profile must do the same.'
    },
    {
      id: 'kitchen_dining_chair_1', room: 'kitchen', type: 'dining-chair',
      at: [0, 0], rotation: 0,
      params: {
        radius: t.chairRadius, backSweep: t.chairBackSweep, height: t.chairHeight,
        seatHeight: t.chairSeatHeight, seatColor: t.chairColor, legColor: t.chairColor
      },
      notes: 'Tucked (pulledOut=0) placement: 4 copies at rotation 0/90/180/270, each with `at` (its own back-arc centre, per the builder contract) on the ring of radius `radius` around the SAME centre the table above is centred on -- see dining.js and this spec\'s NESTING MATH note. Placement is out of this spec\'s scope; the house profile decides real `at`.'
    }
  ];
  return JSON.stringify(items, null, 2);
}

function CopyJSONButton({ t }) {
  const [copied, setCopied] = React.useState(false);
  const onClick = () => {
    const json = furnitureJSON(t);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 1500);
      });
    }
  };
  return (
    <button className="btn" onClick={onClick}>{copied ? 'Copied!' : 'Copy JSON'}</button>
  );
}

// ============== App ==============
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const diningReady = useDiningModule();

  const applyPreset = (name) => {
    const p = PRESETS[name];
    if (!p) return;
    setTweak(Object.assign({ preset: name }, p));
  };
  const warnings = t.chairAlone ? [] : collisionRisk(t);

  // OBJECTS: the whole set, or one chair on its own (the old "Chair alone"
  // toggle). The set's VARIANTS are its presets; the lone chair has none.
  const SET_VARIANT_LABELS = { 'nested-set': 'Tucked in', 'pulled-out': 'Pulled out', 'larger-table': 'Larger table' };
  const setVariants = Object.keys(SET_VARIANT_LABELS)
    .map(id => ({ id, label: SET_VARIANT_LABELS[id], params: PRESETS[id] }));

  return (
    <SpecPage objectId={t.chairAlone ? 'dining-chair' : 'dining-set'}
      onObject={id => applyPreset(id === 'dining-chair' ? 'chair-alone' : 'nested-set')}>
      {!t.chairAlone && <SpecVariants variants={setVariants} values={t} onSelect={applyPreset} />}

      <div className="row" style={{ marginBottom: 16 }}>
        <CopyJSONButton t={t} />
      </div>

      {t.chairAlone &&
        <div className="legend" style={{ marginBottom: 16 }}>
          <b>Dining chair</b> -- one dining-chair, no table, no other chairs. Pick "Dining set" above to see the nested set.
        </div>}

      {warnings.length > 0 &&
        <div className="legend" style={{ marginBottom: 16, color: '#a1441a' }}>
          <b>This size combination may recreate a collision:</b>
          <ul style={{ marginLeft: 16, marginTop: 4 }}>
            {warnings.map((w, i) => <li key={i}>{w}</li>)}
          </ul>
        </div>}

      <div className="grid">
        <div className="card">
          <h2>Numbers</h2>
          <table>
            <tbody>
              <tr><th>Feature</th><th className="num">value</th><th>Variability</th></tr>
              <tr><td>Table diameter</td><td className="num">{t.tableDiameter}</td><td>Round top + depth (kept equal)</td></tr>
              <tr><td>Table height</td><td className="num">{t.tableHeight}</td><td>Floor to tabletop</td></tr>
              <tr><td>Table frame height</td><td className="num">{t.tableFrameHeight}</td><td>Floor to the crossbar frame</td></tr>
              <tr><td>Chair radius</td><td className="num">{t.chairRadius}</td><td>Arc radius == depth; drives the nested cylinder's size</td></tr>
              <tr><td>Chair backSweep</td><td className="num">{t.chairBackSweep}&deg;</td><td><b>84 leaves seam gaps</b> for the table legs (4 &times; 84 = 336, a 6&deg; gap per seam)</td></tr>
              <tr><td>Chair seat height</td><td className="num">{t.chairSeatHeight}</td><td>Clamped below chair height</td></tr>
              <tr><td>Pulled out</td><td className="num">{(t.pulledOut * 45).toFixed(0)} cm</td><td>0 = tucked, 1 = +45cm radially</td></tr>
              <tr><td>Detail</td><td className="num">{t.detail}</td><td>Full or low triangle budget</td></tr>
            </tbody>
          </table>
          <div className="legend">
            <b>Copy JSON</b> copies the furniture[] entries this preset implies (table + one chair; repeat the chair per the placement note), ready to paste into a house profile and adjust placement for.
          </div>
          <pre className="json">{furnitureJSON(t)}</pre>
        </div>

        <div className="card full">
          <h2>3D — {t.chairAlone ? 'chair alone' : 'nesting dining set'}</h2>
          {!diningReady && <div className="legend">Loading src/furniture/dining.js…</div>}
          {diningReady &&
            <ThreeView
              t={t}
              buildModel={buildDiningScene}
              heightOf={tt => (tt.chairAlone ? tt.chairHeight : tt.tableHeight) * CM}
            />}
          <div className="legend">Drag to orbit, scroll to zoom. Use "Pulled out" to slide the 4 chairs out from the nested cylinder, or pick "Dining chair" above to isolate one.</div>
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Render" />
        <TweakRadio label="Detail" value={t.detail}
          options={[{ value: 'full', label: 'Full' }, { value: 'low', label: 'Low' }]}
          onChange={v => setTweak('detail', v)} />

        <TweakSection label="Table" />
        <TweakSlider label="Diameter" value={t.tableDiameter} min={70} max={160} step={2} unit="cm"
          onChange={v => setTweak('tableDiameter', v)} />
        <TweakSlider label="Height" value={t.tableHeight} min={65} max={80} step={1} unit="cm"
          onChange={v => setTweak('tableHeight', v)} />
        <TweakColor label="Top colour" value={t.tableTopColor}
          onChange={v => setTweak('tableTopColor', v)} />
        <TweakSlider label="Frame height" value={t.tableFrameHeight} min={10} max={35} step={1} unit="cm"
          onChange={v => setTweak('tableFrameHeight', v)} />
        <TweakColor label="Leg colour" value={t.legColor}
          onChange={v => setTweak('legColor', v)} />

        <TweakSection label="Chairs (×4, nested)" />
        <TweakSlider label="Radius" value={t.chairRadius} min={35} max={55} step={1} unit="cm"
          onChange={v => setTweak('chairRadius', v)} />
        <TweakSlider label="Back sweep" value={t.chairBackSweep} min={60} max={120} step={5} unit="deg"
          onChange={v => setTweak('chairBackSweep', v)} />
        <TweakSlider label="Height" value={t.chairHeight} min={55} max={71} step={1} unit="cm"
          onChange={v => setTweak('chairHeight', v)} />
        <TweakSlider label="Seat height" value={t.chairSeatHeight} min={45} max={58} step={1} unit="cm"
          onChange={v => setTweak('chairSeatHeight', v)} />
        <TweakColor label="Colour" value={t.chairColor}
          onChange={v => setTweak('chairColor', v)} />
        <TweakSlider label="Pulled out" value={t.pulledOut} min={0} max={1} step={0.05} unit=""
          onChange={v => setTweak('pulledOut', v)} />
      </TweaksPanel>
    </SpecPage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Standalone viewing (opened directly at a /w URL, no design-tool host):
// the shared TweaksPanel stays closed until it receives __activate_edit_mode.
// Self-post it so the panel is visible when there's no host driving it.
setTimeout(() => window.postMessage({ type: '__activate_edit_mode' }, '*'), 0);
</script>
</body>
</html>
