<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Radiators — Spec</title>
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { background:#f4f1ec; color:#1a1a1a; font-family:ui-monospace,'SF Mono',Menlo,monospace; padding:24px; }
  h1 { font-size:14px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; margin-bottom:4px; }
  .sub { font-size:11px; opacity:0.6; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
  .card { background:#fff; border:1px solid #d8d3c8; border-radius:6px; padding:20px; }
  .card h2 { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; opacity:0.7; margin-bottom:14px; }
  svg { display:block; width:100%; height:auto; }
  #c3d { width:100%; height:560px; display:block; background:#1a1a1c; border-radius:4px; }
  .legend { font-size:10px; line-height:1.6; margin-top:14px; opacity:0.75; }
  .full { grid-column:1 / -1; }
  table { width:100%; border-collapse:collapse; font-size:11px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid #ece8e0; }
  th { font-weight:600; opacity:0.6; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }

  /* ---- 2x2 corner picker: a clickable diagram, not a dropdown ---- */
  .corner-picker { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:6px;
    width:100%; max-width:220px; aspect-ratio:1; margin:0 auto; }
  .corner-btn { border:2px solid #d8d3c8; border-radius:6px; background:#f4f1ec; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:9px; text-transform:uppercase;
    letter-spacing:0.03em; color:#7a7266; transition:background .12s,border-color .12s,color .12s; padding:4px; text-align:center; }
  .corner-btn:hover { border-color:#a89c80; }
  .corner-btn.active { background:#1a1a1c; border-color:#1a1a1c; color:#fff; font-weight:600; }
  .corner-btn .dot { display:block; width:8px; height:8px; border-radius:50%; background:currentColor; margin:0 auto 4px; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Which objects this page holds (read by SpecPage in tweaks-panel.jsx and by
     scripts/test-spec-pages.mjs). -->
<script type="application/json" id="spec-manifest">
{
  "title": "Radiators",
  "description": "One design for every house radiator — a white compact panel radiator with vertical ribs, a smart valve on the END of the radiator at a chosen corner and the lockshield at the bottom of the other end, with an optional clip-on shelf or framed slatted box. Width/height/depth are ALWAYS the item's outer envelope (the body, the end-valve room and any cover); the body itself is bodyWidth/bodyHeight/bodyDepth. Pipes run down to the floor: pipeDrop, which the placer sets from the item's elevation. Defaults are the standard house radiator. Pick a variant (one per room) above, or use the Tweaks panel.",
  "objects": [
    { "id": "radiator", "label": "Radiator", "types": ["radiator"] }
  ]
}
</script>

<!-- React/ReactDOM/Babel/three served LOCALLY (../vendor/) — no CDN: this app must work on a LAN with no internet. React is the production build; Babel is required because the .jsx below is transpiled in-browser at runtime. -->
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../vendor/babel.min.js"></script>
<script src="../vendor/three.js"></script>
<!-- Shared harness: tweaks-panel.jsx (tweaks machinery) + reusable ThreeView -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="spec-three.jsx"></script>
<!-- src/furniture/radiator.js is plain ESM (also imported directly by
     scripts/test-furniture-radiator.mjs and, by the shared furniture
     contract, the live-scene furniture placer). This page has no import
     map, so bridge it onto `window` before the Babel script below runs —
     the module script and the classic scripts execute in source order, and
     a module script defers, so the `type="module"` tag runs after
     ../vendor/three.js but this bridge must resolve before the Babel
     <script> block reads window.FurnitureRadiator. The babel block is
     deferred too (`type="text/babel"` compiles to a module internally), so
     ordinary document order between the two script tags is enough — no
     polling needed. -->
<script type="module">
  import * as M from '../src/furniture/radiator.js';
  window.FurnitureRadiator = M;
</script>

<script type="text/babel">
/* =====================================================================
   RADIATOR SPEC   ·   one design for EVERY house radiator — a white compact
   panel radiator with VERTICAL ribs across the front, a slotted top grille
   and closed end caps, a smart thermostatic valve on the END of the radiator
   at a chosen corner, a lockshield at the bottom of the other end, and pipes
   dropping from both. Optional cover: a clip-on wooden shelf with a raised
   front lip, or a framed slatted box with dark gaps behind the slats.

   ── WIDTH/HEIGHT/DEPTH ARE THE WHOLE OUTER ENVELOPE ─────────────────────
   The house validator and the live-scene placer read these three params with
   no idea a body/valve/cover split exists, so they cover EVERYTHING: the
   body, the room both end valves need (18 cm together), any shelf overrun,
   the box. The default 98 x 60 x 12 envelope holds the standard 80 x 60
   body. The body's own size is bodyWidth/bodyHeight/bodyDepth (optional,
   snug by default, clamped inside any cover); bodyElevation lifts it inside
   the envelope (the floor-standing hallway box).

   The geometry builder lives in src/furniture/radiator.js (a pure ESM
   `build(THREE, params, opts)`, following the shared src/furniture/*
   contract), so the furniture placer imports the exact module this page
   tweaks. Its frame puts y=0 at the item's BOTTOM. `elevation` is NOT a
   params field (item 2bc314c9): a real placement sets the furniture ITEM's
   own top-level `elevation`. The Elevation slider here is a SPEC-PAGE-ONLY
   preview control that plays the placer role, and "Copy as furniture JSON"
   never emits it. Each preset carries the item elevation it is placed at,
   and applying a preset sets the slider to it.

   Harness: tweaks-panel.jsx (controls) + spec-three.jsx (ThreeView).
   ===================================================================== */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "width": 98,
  "height": 60,
  "depth": 12,
  "thickness": 10,
  "elevation": 17,
  "valveCorner": "bottom-right",
  "color": "#f4f4f1",
  "cover": "none",
  "coverColor": "#d9b27a",
  "bodyWidth": 80,
  "bodyHeight": 60,
  "bodyDepth": 12,
  "bodyElevation": 0,
  "shelfExtendLeft": 0,
  "shelfExtendRight": 0,
  "pipeDrop": 17,
  "boxKick": 8.4
}/*EDITMODE-END*/;

const CM = 0.01;
const CORNERS = ['top-left', 'top-right', 'bottom-left', 'bottom-right'];
const CORNER_LABEL = { 'top-left': 'Top left', 'top-right': 'Top right', 'bottom-left': 'Bottom left', 'bottom-right': 'Bottom right' };
const COVERS = ['none', 'shelf', 'box'];
const COVER_LABEL = { none: 'None', shelf: 'Clip-on shelf', box: 'Framed slatted box' };

// ============== 2x2 corner picker — a clickable diagram, not a dropdown =====
// Grid order top-left, top-right, bottom-left, bottom-right (CSS grid reads
// row-major, so this literally lays out as a 2x2 square matching the wall).
function CornerPicker({ value, onChange }) {
  const order = ['top-left', 'top-right', 'bottom-left', 'bottom-right'];
  return (
    <div className="corner-picker" role="radiogroup" aria-label="Valve corner">
      {order.map(c => (
        <button key={c} type="button" role="radio" aria-checked={c === value}
          className={'corner-btn' + (c === value ? ' active' : '')}
          onClick={() => onChange(c)}>
          <span>
            <span className="dot"></span>
            {CORNER_LABEL[c]}
          </span>
        </button>
      ))}
    </div>
  );
}

// ============== Front elevation SVG (looking at the wall) ===================
// Drawn from the module's own layout() -- the same numbers build() uses -- so
// the diagram and the 3D view can never disagree about where anything is.
function FrontElevation({ t }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const svg = ref.current;
    if (!svg || !window.FurnitureRadiator) return;
    svg.innerHTML = '';
    const ns = 'http://www.w3.org/2000/svg';
    const W = 440, H = 330;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const L = window.FurnitureRadiator.layout(t);
    const b = L.body;
    const margin = 56;
    const SCALE = Math.min((W - 2 * margin) / L.W, (H - 2 * margin - 30) / (L.H + t.elevation));
    const midX = W / 2, baseY = H - 52;
    const px = x => midX + x * SCALE;
    const py = y => baseY - (t.elevation + y) * SCALE; // local y, lifted by the preview elevation

    const el = (tag, attrs) => {
      const e = document.createElementNS(ns, tag);
      Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k]));
      svg.appendChild(e);
      return e;
    };
    const rect = (x0, y0, x1, y1, fill, stroke, sw) => el('rect', {
      x: px(Math.min(x0, x1)), y: py(Math.max(y0, y1)), width: Math.abs(x1 - x0) * SCALE, height: Math.abs(y1 - y0) * SCALE,
      fill: fill || 'none', stroke: stroke || 'none', 'stroke-width': sw || 1 });
    const line = (x1, y1, x2, y2, stroke, w) => el('line', { x1, y1, x2, y2, stroke, 'stroke-width': w || 1 });
    const txt = (x, y, s, o = {}) => { const e = el('text', { x, y, 'font-size': o.size || 10, fill: o.color || '#444', 'text-anchor': o.anchor || 'start' }); e.textContent = s; };

    line(margin - 10, baseY, W - margin + 10, baseY, '#a89c80', 3);
    txt(margin - 10, baseY + 14, 'floor', { color: '#a89c80', size: 9 });

    // the envelope, dashed: what the placer and the validator see
    el('rect', { x: px(-L.W / 2), y: py(L.H), width: L.W * SCALE, height: L.H * SCALE,
      fill: 'none', stroke: '#b9b1a0', 'stroke-width': 1, 'stroke-dasharray': '4 3' });

    const bodyFill = t.color || '#f4f4f1';
    if (L.cover !== 'box') {
      // pipes, then valves, then the body with its vertical ribs
      const pipe = (x, y) => rect(x - 0.75, -L.pipeDrop, x + 0.75, y, '#f7f7f5', '#999', 0.8);
      const trvLeft = L.valveSide === 'left';
      const trvEnd = trvLeft ? b.x0 : b.x1, lsEnd = trvLeft ? b.x1 : b.x0, d1 = trvLeft ? -1 : 1;
      pipe(trvEnd + d1 * 1, L.trvY);
      pipe(lsEnd - d1 * 1, L.lockshieldY);
      rect(trvEnd, L.trvY - 1.1, trvEnd + d1 * 2.5, L.trvY + 1.1, '#c9ccd0', '#888', 0.8);
      rect(trvEnd + d1 * 2.5, L.trvY - 2.95, trvEnd + d1 * 12, L.trvY + 2.95, '#ffffff', '#8a6a1a', 1.2);
      rect(lsEnd, L.lockshieldY - 0.9, lsEnd - d1 * 1.9, L.lockshieldY + 0.9, '#c9ccd0', '#888', 0.8);
      rect(lsEnd - d1 * 1.9, L.lockshieldY - 1.5, lsEnd - d1 * 5.9, L.lockshieldY + 1.5, '#ffffff', '#888', 1);
      rect(b.x0, b.y0, b.x1, b.y1, bodyFill, '#333', 1.5);
      const ribs = Math.min(24, Math.round((b.width - 1.6) / 5));
      for (let i = 0; i <= ribs; i++) {
        const x = b.x0 + 0.8 + ((b.width - 1.6) * i) / Math.max(1, ribs);
        line(px(x), py(b.y0 + 1), px(x), py(b.y1 - 1), '#c8c8c4', 1);
      }
      line(px(b.x0), py(b.y1 - 0.45), px(b.x1), py(b.y1 - 0.45), '#999', 1); // top grille edge
      // labels sit beside the envelope, level with each valve, with a leader
      const envEdge = side => px(side < 0 ? -L.W / 2 : L.W / 2);
      const label = (side, y, text, color) => {
        const ex = envEdge(side), tx = ex + side * 6;
        line(ex, py(y), tx - side * 1, py(y), color, 0.8);
        txt(tx, py(y) + 3, text, { anchor: side < 0 ? 'end' : 'start', size: 8, color });
      };
      label(d1, L.trvY, 'smart valve', '#8a6a1a');
      label(-d1, L.lockshieldY, 'lockshield', '#888');
    }
    if (L.cover === 'shelf' && L.shelf) {
      const wood = t.coverColor || '#d9b27a';
      rect(L.shelf.x0, b.y1 + 0.3, L.shelf.x1, b.y1 + 2.1, wood, '#8a6a1a', 1);
      rect(L.shelf.x0, b.y1 + 2.1, L.shelf.x1, b.y1 + 3.6, wood, '#8a6a1a', 1);
      txt(midX, py(b.y1 + 3.6) - 5, 'clip-on shelf, raised front lip', { anchor: 'middle', size: 8, color: '#8a6a1a' });
    }
    if (L.cover === 'box' && L.box) {
      const X = L.box, white = (t.coverColor && t.coverColor !== '#d9b27a') ? t.coverColor : '#f6f6f3';
      rect(-X.innerX - 1, X.kick + X.bottomRail / 2, X.innerX + 1, L.H - 2, '#3a3a3a', 'none');
      rect(-X.xo, 0, -X.innerX, L.H - 2, white, '#999', 1);
      rect(X.innerX, 0, X.xo, L.H - 2, white, '#999', 1);
      rect(-X.innerX, X.panelY1, X.innerX, L.H - 2 - X.slot, white, '#999', 1);
      rect(-X.innerX, X.kick, X.innerX, X.panelY0, white, '#999', 1);
      const pitch = X.panelW / X.slats;
      for (let i = 0; i < X.slats; i++) {
        const x = -X.innerX + pitch * (i + 0.5);
        rect(x - pitch * 0.29, X.panelY0, x + pitch * 0.29, X.panelY1, white, '#bbb', 0.6);
      }
      rect(-L.W / 2, L.H - 2, L.W / 2, L.H, white, '#999', 1);
      // the radiator inside, dashed
      el('rect', { x: px(b.x0), y: py(b.y1), width: b.width * SCALE, height: b.height * SCALE,
        fill: 'none', stroke: '#e2b23c', 'stroke-width': 1, 'stroke-dasharray': '3 3' });
      txt(px(X.xo) + 4, py(L.H / 2), 'box', { size: 8, color: '#999' });
    }

    // elevation dimension (preview only)
    line(px(-L.W / 2) - 16, baseY, px(-L.W / 2) - 16, py(0), '#999', 1);
    txt(px(-L.W / 2) - 20, (baseY + py(0)) / 2, `${t.elevation}`, { anchor: 'end', size: 9, color: '#666' });
    // envelope width
    const dimY = baseY + 20;
    line(px(-L.W / 2), dimY, px(L.W / 2), dimY, '#999', 1);
    line(px(-L.W / 2), dimY - 4, px(-L.W / 2), dimY + 4, '#999', 1);
    line(px(L.W / 2), dimY - 4, px(L.W / 2), dimY + 4, '#999', 1);
    txt(midX, dimY + 14, `envelope ${L.W} cm (body ${Math.round(b.width * 10) / 10} cm)`, { anchor: 'middle', color: '#666', size: 10 });
    txt(12, 18, 'Front elevation (looking at the wall)', { size: 12, color: '#333' });
  }, [t]);
  return <svg ref={ref}></svg>;
}

// ============== Radiator model bridge (delegates to src/furniture/radiator.js) ==
// This page plays the PLACER role for its own preview: the module's own
// frame puts y=0 at the radiator's bottom (not the floor), so the elevation
// offset — which a real placer would apply when positioning the item in a
// room — is applied HERE, on the wrapper group, not inside the module.
function buildRadiatorModel(t, group, THREE) {
  const built = window.FurnitureRadiator.build(THREE, {
    width: t.width, height: t.height, depth: t.depth, thickness: t.thickness,
    valveCorner: t.valveCorner, color: t.color, cover: t.cover, coverColor: t.coverColor,
    bodyWidth: t.bodyWidth, bodyHeight: t.bodyHeight, bodyDepth: t.bodyDepth,
    bodyElevation: t.bodyElevation, shelfExtendLeft: t.shelfExtendLeft, shelfExtendRight: t.shelfExtendRight,
    pipeDrop: t.pipeDrop, boxKick: t.boxKick,
  }, { detail: 'full' });
  built.position.y = t.elevation * CM; // PLACER concern — module leaves y=0 at its own bottom
  group.add(built);

  // A small reference wall behind it, so the standoff/gap and elevation read
  // clearly in the 3D view (the module's own origin is the wall plane, this
  // wrapper's floor is y=0 same as the module's z=0 wall plane). width/
  // height are ALWAYS the outer envelope now, cover or not, so no
  // cover-awareness is needed here any more.
  const wallW = (t.width + 60) * CM, wallH = (t.elevation + t.height + 60) * CM;
  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(wallW, wallH, 0.06),
    new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 1 })
  );
  wall.name = 'referenceWall';
  wall.position.set(0, wallH / 2, -0.03);
  wall.receiveShadow = true;
  wall.userData.specBackdrop = 'wall'; // the house's own finish (spec-three.jsx (D))
  group.add(wall);

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(wallW, 1.4),
    new THREE.MeshStandardMaterial({ color: 0x1e1e20, roughness: 1 })
  );
  floor.name = 'floor';
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(0, 0, 0.65);
  floor.receiveShadow = true;
  floor.userData.specBackdrop = 'floor'; // the house's own finish (spec-three.jsx (D))
  group.add(floor);
}

// ============== "Copy as furniture JSON" — {type, params}, DEFAULTS-diffed =
// Emits only the keys that differ from DEFAULTS, per the shared furniture
// contract, so a placed item's JSON stays small and forward-compatible with
// a future DEFAULTS change.
function furnitureJSON(t) {
  const D = window.FurnitureRadiator ? window.FurnitureRadiator.DEFAULTS : TWEAK_DEFAULTS;
  const TYPE = window.FurnitureRadiator ? window.FurnitureRadiator.TYPE : 'radiator';
  const params = {};
  for (const key of Object.keys(D)) {
    if (t[key] !== undefined && t[key] !== D[key]) params[key] = t[key];
  }
  // bodyWidth/bodyHeight/bodyDepth are intentionally absent from DEFAULTS
  // (the snug body depends on the envelope, the valve room and the cover —
  // see layout() in the module), so they need their own diff: only emit
  // them when they differ from the snug fit the module would derive anyway.
  // pipeDrop is DERIVED by the placer from the item's elevation when absent
  // (src/furniture.js itemParams), so it is emitted only when it differs
  // from the elevation previewed here -- including an explicit 0 at a
  // non-zero elevation, which the placer would otherwise replace.
  if (t.pipeDrop === t.elevation) delete params.pipeDrop;
  else params.pipeDrop = t.pipeDrop;
  // boxKick is absent from DEFAULTS too (its default is a proportion of the
  // height): emitted only for a box cover, and only when it differs from
  // that default.
  if (t.cover === 'box' && typeof t.boxKick === 'number' && Math.abs(t.boxKick - Math.min(12, 0.14 * t.height)) > 1e-6) params.boxKick = t.boxKick;
  if (window.FurnitureRadiator) {
    const snug = window.FurnitureRadiator.bodyEnvelope(Object.assign({}, D, t, { bodyWidth: undefined, bodyHeight: undefined, bodyDepth: undefined }));
    const differs = (a, b) => Math.abs(a - b) > 1e-6;
    if (t.bodyWidth !== undefined && differs(t.bodyWidth, snug.width)) params.bodyWidth = t.bodyWidth;
    if (t.bodyHeight !== undefined && differs(t.bodyHeight, snug.height)) params.bodyHeight = t.bodyHeight;
    if (t.bodyDepth !== undefined && differs(t.bodyDepth, snug.depth)) params.bodyDepth = t.bodyDepth;
  }
  return { type: TYPE, params };
}

function CopyJSONButton({ t }) {
  const [copied, setCopied] = React.useState(false);
  const onClick = () => {
    const json = JSON.stringify(furnitureJSON(t), null, 2);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(
        () => { setCopied(true); setTimeout(() => setCopied(false), 1500); },
        () => window.prompt('Copy this furniture JSON:', json)
      );
    } else {
      window.prompt('Copy this furniture JSON:', json);
    }
  };
  return <TweakButton label={copied ? 'Copied!' : 'Copy as furniture JSON'} onClick={onClick} />;
}

// ============== App ==============
// Applying a preset resets the BODY size to a SNUG fit against whatever
// width/height/depth (the envelope) the preset sets, unless the preset
// itself overrides bodyWidth/bodyHeight/bodyDepth (as the hallway-scale
// preset does) — otherwise switching presets could leave a stale body size
// from a PREVIOUSLY-applied preset.
function applyPreset(setTweak, params) {
  // A preset's item elevation sits beside its params (it is not a param);
  // find it by the params object itself, so any caller passing p.params works.
  const owner = window.FurnitureRadiator && window.FurnitureRadiator.PRESETS.find(p => p.params === params);
  if (owner && typeof owner.elevation === 'number') setTweak('elevation', owner.elevation);
  const merged = Object.assign({ width: 98, height: 60, depth: 12 }, params);
  const snug = window.FurnitureRadiator
    ? window.FurnitureRadiator.bodyEnvelope(Object.assign({ bodyWidth: undefined, bodyHeight: undefined, bodyDepth: undefined, cover: 'none' }, merged))
    : { width: merged.width, height: merged.height, depth: merged.depth };
  setTweak('bodyWidth', params.bodyWidth !== undefined ? params.bodyWidth : snug.width);
  setTweak('bodyHeight', params.bodyHeight !== undefined ? params.bodyHeight : snug.height);
  setTweak('bodyDepth', params.bodyDepth !== undefined ? params.bodyDepth : snug.depth);
  Object.keys(params).forEach(k => setTweak(k, params[k]));
}

// The presets are this radiator's VARIANTS (one per room), picked from the
// shared picker bar. Each carries a full param set, so it matches on all of
// them; only the colours are left as you set them. `params` is passed through
// as the SAME object, which is how applyPreset finds the preset's elevation.
const radiatorVariantId = name => name.split(':')[0].toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function radiatorVariants() {
  const PRESETS = window.FurnitureRadiator ? window.FurnitureRadiator.PRESETS : [];
  return PRESETS.map(p => ({ id: radiatorVariantId(p.name), label: p.name, params: p.params }));
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const bodyEnv = window.FurnitureRadiator ? window.FurnitureRadiator.bodyEnvelope(t) : { width: t.width, height: t.height, depth: t.depth };
  // The TRUE BUILT thickness and wall gap — matching build()'s own internal
  // clamp exactly (round-4 nit: this table used to show the raw slider's
  // thickness and an unclamped, possibly-negative wall gap, disagreeing
  // with what actually got built once a tight cover clamped bodyEnv.depth
  // below the requested thickness). thickness can never exceed the body's
  // own depth it has to fit inside; the gap is never negative.
  const builtThickness = Math.min(t.thickness, bodyEnv.depth);
  const wallGapRaw = window.FurnitureRadiator ? window.FurnitureRadiator.wallGapOf(bodyEnv.depth, builtThickness) : (bodyEnv.depth - builtThickness);
  // Rounded to 1 decimal place for display only — the raw subtraction can
  // carry ordinary floating-point noise (e.g. 1.4000000000000004 on a
  // clamped box cover), which is not a real fractional wall gap, just an
  // artefact of the arithmetic.
  const wallGap = Math.round(Math.max(0, wallGapRaw) * 10) / 10;
  return (
    <SpecPage>
      <SpecVariants variants={radiatorVariants()} values={t}
        onSelect={id => applyPreset(setTweak, radiatorVariants().find(v => v.id === id).params)} />

      <div className="grid">
        <div className="card">
          <h2>Front elevation</h2>
          <FrontElevation t={t} />
          <div className="legend">
            The <b>smart valve</b> sits on the end of the radiator at the chosen corner, pointing outward along the wall; the <b>lockshield</b> sits at the bottom of the other end. Pipes drop from both. The dashed rectangle is the envelope (width x height x depth): everything is built inside it, so it is what the placer and the house validator see. Inside a box cover the radiator is drawn dashed.
          </div>
        </div>

        <div className="card">
          <h2>Numbers</h2>
          <table>
            <tbody>
              <tr><th>Feature</th><th className="num">value</th><th>Variability</th></tr>
              <tr><td>Width (outer envelope)</td><td className="num">{t.width}</td><td><b>Variable</b> — per room; the body plus 18 cm of end-valve room, or the box</td></tr>
              <tr><td>Height (outer envelope)</td><td className="num">{t.height}</td><td>Per room; includes any cover</td></tr>
              <tr><td>Depth (outer envelope)</td><td className="num">{t.depth}</td><td>Wall face to the outermost front face; includes any cover</td></tr>
              <tr><td>Body width / height / depth</td><td className="num">{bodyEnv.width} × {bodyEnv.height} × {bodyEnv.depth}</td><td><b>Variable</b> — the radiator itself; snug-fits the envelope by default</td></tr>
              <tr><td>Thickness (body slab depth, as built)</td><td className="num">{builtThickness}</td><td>{builtThickness !== t.thickness ? `Clamped down from the requested ${t.thickness}cm — the body's own depth can't fit more` : "The radiator's own slab depth"}</td></tr>
              <tr><td>Wall gap (derived)</td><td className="num">{wallGap}</td><td>= body depth − thickness</td></tr>
              <tr><td>Body elevation (inside the envelope)</td><td className="num">{t.bodyElevation}</td><td>0 on a wall-hung radiator; 17 inside the floor-standing hallway box</td></tr>
              <tr><td>Shelf overrun left / right</td><td className="num">{t.shelfExtendLeft} / {t.shelfExtendRight}</td><td>How far a clip-on shelf runs past each end (shelf cover only)</td></tr>
              <tr><td>Elevation (floor to bottom edge)</td><td className="num">{t.elevation}</td><td>Spec-page preview only — not an authorable param; a real placement sets the furniture item's own `elevation` field</td></tr>
              <tr><td>Valve corner</td><td className="num">{CORNER_LABEL[t.valveCorner]}</td><td><b>Variable</b> — one of 4 corners, visual picker; the valve sits on that corner's END</td></tr>
              <tr><td>Colour</td><td className="num"><span style={{ display:'inline-block', width:11, height:11, borderRadius:2, background:t.color, border:'1px solid rgba(0,0,0,.2)', verticalAlign:'middle' }}></span></td><td>Default white</td></tr>
              <tr><td>Cover</td><td className="num">{COVER_LABEL[t.cover]}</td><td><b>Variable</b> — none, clip-on shelf with a raised lip, or framed slatted box</td></tr>
            </tbody>
          </table>
        </div>

        <div className="card full">
          <h2>3D — radiator on the wall</h2>
          <ThreeView
            t={t}
            buildModel={buildRadiatorModel}
            heightOf={tt => (tt.elevation + tt.height) * CM}
          />
          <div className="legend">The furniture module's own origin is the wall plane with y=0 at the item's bottom edge; this page (playing the placer role) offsets it up by the elevation. The body's back sits at the wall-gap distance from the (dark) reference wall, the wall brackets visibly bridge the gap, and — with a cover present — the enclosure fills the declared width/height/depth while the radiator body can be smaller inside it (see the Hallway preset, a 50-wide radiator hanging 17 cm up inside a 75x92 box). The pipes continue below the item's bottom by pipeDrop, down to the floor.</div>
        </div>

        <div className="card full">
          <h2>Valve corner</h2>
          <CornerPicker value={t.valveCorner} onChange={v => setTweak('valveCorner', v)} />
        </div>

        <div className="card full">
          <h2>Export</h2>
          <CopyJSONButton t={t} />
          <div className="legend">Emits <code>{'{type, params}'}</code> with only the keys that differ from this module's DEFAULTS — the shape the furniture placer (item 78f2b614) expects.</div>
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Size — outer envelope (always includes any cover)" />
        <TweakSlider label="Width (outer envelope)" value={t.width} min={40} max={200} step={1} unit="cm"
          onChange={v => setTweak('width', v)} />
        <TweakSlider label="Height (outer envelope)" value={t.height} min={30} max={160} step={0.1} unit="cm"
          onChange={v => setTweak('height', v)} />
        <TweakSlider label="Depth (outer envelope, wall to front)" value={t.depth} min={8} max={40} step={0.5} unit="cm"
          onChange={v => setTweak('depth', v)} />

        <TweakSection label="Radiator body — can be smaller than the envelope" />
        <TweakSlider label="Body width" value={t.bodyWidth} min={30} max={t.width} step={1} unit="cm"
          onChange={v => setTweak('bodyWidth', v)} />
        <TweakSlider label="Body height" value={t.bodyHeight} min={20} max={t.height} step={1} unit="cm"
          onChange={v => setTweak('bodyHeight', v)} />
        <TweakSlider label="Body depth" value={t.bodyDepth} min={6} max={t.depth} step={0.5} unit="cm"
          onChange={v => setTweak('bodyDepth', v)} />
        <TweakSlider label="Thickness (body slab depth)" value={t.thickness} min={4} max={20} step={0.5} unit="cm"
          onChange={v => setTweak('thickness', v)} />
        <TweakSlider label="Body elevation (inside the envelope)" value={t.bodyElevation} min={0} max={40} step={1} unit="cm"
          onChange={v => setTweak('bodyElevation', v)} />
        <TweakRow label="Wall gap (derived)">
          <span style={{ fontSize: 11 }}>{wallGap} cm</span>
        </TweakRow>

        <TweakSection label="Position (preview only — not an authorable param)" />
        <TweakSlider label="Elevation (floor to bottom edge)" value={t.elevation} min={0} max={60} step={1} unit="cm"
          onChange={v => { setTweak('elevation', v); setTweak('pipeDrop', v); }} />

        <TweakSection label="Valve corner" />
        <TweakRadio label="Corner" value={t.valveCorner} options={CORNERS.map(c => ({ value: c, label: CORNER_LABEL[c] }))}
          onChange={v => setTweak('valveCorner', v)} />

        <TweakSection label="Colour" />
        <TweakColor label="Panel colour" value={t.color}
          onChange={v => setTweak('color', v)} />

        <TweakSection label="Cover" />
        <TweakRadio label="Cover" value={t.cover} options={COVERS.map(c => ({ value: c, label: COVER_LABEL[c] }))}
          onChange={v => setTweak('cover', v)} />
        <TweakColor label="Cover colour" value={t.coverColor}
          onChange={v => setTweak('coverColor', v)} />
        <TweakSlider label="Shelf overrun left" value={t.shelfExtendLeft} min={0} max={30} step={0.5} unit="cm"
          onChange={v => setTweak('shelfExtendLeft', v)} />
        <TweakSlider label="Shelf overrun right" value={t.shelfExtendRight} min={0} max={30} step={0.5} unit="cm"
          onChange={v => setTweak('shelfExtendRight', v)} />
        <TweakSlider label="Box kick-out (floor gap; 0 = to the floor)" value={t.boxKick} min={0} max={20} step={0.5} unit="cm"
          onChange={v => setTweak('boxKick', v)} />
      </TweaksPanel>
    </SpecPage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Standalone viewing (opened directly at a /w URL, no design-tool host):
// the shared TweaksPanel stays closed until it receives __activate_edit_mode.
// Self-post it so the panel is visible when there's no host driving it.
setTimeout(() => window.postMessage({ type: '__activate_edit_mode' }, '*'), 0);
</script>
</body>
</html>
