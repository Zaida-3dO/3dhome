<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Door Spec — Tweakable</title>
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { background:#f4f1ec; color:#1a1a1a; font-family:ui-monospace,'SF Mono',Menlo,monospace; padding:24px; }
  h1 { font-size:14px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; margin-bottom:4px; }
  .sub { font-size:11px; opacity:0.6; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
  .card { background:#fff; border:1px solid #d8d3c8; border-radius:6px; padding:20px; }
  .card h2 { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; opacity:0.7; margin-bottom:14px; }
  svg { display:block; width:100%; height:auto; }
  #c3d { width:100%; height:560px; display:block; background:#1a1a1c; border-radius:4px; }
  .legend { font-size:10px; line-height:1.6; margin-top:14px; opacity:0.75; }
  .row { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .btn { padding:6px 10px; font:inherit; font-size:10px; background:#1a1a1c; color:#fff; border:none; border-radius:4px; cursor:pointer; }
  .btn:hover { background:#333; }
  .btn.active { background:#6b5d4a; }
  .full { grid-column:1 / -1; }
  table { width:100%; border-collapse:collapse; font-size:11px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid #ece8e0; }
  th { font-weight:600; opacity:0.6; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<div id="root"></div>

<!-- React/ReactDOM/Babel/three served LOCALLY (../vendor/) — no CDN: this app must work on a LAN with no internet. React is the production build; Babel is required because the .jsx below is transpiled in-browser at runtime. -->
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../vendor/babel.min.js"></script>
<script src="../vendor/three.js"></script>
<!-- Shared harness: tweaks-panel.jsx (tweaks machinery) + reusable ThreeView -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="spec-three.jsx"></script>

<script type="text/babel">
/* =====================================================================
   DOOR SPEC   ·   reference implementation of the shared spec harness

   ── DIMENSIONS ARE ILLUSTRATIVE ──────────────────────────────────────
   Every dimension below is a DEFAULT, not a survey. They are ordinary
   UK-joinery sizes chosen so the page renders something sensible on
   first load. This is a design reference for modelling a fixture, not a
   record of any particular building: measure your own opening and drive
   the geometry from the Tweaks panel.
   ─────────────────────────────────────────────────────────────────────

   This document specifies a complete DOOR ASSEMBLY. Anywhere you see
   the word "door" in this file (filename, headings, comments, scene
   nodes), it refers to the assembly as a whole — NOT just the slab.

   The door assembly includes:
     1. Slab          — the moving panel itself (with its panel grooves)
     2. Handle(s)     — chrome rosette + lever, mirrored on both faces
     3. Hinges        — the pivot mechanism on one vertical edge
     4. Frame         — jambs + head wrapping the rough opening
     5. Open/close    — the kinematics: pivot axis, swing direction,
                        max swing angle, and the controls that drive them

   Anything in this file that is NOT part of the assembly:
     • The WALL is reference geometry only. It exists to show how a
       hole must be cut in a wall to receive this assembly. When using
       this spec to add a door to an existing house, REUSE the wall you
       already have and only insert the door assembly into the cutout.

   The tweaks panel + ThreeView boilerplate live in the shared harness
   (spec-harness.jsx + spec-three.jsx). This file only supplies the
   door-specific TWEAK_DEFAULTS, buildModel(), animate(), cross-section.
   ===================================================================== */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "openPct": 0,
  "hingeFront": false,
  "doorHeight": 198,
  "doorThickness": 4,
  "grooveHeight": 1,
  "grooveDepth": 0.1,
  "panelCount": 5,
  "wallThickness": 10,
  "wallWidth": 150,
  "wallHeight": 250,
  "doorWidth": 84
}/*EDITMODE-END*/;

// ============== Cross-section SVG ==============
function CrossSection({ t }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const svg = ref.current;
    if (!svg) return;
    svg.innerHTML = '';
    const ns = 'http://www.w3.org/2000/svg';
    const W = 560, H = 220;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

    const DOOR_W = t.doorWidth;
    const DOOR_T = t.doorThickness;
    const WALL_W = t.wallWidth;
    const WALL_T = t.wallThickness;

    const margin = 30;
    const SCALE = (W - 2 * margin) / WALL_W;

    function pp(x, y) {
      const ox = W * 0.5, oy = H * 0.5;
      return [ox + x * SCALE, oy + y * SCALE];
    }
    function rect(x1, y1, x2, y2, fill, stroke = '#888') {
      const r = document.createElementNS(ns, 'rect');
      const [a,b] = pp(x1,y1), [c,d] = pp(x2,y2);
      r.setAttribute('x', Math.min(a,c)); r.setAttribute('y', Math.min(b,d));
      r.setAttribute('width', Math.abs(c-a)); r.setAttribute('height', Math.abs(d-b));
      r.setAttribute('fill', fill); r.setAttribute('stroke', stroke);
      return r;
    }
    function txt(x_cm, y_cm, str, opts = {}) {
      const tt = document.createElementNS(ns, 'text');
      const [x,y] = pp(x_cm, y_cm);
      tt.setAttribute('x', x); tt.setAttribute('y', y);
      tt.setAttribute('font-size', opts.size || '10');
      tt.setAttribute('fill', opts.color || '#333');
      if (opts.anchor) tt.setAttribute('text-anchor', opts.anchor);
      tt.textContent = str;
      return tt;
    }

    const REVEAL = 8.5;
    const HINGE_THK = 14.3;
    const openingHalfW = DOOR_W/2 + REVEAL;
    svg.appendChild(rect(-WALL_W/2, -WALL_T/2, -openingHalfW, +WALL_T/2, '#e8e2d4', '#a89c80'));
    svg.appendChild(rect(+openingHalfW, -WALL_T/2, +WALL_W/2, +WALL_T/2, '#e8e2d4', '#a89c80'));

    svg.appendChild(rect(-openingHalfW, -HINGE_THK/2, -DOOR_W/2, +HINGE_THK/2, '#f1ede2', '#a89c80'));
    svg.appendChild(rect(+DOOR_W/2, -HINGE_THK/2, +openingHalfW, +HINGE_THK/2, '#f1ede2', '#a89c80'));

    svg.appendChild(rect(-DOOR_W/2, -DOOR_T/2, +DOOR_W/2, +DOOR_T/2, '#f6f5f1', '#888'));

    svg.appendChild(txt(0, DOOR_T/2 + 1.6, `door ${DOOR_W.toFixed(1)} cm`, { anchor:'middle', color:'#444' }));
    svg.appendChild(txt(DOOR_W/2 + 0.4, -DOOR_T/2 - 0.6, `${DOOR_T.toFixed(2)} cm`, { color:'#444', size:'9' }));
    const reveal_lbl = REVEAL;
    svg.appendChild(txt(-(DOOR_W/2 + reveal_lbl/2), -HINGE_THK/2 - 0.6, `${reveal_lbl.toFixed(1)}`, { anchor:'middle', color:'#666', size:'9' }));
    svg.appendChild(txt(+(DOOR_W/2 + reveal_lbl/2), -HINGE_THK/2 - 0.6, `${reveal_lbl.toFixed(1)}`, { anchor:'middle', color:'#666', size:'9' }));
    svg.appendChild(txt(WALL_W/2 + 0.6, 0.1, `${WALL_T.toFixed(2)} cm`, { color:'#666', size:'9' }));

    const head = document.createElementNS(ns, 'text');
    head.setAttribute('x', 12); head.setAttribute('y', 22);
    head.setAttribute('font-size', '12'); head.setAttribute('fill', '#333');
    head.textContent = `Top-down — wall ${WALL_W} cm with door cutout`;
    svg.appendChild(head);
  }, [t]);

  return <svg ref={ref}></svg>;
}

// ============== Door model (buildModel + kinematics) ==============
// Injected into the shared ThreeView. `ctx` persists across frames so
// the animate loop can lerp the pivot toward the open angle.
function buildDoor(t, group, THREE, ctx) {
  const cm = 0.01;
  const DH = t.doorHeight * cm;
  const DW = t.doorWidth * cm;
  const DT = t.doorThickness * cm;
  const WALL = t.wallThickness * cm;
  const WALL_W = t.wallWidth * cm;
  const WALL_H = t.wallHeight * cm;

  const slabMat   = new THREE.MeshStandardMaterial({ color:0xf6f5f1, roughness:0.55 });
  const grooveMat = new THREE.MeshStandardMaterial({ color:0xb8b3a8, roughness:0.85 });
  const chromeMat = new THREE.MeshStandardMaterial({ color:0xeef0f2, roughness:0.18, metalness:0.95 });

  // ---- DOOR ASSEMBLY · root group ----
  const doorAssembly = new THREE.Group();
  doorAssembly.name = 'doorAssembly';
  group.add(doorAssembly);

  // ---- slab + open/close kinematics ----
  const hingeFront = !!t.hingeFront;
  const hingeZ = hingeFront ? +DT/2 : -DT/2;
  const doorPivot = new THREE.Group();
  doorPivot.name = 'doorPivot';
  doorPivot.position.set(-DW/2, 0, hingeZ);
  doorAssembly.add(doorPivot);

  const slab = new THREE.Mesh(new THREE.BoxGeometry(DW, DH, DT), slabMat);
  slab.name = 'doorSlab';
  slab.position.set(DW/2, DH/2, -hingeZ);
  slab.castShadow = true; slab.receiveShadow = true;
  doorPivot.add(slab);

  const grH = t.grooveHeight * cm;
  const grD = t.grooveDepth * cm;
  const grInset = 1.5 * cm;
  const N = Math.max(2, t.panelCount|0);
  const sectionH = DH / N;
  for (let i = 1; i < N; i++) {
    const cy = sectionH * i;
    for (const sgn of [+1, -1]) {
      const g = new THREE.Mesh(
        new THREE.BoxGeometry(DW - grInset*2, grH, Math.max(grD*1.2, 0.0008)),
        grooveMat
      );
      g.position.set(DW/2, cy, -hingeZ + sgn * (DT/2 - grD/2));
      doorPivot.add(g);
    }
  }

  // ---- handles (mirrored on both faces) ----
  const ROSETTE_D    = 5.0  * cm;
  const ROSETTE_THK  = 0.8  * cm;
  const STEM_LEN     = 1.6  * cm;
  const STEM_SIDE    = 2.2  * cm;
  const LEVER_LEN    = 13.0 * cm;
  const LEVER_SIDE   = 1.8  * cm;

  const middlePanelIdx = Math.floor(N / 2);
  const handleY = (middlePanelIdx + 0.5) * sectionH;
  const handleX = DW - 6 * cm;

  function addHandle(zSign) {
    const g = new THREE.Group();
    g.name = zSign > 0 ? 'handleFront' : 'handleBack';
    const rosette = new THREE.Mesh(
      new THREE.CylinderGeometry(ROSETTE_D/2, ROSETTE_D/2, ROSETTE_THK, 48),
      chromeMat
    );
    rosette.rotation.x = Math.PI / 2;
    rosette.position.set(0, 0, ROSETTE_THK / 2);
    rosette.castShadow = true;
    g.add(rosette);

    const stem = new THREE.Mesh(
      new THREE.BoxGeometry(STEM_SIDE, STEM_SIDE, STEM_LEN),
      chromeMat
    );
    stem.position.set(0, 0, ROSETTE_THK + STEM_LEN/2);
    stem.castShadow = true;
    g.add(stem);

    const leverDir = -1;
    const leverCenterZ = ROSETTE_THK + STEM_LEN + LEVER_SIDE/2;
    const lever = new THREE.Mesh(
      new THREE.BoxGeometry(LEVER_LEN, LEVER_SIDE, LEVER_SIDE),
      chromeMat
    );
    lever.position.set(leverDir * (LEVER_LEN/2 - STEM_SIDE/2), 0, leverCenterZ);
    lever.castShadow = true;
    g.add(lever);

    g.position.set(handleX, handleY, -hingeZ + zSign * (DT/2));
    if (zSign < 0) g.scale.z = -1;
    doorPivot.add(g);
  }
  addHandle(+1);
  addHandle(-1);

  // ---- WALL — REFERENCE GEOMETRY ONLY, sibling of the assembly ----
  const wallMat = new THREE.MeshStandardMaterial({ color:0xe8e2d4, roughness:0.95 });
  const wallShape = new THREE.Shape();
  wallShape.moveTo(-WALL_W/2, 0);
  wallShape.lineTo(+WALL_W/2, 0);
  wallShape.lineTo(+WALL_W/2, WALL_H);
  wallShape.lineTo(-WALL_W/2, WALL_H);
  wallShape.lineTo(-WALL_W/2, 0);

  const REVEAL = 8.5 * cm;
  const holeHalfW = DW/2 + REVEAL;
  const holeTop   = DH + REVEAL;
  const hole = new THREE.Path();
  hole.moveTo(-holeHalfW, 0);
  hole.lineTo(+holeHalfW, 0);
  hole.lineTo(+holeHalfW, holeTop);
  hole.lineTo(-holeHalfW, holeTop);
  hole.lineTo(-holeHalfW, 0);
  wallShape.holes.push(hole);

  const wallGeo = new THREE.ExtrudeGeometry(wallShape, {
    depth: WALL, bevelEnabled: false, curveSegments: 1
  });
  wallGeo.translate(0, 0, -WALL/2);
  const wallMesh = new THREE.Mesh(wallGeo, wallMat);
  wallMesh.name = 'wall_REFERENCE_ONLY';
  wallMesh.castShadow = true; wallMesh.receiveShadow = true;
  group.add(wallMesh);

  // ---- DOOR ASSEMBLY · frame (jambs + head) ----
  const REVEAL3D = 8.5 * cm;
  const HINGE_THK = 14.3 * cm;
  const frameMat = new THREE.MeshStandardMaterial({ color:0xf1ede2, roughness:0.5 });

  const frameShape = new THREE.Shape();
  const outerHalfW = DW/2 + REVEAL3D;
  const outerTop   = DH + REVEAL3D;
  frameShape.moveTo(-outerHalfW, 0);
  frameShape.lineTo(+outerHalfW, 0);
  frameShape.lineTo(+outerHalfW, outerTop);
  frameShape.lineTo(-outerHalfW, outerTop);
  frameShape.lineTo(-outerHalfW, 0);

  const frameHole = new THREE.Path();
  frameHole.moveTo(-DW/2, 0);
  frameHole.lineTo(+DW/2, 0);
  frameHole.lineTo(+DW/2, DH);
  frameHole.lineTo(-DW/2, DH);
  frameHole.lineTo(-DW/2, 0);
  frameShape.holes.push(frameHole);

  const frameGeo = new THREE.ExtrudeGeometry(frameShape, {
    depth: HINGE_THK, bevelEnabled: false, curveSegments: 1
  });
  frameGeo.translate(0, 0, -HINGE_THK/2);
  const frameMesh = new THREE.Mesh(frameGeo, frameMat);
  frameMesh.name = 'doorFrame';
  frameMesh.castShadow = true; frameMesh.receiveShadow = true;
  doorAssembly.add(frameMesh);

  // ---- stash for the animate loop ----
  ctx.doorPivot = doorPivot;
  // open % (0..100) → radians (0..150°); direction set by hinge face
  const mag = (Math.max(0, Math.min(100, t.openPct)) / 100) * (150 * Math.PI / 180);
  ctx.doorTargetAngle = hingeFront ? mag : -mag;
  if (ctx.doorAngle === undefined) ctx.doorAngle = ctx.doorTargetAngle;
}

// per-frame swing lerp (mirrors DoorSpec's original RAF behaviour)
function animateDoor(t, ctx, k) {
  if (!ctx.doorPivot) return;
  const target = ctx.doorTargetAngle ?? 0;
  ctx.doorAngle += (target - ctx.doorAngle) * k;
  ctx.doorPivot.rotation.y = -ctx.doorAngle;
}

// ============== App ==============
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <>
      <h1>Door Spec</h1>
      <div className="sub">All units cm. Use the Tweaks panel to open the door.</div>

      <div className="grid">
        <div className="card">
          <h2>Cross-section (top-down)</h2>
          <CrossSection t={t} />
          <div className="legend">Wall {t.wallWidth} cm wide × {t.wallHeight} cm tall × {t.wallThickness.toFixed(1)} cm thick. Door slab {t.doorWidth} × {t.doorHeight} × {t.doorThickness} sits in centered cutout.</div>
        </div>

        <div className="card">
          <h2>Numbers</h2>
          <table>
            <tbody>
              <tr><th>Feature</th><th className="num">cm</th><th>Variability</th></tr>
              <tr><td>Overall door width <span style={{opacity:0.6}}>(door + 2 × reveal)</span></td><td className="num">{(t.doorWidth + 2 * 8.5).toFixed(1)}</td><td><b>Variable</b> — pick to fit opening</td></tr>
              <tr><td>Door width</td><td className="num">{t.doorWidth.toFixed(1)}</td><td>Derived: overall − 2 × reveal</td></tr>
              <tr><td>Door height</td><td className="num">{t.doorHeight.toFixed(1)}</td><td>Fixed (standard)</td></tr>
              <tr><td>Door thickness</td><td className="num">{t.doorThickness.toFixed(2)}</td><td>Fixed</td></tr>
              <tr><td>Frame thickness (depth)</td><td className="num">14.3</td><td>Fixed</td></tr>
              <tr><td>Frame reveal (left, right, top)</td><td className="num">8.5</td><td>Fixed</td></tr>
              <tr><td>Wall height</td><td className="num">{t.wallHeight.toFixed(1)}</td><td>Typically fixed (~250)</td></tr>
              <tr><td>Wall thickness</td><td className="num">{t.wallThickness.toFixed(2)}</td><td><b>Variable</b> — match source wall</td></tr>
            </tbody>
          </table>
        </div>

        <div className="card full">
          <h2>3D — door + wall</h2>
          <ThreeView
            t={t}
            buildModel={buildDoor}
            animate={animateDoor}
            heightOf={tt => tt.doorHeight * 0.01}
          />
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Door" />
        <TweakToggle label="Hinge on front face" value={t.hingeFront}
          onChange={v => setTweak('hingeFront', v)} />
        <TweakSlider label="Open" value={t.openPct} min={0} max={100} step={1} unit="%"
          onChange={v => setTweak('openPct', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Standalone viewing (opened directly at a /w URL, no design-tool host):
// the shared TweaksPanel stays closed until it receives __activate_edit_mode.
// Self-post it so the panel is visible when there's no host driving it.
setTimeout(() => window.postMessage({ type: '__activate_edit_mode' }, '*'), 0);
</script>
</body>
</html>
