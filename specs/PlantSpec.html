<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plants — Spec</title>
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { background:#f4f1ec; color:#1a1a1a; font-family:ui-monospace,'SF Mono',Menlo,monospace; padding:24px; }
  h1 { font-size:14px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; margin-bottom:4px; }
  .sub { font-size:11px; opacity:0.6; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
  /* A 1fr grid track still respects its content's min-content width unless
     told otherwise, so a wide table cell (e.g. "final bbox width" in the
     Numbers card) can force the whole grid past a narrow (390px) viewport --
     visual review ba80c1c1. min-width:0 lets the track shrink below its
     content's natural width, and the table's own overflow-x scrolls
     internally instead of blowing out the page. Local to this page rather
     than the shared spec-page CSS every other spec page copies verbatim
     (WindowSpec/CurtainSpec/etc. have the same base .grid/.card rules) --
     that shared drift is the "leave it to a follow-up" part of the finding. */
  .grid > * { min-width: 0; }
  .card { background:#fff; border:1px solid #d8d3c8; border-radius:6px; padding:20px; overflow-x:auto; }
  .card h2 { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; opacity:0.7; margin-bottom:14px; }
  svg { display:block; width:100%; height:auto; }
  #c3d { width:100%; height:560px; display:block; background:#1a1a1c; border-radius:4px; }
  .legend { font-size:10px; line-height:1.6; margin-top:14px; opacity:0.75; }
  .row { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .btn { padding:6px 10px; font:inherit; font-size:10px; background:#1a1a1c; color:#fff; border:none; border-radius:4px; cursor:pointer; }
  .btn:hover { background:#333; }
  .btn.active { background:#6b5d4a; }
  .full { grid-column:1 / -1; }
  table { width:100%; border-collapse:collapse; font-size:11px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid #ece8e0; }
  th { font-weight:600; opacity:0.6; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  pre.json { font-size:10px; line-height:1.5; background:#f7f5f0; border:1px solid #ece8e0; border-radius:4px;
    padding:10px; white-space:pre-wrap; word-break:break-all; margin-top:10px; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Which objects this page holds (read by SpecPage in tweaks-panel.jsx and by
     scripts/test-spec-pages.mjs). All are the one `plant` registry type, but
     each KIND has its own controls and its own name, so each kind is an
     OBJECT (the corn plant keeps the id "potted-plant" so old links land);
     the presets of a kind are its VARIANTS. -->
<script type="application/json" id="spec-manifest">
{
  "title": "Plants",
  "description": "All units cm. Procedural potted and wall-mounted plants with seeded (deterministic) leaves. Pick an object and a variant, then fine-tune in the Tweaks panel.",
  "objects": [
    { "id": "potted-plant", "label": "Corn plant", "types": ["plant"] },
    { "id": "wall-planter", "label": "Wall planter", "types": ["plant"] },
    { "id": "peace-lily", "label": "Peace lily", "types": ["plant"] },
    { "id": "snake-plant", "label": "Snake plant", "types": ["plant"] },
    { "id": "pothos", "label": "Pothos", "types": ["plant"] },
    { "id": "ficus", "label": "Ficus", "types": ["plant"] },
    { "id": "jade", "label": "Jade", "types": ["plant"] }
  ]
}
</script>

<!-- React/ReactDOM/Babel/three served LOCALLY (../vendor/) — no CDN: this app must work on a LAN with no internet. React is the production build; Babel is required because the .jsx below is transpiled in-browser at runtime. -->
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../vendor/babel.min.js"></script>
<script src="../vendor/three.js"></script>
<!-- Shared harness: tweaks-panel.jsx (tweaks machinery) + reusable ThreeView -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="spec-three.jsx"></script>

<!-- The plant geometry itself lives in src/furniture/plant.js -- the SAME
     pure builder module a house scene would call once plants are placed
     (item 78f2b614 for the corn plant, the bedroom wall-planter follow-up
     for the wall planters; both out of scope here). Loaded as a real ES
     module (genuine ESM, exported for a plain Node unit test too) and
     stashed on window so the Babel-transpiled app below -- which targets the
     global `THREE` from ../vendor/three.js, matching every other spec page
     -- can call it. Two different THREE builds never meet: this module
     never touches THREE itself, it only receives whichever build its
     caller passes in. -->
<script type="module">
  import * as M from '../src/furniture/plant.js';
  // The status card below is the app's own tap card (src/tap-popovers.js),
  // rendered from a SAMPLE reading: this page never talks to Home Assistant.
  import { popoverHtml, STYLE } from '../src/tap-popovers.js';
  import * as PS from '../src/plant-status.js';
  window.PlantCard = { popoverHtml, STYLE, PS };
  window.FurniturePlant = M;
</script>

<script type="text/babel">
/* =====================================================================
   PLANT SPEC   ·   procedural potted + wall-mounted plants

   ── DIMENSIONS ARE ILLUSTRATIVE ──────────────────────────────────────
   Preset numbers come from real measured items; every OTHER dimension is
   a DEFAULT, not a survey. This is a design reference for modelling a
   fixture, not a record of any particular building.
   ─────────────────────────────────────────────────────────────────────

   Seven kinds, each an OBJECT in the shared picker bar (SpecPage):
     corn-plant    a potted Dracaena: an egg-shaped ribbed vase, three bare
                   banded canes crowned by tufts of long strap leaves.
     wall-planter  a geometric wall planter: a ceramic lower half with a
                   flat back and a brass wire diamond outline; spiky,
                   succulent or snake-plant contents. Wall-mounted.
     peace-lily    grown in water in a clear glass bubble vase, roots
                   visible, broad glossy leaves and one white spathe.
     snake-plant   stiff sword leaves with a pale margin.
     pothos        heart leaves: upright on arching stems, or trailing --
                   a mound of leaves spilling over the rim and vines that
                   hang `trail` cm below the pot.
     ficus         a small thick-trunk tree with a dense mass of small leaves.
     jade          a succulent: a compact clump of plump pads on the rim.

   The geometry itself is NOT built here -- it lives in
   src/furniture/plant.js (build / buildPlant), loaded above as a real ES
   module and unit-tested by scripts/test-plant-builder.mjs. This page is a
   thin harness: tweaks in, THREE.Group out, via the same reusable
   ThreeView every other spec page uses. Leaves are procedural and seeded
   (deterministic) -- the same seed always lays out the same leaves.
   ===================================================================== */
const { DEFAULTS, PRESETS } = window.FurniturePlant;

// Mirrors src/furniture/plant.js's DEFAULTS exactly (including leafCount:5)
// so "Copy as furniture JSON" only ever emits a key that GENUINELY differs
// from DEFAULTS -- a TWEAK_DEFAULTS/DEFAULTS mismatch here previously made
// leafCount always show up in the corn-plant preset's JSON (it isn't even a
// corn-plant param), which visual review flagged as an INFO finding.
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "preset": "corn-plant-tall",
  "kind": "corn-plant",
  "width": 60,
  "depth": 59.5,
  "height": 166,
  "potStyle": "egg",
  "potHeight": 56,
  "potTopDiameter": 30,
  "potColor": "#a67c4e",
  "plantHeight": 110,
  "stemCount": 3,
  "spread": 60,
  "leafLength": 45,
  "leafWidth": 6,
  "leafCount": 5,
  "leafColor": "#1f3a1c",
  "accentColor": "#d8d3a8",
  "habit": "upright",
  "trail": 0,
  "glassColor": "#dcecef",
  "frameColor": "#b8945a",
  "contents": "spiky",
  "seed": 7,
  "detail": "full"
}/*EDITMODE-END*/;

// Params object the builder actually wants, derived from tweak state. Colours
// are plain '#rrggbb' strings straight through -- makeFinish() (finishes.js)
// and the schema's hexColor $def both take that form natively, so there is
// no number<->string conversion left to keep in sync.
function paramsFromTweaks(t) {
  return {
    kind: t.kind,
    width: t.width,
    depth: t.depth,
    height: t.height,
    potStyle: t.potStyle,
    potHeight: t.potHeight,
    potTopDiameter: t.potTopDiameter,
    potColor: t.potColor,
    plantHeight: t.plantHeight,
    stemCount: t.stemCount,
    spread: t.spread,
    leafLength: t.leafLength,
    leafWidth: t.leafWidth,
    leafCount: t.leafCount,
    leafColor: t.leafColor,
    accentColor: t.accentColor,
    habit: t.habit,
    trail: t.trail,
    glassColor: t.glassColor,
    frameColor: t.frameColor,
    contents: t.contents,
    seed: t.seed,
  };
}

// Only the keys that differ from DEFAULTS -- what "Copy as furniture JSON"
// emits, so a placed instance doesn't carry a redundant full parameter set.
function diffFromDefaults(params) {
  const out = {};
  for (const [k, v] of Object.entries(params)) {
    const d = DEFAULTS[k];
    if (v !== d) out[k] = v;
  }
  return out;
}

// ============== Plant model (delegates to the shared builder) ==============
// opts.detail is threaded through from the tweak state -- previously this
// page never passed opts at all, so 'low' detail was unreachable from the
// spec page even though the builder supports it (visual review bc1cf6ac).
function buildPlantModel(t, group, THREE, ctx) {
  const { build } = window.FurniturePlant;
  const params = paramsFromTweaks(t);
  const plantGroup = build(THREE, params, { detail: t.detail === 'low' ? 'low' : 'full' });
  group.add(plantGroup);
  ctx.topY = plantGroup.userData.topY;
}

// Readable variant labels (the chip text); the preset ids stay the URL keys.
const VARIANT_LABELS = {
  'corn-plant-tall': 'Tall, ribbed egg vase',
  'wall-planter-large': 'Large, spiky leaves',
  'wall-planter-small': 'Small, succulent',
  'wall-planter-large-snake': 'Large, snake plant',
  'peace-lily-glass-vase': 'In a glass bubble vase (water)',
  'snake-plant-small': 'Small, tapered pot',
  'pothos-upright-ribbed-pot': 'Upright, ribbed footed pot',
  'pothos-trailing': 'Trailing vines',
  'ficus-bowl-pot': 'Small tree, bowl pot on a saucer',
  'jade-small': 'Small, glossy pot',
};
// Manifest object id <-> builder kind (the corn plant keeps "potted-plant").
const OBJECT_KIND = {
  'potted-plant': 'corn-plant', 'wall-planter': 'wall-planter', 'peace-lily': 'peace-lily',
  'snake-plant': 'snake-plant', 'pothos': 'pothos', 'ficus': 'ficus', 'jade': 'jade',
};
const KIND_OBJECT = Object.fromEntries(Object.entries(OBJECT_KIND).map(([o, k]) => [k, o]));

// ============== Status card (sample reading) ==============
// The plant's card, exactly as the house shows it when a bound plant is
// tapped, driven by a sample reading. Read-only: it has no controls.
const CARD_SAMPLES = [['ok', 'OK'], ['dry', 'Dry'], ['wet', 'Wet'], ['due', 'Water due'], ['offline', 'Offline']];
function PlantCardPreview({ name }) {
  const K = window.PlantCard;
  const [sample, setSample] = React.useState('ok');
  React.useEffect(() => {
    if (!K || document.getElementById('tp-style')) return;
    const el = document.createElement('style');
    el.id = 'tp-style';
    el.textContent = K.STYLE;
    document.head.appendChild(el);
  }, []);
  if (!K) return null;
  const m = K.PS.MOCK_PLANT_READINGS[sample];
  const reading = Object.assign({}, m, { updated: Date.now() - m.updated });
  const dot = () => '<span class="tp-status bad" title="Sample reading: not connected"><i></i></span>';
  const html = K.popoverHtml.plant({ name, status: 'offlinePlant', haOff: false, reading, ago: K.PS.agoText(reading.updated) }, dot);
  return (
    <>
      <div className="row">
        {CARD_SAMPLES.map(([k, label]) =>
          <button key={k} className={'btn' + (sample === k ? ' active' : '')} onClick={() => setSample(k)}>{label}</button>)}
      </div>
      <div style={{ background: '#1a1a1c', borderRadius: 4, padding: 16, marginTop: 8 }}>
        <div className="tp-pop" data-kind="plant" style={{ position: 'static' }} dangerouslySetInnerHTML={{ __html: html }} />
      </div>
    </>
  );
}

// ============== App ==============
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [copied, setCopied] = React.useState(false);
  const params = paramsFromTweaks(t);
  const json = JSON.stringify({ type: 'plant', params: diffFromDefaults(params) }, null, 2);

  const applyPreset = (name) => {
    const preset = PRESETS[name];
    if (!preset) return;
    // FULLY resolved: DEFAULTS first, so a key the previous preset set (a
    // trail, a pot style) never leaks into this one.
    setTweak(Object.assign({ preset: name }, DEFAULTS, preset));
  };

  const copyJson = () => {
    navigator.clipboard?.writeText(json).catch(() => {});
    setCopied(true);
    setTimeout(() => setCopied(false), 1200);
  };

  const isWallPlanter = t.kind === 'wall-planter';

  // OBJECT <-> kind; each object's VARIANTS are the presets of its kind,
  // with FULLY resolved params (DEFAULTS + the preset).
  const objectId = KIND_OBJECT[t.kind] || 'potted-plant';
  const kindOf = id => OBJECT_KIND[id] || 'corn-plant';
  const variantsOf = kind => Object.keys(PRESETS).filter(n => PRESETS[n].kind === kind)
    .map(n => ({ id: n, label: VARIANT_LABELS[n] || n, params: Object.assign({}, DEFAULTS, PRESETS[n]) }));

  return (
    <SpecPage objectId={objectId}
      onObject={id => applyPreset(variantsOf(kindOf(id))[0].id)}>
      <SpecVariants variants={variantsOf(t.kind)} values={t} onSelect={applyPreset} />

      <div className="grid">
        <div className="card">
          <h2>Where the variants come from</h2>
          <div className="legend">
            The corn plant is measured: 56 cm ribbed egg vase (rim 30); three bare banded canes whose tops
            stand ~75 / ~32 / ~13 cm above the rim, each crowned by a tuft of 40-50 cm strap leaves arching over and drooping, the top
            tuft reaching ~110 above the rim and ~60 cm across. The wall-planter variants are the two common
            retail sizes of this planter shape (22.9 x 9.5 x 38.1 and 11 x 9.8 x 14.3, wire included).
            <b>Every other variant is ESTIMATED from photographs</b> against objects of known size -- correct
            the sizes before they are placed. The peace lily grows in water (glass, kept as its own draw).
            The trailing pothos hangs 50 cm below its pot, EXACTLY (the pot base is at y = trail): place it
            with elevation = surface - trail.
          </div>
        </div>

        <div className="card">
          <h2>Numbers</h2>
          <table>
            <tbody>
              <tr><th>Feature</th><th className="num">cm</th><th>Variability</th></tr>
              <tr><td>Kind</td><td className="num">{t.kind}</td><td><b>Variable</b></td></tr>
              <tr><td>Width (envelope)</td><td className="num">{t.width}</td><td><b>Variable</b> — final bbox width</td></tr>
              <tr><td>Depth (envelope)</td><td className="num">{t.depth}</td><td><b>Variable</b> — final bbox depth, back at z=0</td></tr>
              <tr><td>Height (envelope)</td><td className="num">{t.height}</td><td><b>Variable</b> — final bbox height, bottom at y=0</td></tr>
              {!isWallPlanter && <>
                <tr><td>Pot style</td><td className="num">{t.potStyle}</td><td>Proportioning</td></tr>
                <tr><td>Pot height</td><td className="num">{t.potHeight}</td><td>Proportioning</td></tr>
                <tr><td>Pot opening diameter</td><td className="num">{t.potTopDiameter}</td><td>Proportioning</td></tr>
                <tr><td>Plant height (above pot)</td><td className="num">{t.plantHeight}</td><td>Proportioning</td></tr>
                <tr><td>Stem/cane count</td><td className="num">{t.stemCount}</td><td>Proportioning</td></tr>
                <tr><td>Widest leaf spread</td><td className="num">{t.spread}</td><td>Proportioning</td></tr>
                <tr><td>Leaf length x width</td><td className="num">{t.leafLength} x {t.leafWidth}</td><td>Proportioning</td></tr>
                {t.kind === 'pothos' && <tr><td>Habit / trail</td><td className="num">{t.habit} / {t.trail}</td><td>Trail = cm below the pot base</td></tr>}
              </>}
              {isWallPlanter && <>
                <tr><td>Contents</td><td className="num">{t.contents}</td><td><b>Variable</b></td></tr>
              </>}
              <tr><td>Seed</td><td className="num">{t.seed}</td><td><b>Variable</b> — reshuffles leaf layout deterministically</td></tr>
            </tbody>
          </table>
          <div className="legend">
            width/depth/height are the AUTHORITATIVE final bounding box -- the builder proportions its
            procedural geometry (pot/canes/leaves or planter/leaves) internally, then a measure-and-fit
            pass (fitToEnvelope in src/furniture/plant.js) rescales the whole result to land on exactly
            this envelope: x centred on 0, bottom at y=0, back at z=0. See scripts/test-plant-builder.mjs
            and scripts/test-furniture-core.mjs.
          </div>
        </div>

        <div className="card full">
          <h2>3D — {t.kind}</h2>
          <ThreeView
            t={t}
            buildModel={buildPlantModel}
            heightOf={tt => tt.height * 0.01}
          />
          <div className="legend">Drag to orbit, scroll to zoom. Change the seed to reshuffle the leaf layout without changing any size.</div>
        </div>

        <div className="card">
          <h2>Status card (sample reading)</h2>
          <PlantCardPreview name={VARIANT_LABELS[t.preset] || 'Plant'} />
          <div className="legend">
            Tapping a plant in the house opens this card, bound through rooms.json
            <code> sensors.plants</code> (keyed by this item's furniture id): the soil moisture %, a Dry / OK / Wet
            status (from the dryBelow / wetAbove thresholds, or the bound needs-water helper), when the sensor last
            reported, and its battery and temperature when bound. A sensor that drops off reads Offline, never 0%.
            A plant with no probe can bind a watering countdown instead. The card is read-only; the sidebar's
            Controls view lists the same readings. Nothing on this page talks to Home Assistant.
          </div>
        </div>

        <div className="card full">
          <h2>Copy as furniture JSON</h2>
          <div className="row">
            <TweakButton label={copied ? 'Copied!' : 'Copy as furniture JSON'} onClick={copyJson} />
          </div>
          <pre className="json">{json}</pre>
          <div className="legend">Only the keys that differ from DEFAULTS are emitted, matching every other furniture spec's placement contract.</div>
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Envelope (final bounding box)" />
        <TweakSlider label="Width" value={t.width} min={8} max={100} step={0.5} unit="cm"
          onChange={v => setTweak('width', v)} />
        <TweakSlider label="Depth" value={t.depth} min={5} max={100} step={0.5} unit="cm"
          onChange={v => setTweak('depth', v)} />
        <TweakSlider label="Height" value={t.height} min={10} max={220} step={0.5} unit="cm"
          onChange={v => setTweak('height', v)} />

        {!isWallPlanter && <>
          <TweakSection label="Pot" />
          <TweakSelect label="Pot style" value={t.potStyle}
            options={window.FurniturePlant.POT_STYLES.slice()}
            onChange={v => setTweak('potStyle', v)} />
          <TweakSlider label="Pot height" value={t.potHeight} min={5} max={100} step={1} unit="cm"
            onChange={v => setTweak('potHeight', v)} />
          <TweakSlider label="Pot opening diameter" value={t.potTopDiameter} min={5} max={50} step={1} unit="cm"
            onChange={v => setTweak('potTopDiameter', v)} />
          <TweakColor label="Pot colour" value={t.potColor}
            onChange={v => setTweak('potColor', v)} />
          <TweakSection label="Foliage (proportioning)" />
          <TweakSlider label="Plant height (above pot)" value={t.plantHeight} min={5} max={200} step={0.5} unit="cm"
            onChange={v => setTweak('plantHeight', v)} />
          <TweakSlider label="Stems / canes / branches" value={t.stemCount} min={1} max={8} step={1}
            onChange={v => setTweak('stemCount', v)} />
          <TweakSlider label="Widest leaf spread" value={t.spread} min={10} max={100} step={1} unit="cm"
            onChange={v => setTweak('spread', v)} />
          <TweakSlider label="Leaf length" value={t.leafLength} min={2} max={70} step={0.5} unit="cm"
            onChange={v => setTweak('leafLength', v)} />
          <TweakSlider label="Leaf width" value={t.leafWidth} min={1} max={15} step={0.1} unit="cm"
            onChange={v => setTweak('leafWidth', v)} />
          {t.kind !== 'corn-plant' && <TweakSlider label="Leaf count" value={t.leafCount} min={1} max={60} step={1}
            onChange={v => setTweak('leafCount', v)} />}
          {t.kind === 'pothos' && <>
            <TweakRadio label="Habit" value={t.habit}
              options={[{ value: 'upright', label: 'Upright' }, { value: 'trailing', label: 'Trailing' }]}
              onChange={v => setTweak('habit', v)} />
            <TweakSlider label="Trail below pot" value={t.trail} min={0} max={120} step={1} unit="cm"
              onChange={v => setTweak('trail', v)} />
          </>}
          <TweakSection label="Colours" />
          <TweakColor label="Leaf colour" value={t.leafColor}
            onChange={v => setTweak('leafColor', v)} />
          {(t.kind === 'peace-lily' || t.kind === 'snake-plant') && <TweakColor label={t.kind === 'peace-lily' ? 'Variegation' : 'Leaf margin'} value={t.accentColor}
            onChange={v => setTweak('accentColor', v)} />}
          {t.kind === 'peace-lily' && <TweakColor label="Glass tint" value={t.glassColor}
            onChange={v => setTweak('glassColor', v)} />}
        </>}

        {isWallPlanter && <>
          <TweakSection label="Wall planter" />
          <TweakSelect label="Contents" value={t.contents}
            options={window.FurniturePlant.WALL_CONTENTS.slice()}
            onChange={v => setTweak('contents', v)} />
          <TweakColor label="Ceramic colour" value={t.potColor}
            onChange={v => setTweak('potColor', v)} />
          <TweakColor label="Wire frame colour" value={t.frameColor}
            onChange={v => setTweak('frameColor', v)} />
          <TweakColor label="Leaf colour" value={t.leafColor}
            onChange={v => setTweak('leafColor', v)} />
          {t.contents === 'snake-plant' && <TweakColor label="Leaf margin" value={t.accentColor}
            onChange={v => setTweak('accentColor', v)} />}
        </>}

        <TweakSection label="Leaf layout" />
        <TweakSlider label="Seed" value={t.seed} min={1} max={999} step={1}
          onChange={v => setTweak('seed', v)} />

        <TweakSection label="Detail (mobile budget)" />
        <TweakRadio label="Detail" value={t.detail}
          options={[{ value: 'full', label: 'Full' }, { value: 'low', label: 'Low' }]}
          onChange={v => setTweak('detail', v)} />
      </TweaksPanel>
    </SpecPage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Standalone viewing (opened directly at a /w URL, no design-tool host):
// the shared TweaksPanel stays closed until it receives __activate_edit_mode.
// Self-post it so the panel is visible when there's no host driving it.
setTimeout(() => window.postMessage({ type: '__activate_edit_mode' }, '*'), 0);
</script>
</body>
</html>
