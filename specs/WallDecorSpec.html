<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Old address, kept so existing links keep working: the wall sign and the
     wall lights now live on Small items. scripts/test-spec-pages.mjs reads
     spec-alias and checks the target page declares the object. -->
<meta name="spec-alias" content="SmallItemsSpec.html?object=wall-sign">
<meta http-equiv="refresh" content="0; url=SmallItemsSpec.html?object=wall-sign">
<title>Moved — Small items</title>
<script>
  // Keep any other query parameters and the hash.
  (function () {
    var q = new URLSearchParams(location.search);
    q.set('object', 'wall-sign');
    location.replace('SmallItemsSpec.html?' + q.toString() + location.hash);
  })();
</script>
</head>
<body style="font-family:ui-monospace,monospace;padding:24px">
  This spec moved to <a href="SmallItemsSpec.html?object=wall-sign">Small items</a>.
</body>
</html>
