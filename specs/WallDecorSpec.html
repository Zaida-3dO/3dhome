<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wall Decor Spec — Tweakable</title>
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { background:#f4f1ec; color:#1a1a1a; font-family:ui-monospace,'SF Mono',Menlo,monospace; padding:24px; }
  h1 { font-size:14px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; margin-bottom:4px; }
  .sub { font-size:11px; opacity:0.6; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
  .card { background:#fff; border:1px solid #d8d3c8; border-radius:6px; padding:20px; }
  .card h2 { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; opacity:0.7; margin-bottom:14px; }
  #c3d { width:100%; height:560px; display:block; background:#1a1a1c; border-radius:4px; }
  .legend { font-size:10px; line-height:1.6; margin-top:14px; opacity:0.75; }
  .row { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .btn { padding:6px 10px; font:inherit; font-size:10px; background:#1a1a1c; color:#fff; border:none; border-radius:4px; cursor:pointer; }
  .btn:hover { background:#333; }
  .btn.active { background:#6b5d4a; }
  .full { grid-column:1 / -1; }
  .seg { display:flex; gap:0; margin-bottom:14px; border-radius:6px; overflow:hidden; border:1px solid #d8d3c8; }
  .seg button { flex:1; padding:8px; font:inherit; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; background:#fff; border:none; cursor:pointer; }
  .seg button.active { background:#1a1a1c; color:#fff; }
</style>
</head>
<body>
<div id="root"></div>

<!-- React/ReactDOM/Babel/three served LOCALLY (../vendor/) — no CDN: this app
     must work on a LAN with no internet. React is the production build; Babel
     transpiles the .jsx below in-browser at runtime. -->
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../vendor/babel.min.js"></script>
<script src="../vendor/three.js"></script>
<!-- Shared harness: tweaks-panel.jsx (tweaks machinery) + reusable ThreeView -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="spec-three.jsx"></script>

<!-- Builder modules loaded as real ESM (the same files the app/tests use,
     not a copy) and handed to the Babel app via a global once ready, since
     the .babel scripts below run as classic (non-module) scripts. -->
<script type="module">
  import * as WallSign from '../src/furniture/wall-sign.js';
  import * as WallSconce from '../src/furniture/wall-sconce.js';
  window.__wallDecorModules = { WallSign, WallSconce };
  window.dispatchEvent(new Event('wall-decor-modules-ready'));
</script>

<script type="text/babel">
/* =====================================================================
   WALL DECOR SPEC   ·   framed wall sign + wall sconce (2 kinds)

   ── DIMENSIONS ARE ILLUSTRATIVE ──────────────────────────────────────
   Every dimension below is a DEFAULT, not a survey. Sign text is a stock
   retail sign phrase, not any real house's wording — this is a public
   repo and carries no real-house text or data. Measure your own item and
   drive the geometry from the Tweaks panel.

   The sign has TWO depth levels: the outer frame (`depth`, default 3cm,
   front at z=depth) projects forward past the inner white-washed
   panel/body (`panelDepth`, default 1.5cm, its own text-bearing front
   face at z=panelDepth) by their difference (1.5cm by default).
   ─────────────────────────────────────────────────────────────────────

   This page renders the two builder modules directly
   (src/furniture/wall-sign.js, src/furniture/wall-sconce.js) via a
   dynamic ES import bridged onto window.__wallDecorModules above, so the
   page is always in sync with what the app and the Node tests build —
   never a re-implementation of the geometry.

   Builder contract: ESM, THREE injected, exports TYPE/DEFAULTS (frozen,
   with numeric width/height/depth)/build(THREE, params, {detail}),
   metres, y=0 at the bottom, back face at z=0, front faces +z. Finish
   contract: every mesh carries userData.finish from the closed palette
   {matte, gloss, metal, glass, mirror, emissive}; glass/emissive/textured
   parts carry userData.keep so the live renderer's per-finish mesh merge
   leaves them as their own draw call.

   wall-sconce.js is ONE registered type ("wall-sconce") with two visual
   kinds selected by params.kind:
     - "swing-arm-globe" (default) — brass arm + smoked glass globe + bulb.
     - "up-down" — a rectangular wall light with a lens at top and bottom,
       each with a faint up/down beam-cone hint when on.
   ===================================================================== */

const SIGN_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "width": 110,
  "height": 45,
  "depth": 3,
  "panelDepth": 1.5,
  "frameThickness": 2,
  "frameColor": "#151515",
  "panelColor": "#f2ede2",
  "line1": "GIVE IT TO GOD",
  "line2": "and go to sleep",
  "textColor": "#1a1a1a"
}/*EDITMODE-END*/;

// Preset params per sconce kind. Switching the preset replaces the whole
// tweak object (via setSconceTweak with no key) so stale params from the
// other kind never leak through onto the new one.
const SCONCE_PRESETS = {
  'swing-arm-globe': {
    label: 'Swing-arm globe',
    defaults: {
      kind: 'swing-arm-globe',
      armLength: 22,
      dropLength: 18,
      globeDiameter: 15,
      metalColor: '#b08d57',
      glassColor: '#6b4a2a',
      on: true
    }
  },
  'up-down': {
    label: 'Up/down wall light (rectangular)',
    defaults: {
      kind: 'up-down',
      width: 12,
      height: 20,
      plateThickness: 1,
      bodyWidth: 6,
      bodyHeight: 12,
      bodyDepth: 5,
      lensDiameter: 3,
      lensProtrusion: 1,
      metalColor: '#8a5a3c',
      on: true
    }
  }
};

const SCONCE_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "kind": "swing-arm-globe",
  "armLength": 22,
  "dropLength": 18,
  "globeDiameter": 15,
  "metalColor": "#b08d57",
  "glassColor": "#6b4a2a",
  "on": true
}/*EDITMODE-END*/;

function useModulesReady() {
  const [ready, setReady] = React.useState(!!window.__wallDecorModules);
  React.useEffect(() => {
    if (ready) return;
    const onReady = () => setReady(true);
    window.addEventListener('wall-decor-modules-ready', onReady);
    return () => window.removeEventListener('wall-decor-modules-ready', onReady);
  }, [ready]);
  return ready;
}

// ============== App ==============
function App() {
  const ready = useModulesReady();
  const [item, setItem] = React.useState('sign'); // 'sign' | 'sconce'
  const [signT, setSignTweak] = useTweaks(SIGN_TWEAK_DEFAULTS);
  const [sconceT, setSconceTweak] = useTweaks(SCONCE_TWEAK_DEFAULTS);
  const [copied, setCopied] = React.useState(false);

  const sconceKind = sconceT.kind === 'up-down' ? 'up-down' : 'swing-arm-globe';
  const selectPreset = (kind) => setSconceTweak(SCONCE_PRESETS[kind].defaults);

  const buildSign = React.useCallback((t, group, THREE, ctx) => {
    const mods = window.__wallDecorModules;
    if (!mods) return;
    const built = mods.WallSign.build(THREE, t, { detail: 'full' });
    group.add(built);
  }, []);

  const buildSconce = React.useCallback((t, group, THREE, ctx) => {
    const mods = window.__wallDecorModules;
    if (!mods) return;
    const built = mods.WallSconce.build(THREE, t, { detail: 'full' });
    group.add(built);
  }, []);

  const copyJson = () => {
    const mods = window.__wallDecorModules;
    if (!mods) return;
    const payload = item === 'sign'
      ? { type: mods.WallSign.TYPE, params: signT }
      : { type: mods.WallSconce.TYPE, params: sconceT };
    const text = JSON.stringify(payload, null, 2);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => {});
    }
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };

  if (!ready) {
    return <div className="sub">Loading builder modules…</div>;
  }

  const isSign = item === 'sign';
  const heightOf = sconceKind === 'up-down'
    ? (tt => (tt.height || 20) * 0.01 + 0.15)
    : (tt => ((tt.armLength || 22) + (tt.dropLength || 18) + (tt.globeDiameter || 15)) * 0.01 + 0.15);

  return (
    <>
      <h1>Wall Decor Spec</h1>
      <div className="sub">All units cm unless noted. Framed wall sign + wall sconce (2 kinds). Sign text is a stock retail phrase — no real-house wording ships in this repo. The sign's outer frame (depth) projects forward past its inner panel/body (panelDepth) by their difference.</div>

      <div className="grid">
        <div className="card full">
          <div className="seg">
            <button className={isSign ? 'active' : ''} onClick={() => setItem('sign')}>Wall sign</button>
            <button className={!isSign ? 'active' : ''} onClick={() => setItem('sconce')}>Wall sconce</button>
          </div>
          {!isSign && (
            <div className="seg">
              {Object.keys(SCONCE_PRESETS).map(kind => (
                <button key={kind} className={sconceKind === kind ? 'active' : ''}
                  onClick={() => selectPreset(kind)}>{SCONCE_PRESETS[kind].label}</button>
              ))}
            </div>
          )}
        </div>

        <div className="card full">
          <h2>3D — {isSign ? 'wall sign' : SCONCE_PRESETS[sconceKind].label}</h2>
          {isSign ? (
            <ThreeView
              key="sign"
              t={signT}
              buildModel={buildSign}
              heightOf={tt => tt.height * 0.01 + 0.2}
            />
          ) : (
            <ThreeView
              key={'sconce-' + sconceKind}
              t={sconceT}
              buildModel={buildSconce}
              heightOf={heightOf}
            />
          )}
        </div>
      </div>

      <TweaksPanel>
        {isSign ? (
          <>
            <TweakSection label="Sign — frame" />
            <TweakSlider label="Width" value={signT.width} min={60} max={200} step={1} unit="cm"
              onChange={v => setSignTweak('width', v)} />
            <TweakSlider label="Height" value={signT.height} min={20} max={100} step={1} unit="cm"
              onChange={v => setSignTweak('height', v)} />
            <TweakSlider label="Depth (outer frame)" value={signT.depth} min={1} max={8} step={0.5} unit="cm"
              onChange={v => setSignTweak('depth', v)} />
            <TweakSlider label="Panel depth (inner body)" value={signT.panelDepth} min={0.5} max={signT.depth} step={0.5} unit="cm"
              onChange={v => setSignTweak('panelDepth', v)} />
            <TweakSlider label="Frame thickness" value={signT.frameThickness} min={1} max={10} step={0.5} unit="cm"
              onChange={v => setSignTweak('frameThickness', v)} />
            <TweakColor label="Frame colour" value={signT.frameColor}
              onChange={v => setSignTweak('frameColor', v)} />
            <TweakColor label="Panel colour" value={signT.panelColor}
              onChange={v => setSignTweak('panelColor', v)} />
            <TweakSection label="Sign — text" />
            <TweakText label="Line 1 (serif caps)" value={signT.line1}
              onChange={v => setSignTweak('line1', v)} />
            <TweakText label="Line 2 (script)" value={signT.line2}
              onChange={v => setSignTweak('line2', v)} />
            <TweakColor label="Text colour" value={signT.textColor}
              onChange={v => setSignTweak('textColor', v)} />
          </>
        ) : sconceKind === 'up-down' ? (
          <>
            <TweakSection label="Up/down — geometry" />
            <TweakSlider label="Backplate width" value={sconceT.width} min={8} max={24} step={1} unit="cm"
              onChange={v => setSconceTweak('width', v)} />
            <TweakSlider label="Backplate height" value={sconceT.height} min={14} max={32} step={1} unit="cm"
              onChange={v => setSconceTweak('height', v)} />
            <TweakSlider label="Body height" value={sconceT.bodyHeight} min={6} max={20} step={1} unit="cm"
              onChange={v => setSconceTweak('bodyHeight', v)} />
            <TweakSlider label="Lens diameter" value={sconceT.lensDiameter} min={1.5} max={5} step={0.5} unit="cm"
              onChange={v => setSconceTweak('lensDiameter', v)} />
            <TweakSection label="Up/down — finish" />
            <TweakColor label="Metal colour" value={sconceT.metalColor}
              onChange={v => setSconceTweak('metalColor', v)} />
            <TweakToggle label="On (glow)" value={sconceT.on}
              onChange={v => setSconceTweak('on', v)} />
          </>
        ) : (
          <>
            <TweakSection label="Swing-arm — geometry" />
            <TweakSlider label="Arm length" value={sconceT.armLength} min={10} max={40} step={1} unit="cm"
              onChange={v => setSconceTweak('armLength', v)} />
            <TweakSlider label="Drop length" value={sconceT.dropLength} min={5} max={40} step={1} unit="cm"
              onChange={v => setSconceTweak('dropLength', v)} />
            <TweakSlider label="Globe diameter" value={sconceT.globeDiameter} min={8} max={30} step={1} unit="cm"
              onChange={v => setSconceTweak('globeDiameter', v)} />
            <TweakSection label="Swing-arm — finish" />
            <TweakColor label="Metal colour" value={sconceT.metalColor}
              onChange={v => setSconceTweak('metalColor', v)} />
            <TweakColor label="Glass colour" value={sconceT.glassColor}
              onChange={v => setSconceTweak('glassColor', v)} />
            <TweakToggle label="On (glow)" value={sconceT.on}
              onChange={v => setSconceTweak('on', v)} />
          </>
        )}
        <TweakSection label="Export" />
        <TweakButton label={copied ? 'Copied!' : 'Copy as furniture JSON'} onClick={copyJson} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Standalone viewing (opened directly at a /w URL, no design-tool host):
// the shared TweaksPanel stays closed until it receives __activate_edit_mode.
// Self-post it so the panel is visible when there's no host driving it.
setTimeout(() => window.postMessage({ type: '__activate_edit_mode' }, '*'), 0);
</script>
</body>
</html>
